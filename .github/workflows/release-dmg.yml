# Build the installable Sutra.dmg and attach it to a GitHub Release.
# BEFORE TAGGING: marketplace/plugin/sutra-ui/release-checklist.md -- checks 1-4 are blocking.
#
# WHY A RELEASE ASSET AND NOT THE WEBSITE
# ---------------------------------------
# The site is GitHub Pages, served straight out of this repository, and git
# rejects any pushed file over 100 MB. A bundled DMG is 310-393 MB because it
# carries its own CPython and Node. Release assets have no such limit, so the
# DMG ships here and website/index.html links to
#   /releases/latest/download/Sutra-<arch>.dmg
# which always resolves to the newest release carrying that asset name. The
# asset is therefore RENAMED to a stable, version-free name on upload -- the
# versioned filename lives in the release title and notes.
#
# THE DELTA LANE (2026-09-25). Beside each stable DMG the leg also publishes
#   Sutra-<arch>.manifest.json   every path in the signed app: sha256, mode, link
#   Sutra-<arch>.delta.tar.xz    per-file deltas from the PREVIOUS stable release
# plus their .sha256 files. An installed app rebuilds the new bundle from itself
# and the pack (marketplace/plugin/sutra-ui/updates_delta.py), then runs the
# same gates the DMG path runs. Measured on 2.300.0 -> 2.302.0: 0.48 MB instead
# of 310 MB. The pack is PROVED in this workflow before upload: the previous
# DMG's app plus the pack must rebuild this DMG's app byte-for-byte and pass
# codesign, or the leg fails. Betas skip the lane (a beta never auto-updates).
#
# THIS WORKFLOW OWNS THOSE ASSET NAMES. Do not also upload them by hand. Each
# leg publishes one Sutra-<arch>.dmg plus its own Sutra-<arch>.dmg.sha256, and
# a re-run REPLACES the DMG -- so a hand-uploaded aggregate checksum file goes
# stale silently and `shasum -c` then reports a FAILED download, which reads as
# corruption rather than as bookkeeping. That happened once; per-asset
# checksums written by the same leg that built the asset are why it cannot
# happen again (and why there is no cross-leg race over one shared file).
#
# SIGNING
# -------
# Without a Developer ID certificate this produces an AD-HOC signed DMG: it
# installs and runs, but a first launch on another Mac needs right-click ->
# Open. Add the four secrets below and the same workflow signs and notarizes
# properly, no edits needed:
#
#   APPLE_CERT_P12        base64 of a Developer ID Application .p12
#   APPLE_CERT_PASSWORD   its password
#   APPLE_NOTARY_KEY      base64 of an App Store Connect .p8 key
#   APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER
#
# Runner note: the matrix builds each arch NATIVELY, which matters beyond
# convenience -- the post-package step actually RUNS the bundled interpreter,
# and a cross-built one needs Rosetta, which the runners do not have.
#
# LABELS ROT, AND A DEAD ONE DOES NOT FAIL -- IT HANGS. `macos-13` was the Intel
# label; it has since been RETIRED, and a job asking for a retired label is never
# assigned a runner. It does not error: it sits in `queued` with started_at:null
# indefinitely (observed here for 45 minutes) while the rest of the run reports
# success, so the release quietly ends up carrying one architecture. `macos-14`
# is likewise now deprecated.
#
# Current standard (free on public repos) labels, per actions/runner-images:
#   arm64  macos-15 / macos-26 / macos-latest
#   Intel  macos-15-intel / macos-26-intel
# The `-large` / `-xlarge` variants are LARGER runners and need a paid plan --
# not these. If a leg ever hangs in `queued` again, check this list first.
name: release-dmg

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the DMG to (must already exist)"
        required: true

permissions:
  contents: write        # required to upload a release asset

jobs:
  # THE TAG IS A CLAIM ABOUT THE TREE, AND THE TREE MUST AGREE. v2.224.5-desktop
  # was once pushed while both manifests still said 2.224.4 (a changelog-only
  # bump), so the release advertised a version the payload did not carry. This
  # check is cheap and the matrix legs are not: it runs first, on ubuntu, so a
  # mismatched tag costs seconds and zero macOS minutes. On workflow_dispatch
  # the build uses the DISPATCHED ref's tree, not the tag's commit -- comparing
  # that tree against the tag is exactly the assertion wanted: the tag must
  # describe what actually ships. Consequence for REPAIR runs: once main's
  # manifests move past a tag, a repair dispatched from main refuses (as it
  # should -- it would ship a newer tree under an old name); dispatch repairs
  # from the tag's own ref instead.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the plugin manifests
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*-desktop) ;;
            *) echo "::error::tag '$TAG' is not vX.Y.Z[-beta.N]-desktop -- this pipeline only releases desktop tags"
               exit 1 ;;
          esac
          want="${TAG#v}"; want="${want%-desktop}"
          # A beta tag is vX.Y.Z-beta.N-desktop: strip the -beta.N so it is
          # validated against the SAME base version in the manifests. This lets a
          # branch cut beta.1, beta.2 ... of one target version without bumping
          # the manifests each time; only the promote-to-stable tag needs them at
          # exactly X.Y.Z. (Channel is recomputed from the tag in the jobs that
          # need it -- a $GITHUB_ENV here would not cross into the dmg job.)
          want="${want%-beta.*}"
          plugin="$(jq -r .version marketplace/plugin/.claude-plugin/plugin.json)"
          market="$(jq -r '.plugins[] | select(.name=="core") | .version' .claude-plugin/marketplace.json)"
          echo "tag=$want  plugin.json=$plugin  marketplace.json(core)=$market"
          if [ "$want" != "$plugin" ] || [ "$want" != "$market" ]; then
            echo "::error::tag $TAG claims $want but plugin.json says $plugin and marketplace.json (core) says $market. Bump the manifests, or cut the tag that matches them. Repairing an OLD release? Dispatch from the tag's own ref: gh workflow run release-dmg -f tag=$TAG --ref refs/tags/$TAG"
            exit 1
          fi
          echo "version guard OK: $want"

  dmg:
    needs: guard
    strategy:
      fail-fast: false        # an Intel failure must not delete the arm64 build
      matrix:
        include:
          # `runner`, not `runs-on`: a matrix property whose name collides with a
          # reserved workflow key reads as a mistake and has to be dereferenced
          # around the hyphen. The value is what runs-on consumes either way.
          - arch: arm64
            runner: macos-15          # Apple Silicon
          - arch: x86_64
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # A step's own `if:` cannot see the `secrets` context at all -- GitHub rejects
    # the WHOLE FILE with "Unrecognized named-value: 'secrets'" before it starts a
    # single job (a 0s failed run with no jobs, which is what happened three times).
    # Per the official context-availability table, `jobs.<id>.steps.if` gets
    # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs -- `env` yes,
    # `secrets` no. And a STEP-level env is not visible to that step's own `if`
    # either, because the condition is evaluated before the step's env exists.
    # So the presence check is hoisted to a JOB-level env, which may read secrets.
    #
    # It publishes a BOOLEAN, never the secret: job-level env is visible to every
    # step, and there is no reason for the certificate itself to be.
    env:
      HAVE_SIGNING_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache the CPython download
        uses: actions/cache@v4
        with:
          path: ~/.cache/sutra-bundle
          key: sutra-bundle-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Install Electron toolchain
        working-directory: marketplace/plugin/sutra-ui/electron
        run: npm install --no-audit --no-fund

      - name: Provisioning tests
        working-directory: marketplace/plugin/sutra-ui/electron
        run: node test_provision.js

      # SHADOW SHIPS IN THE DMG, SO SHADOW IS TESTED BEFORE THE DMG IS BUILT.
      # Until 2026-09-16 this step ran three suites out of the directory and
      # every test_shadow_*.js was invisible here -- a regression in Shadow
      # home, the overlay or the settings screen reached a release without
      # failing a single leg. release-checklist.md check 2 is that hole.
      #
      # LISTED ONE PER LINE ON PURPOSE, not globbed. The checklist counts the
      # per-suite invocation lines in this file to prove the wiring exists, and
      # a `for` loop would satisfy the build while answering 1 to the check
      # that is supposed to police it. Keep the counted pattern out of these
      # comments for the same reason -- a comment that matches it inflates the
      # number and the check lies in the safe direction. The cost is that a NEW
      # suite must be added here by hand; that is exactly the drift that
      # produced the stale count, so the checklist now pins it to the tree.
      - name: Panel tests
        working-directory: marketplace/plugin/sutra-ui
        run: |
          node test_panel.js
          node test_nav.js
          node test_charter_filter.js
          node test_shadow_completion_ui.js
          node test_shadow_compose_focus.js
          node test_shadow_conversation.js
          node test_shadow_conversation_model.js
          node test_shadow_decision_ui.js
          node test_shadow_done_history.js
          node test_shadow_delegate_focus.js
          node test_shadow_floor_needs_you.js
          node test_shadow_hi_trace.js
          node test_shadow_home.js
          node test_shadow_intervention_ui.js
          node test_shadow_live_refresh.js
          node test_shadow_nontask_conv.js
          node test_shadow_now.js
          node test_shadow_order.js
          node test_shadow_overlay.js
          node test_shadow_presence.js
          node test_shadow_rhs.js
          node test_shadow_task_chat.js
          node test_shadow_task_spinner.js
          node test_shadow_task_status.js
          node test_shadow_v4_approve.js
          node test_shadow_v42_ui.js
          node test_shadow_d81_ui.js
          node test_shadow_v41_ui.js
          node test_shadow_v4_now.js
          node test_shadow_v4_oversee.js
          node test_shadow_v4_prose.js
          node test_shadow_v4_report.js
          node test_shadow_v4_sheet.js
          node test_shadow_v4_shell.js
          node test_shadow_v4_summary.js
          node test_shadow_v4_talk.js
          node test_shadow_v4_taskchat.js

      # The importer and the engine are what the shipped payload runs.
      # A DMG that fails these is not worth uploading.
      - name: Engine + importer tests
        run: python3 -m unittest discover -s marketplace/plugin/lib/tests -p 'test_*.py'

      - name: Import the signing certificate
        if: env.HAVE_SIGNING_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sutra.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Vendor the runtime
        working-directory: marketplace/plugin/sutra-ui/electron
        run: ./bundle-runtime.sh --arch ${{ matrix.arch }}

      - name: Build the DMG
        working-directory: marketplace/plugin/sutra-ui/electron
        env:
          SUTRA_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          SUTRA_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          # make-dmg.sh refuses to notarize unless this is set (founder
          # direction 2026-08-24: releases come from the pipeline, not from a
          # workstation). THIS is the one place that may set it. Removing it
          # does not make the build unsigned -- it makes the build FAIL, which
          # is the intended direction for that mistake.
          SUTRA_RELEASE_CI: "1"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_NOTARY_KEY:-}" ]; then
            printf '%s' "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export SUTRA_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          # A -beta.N tag builds the coexisting "Sutra Beta" app (own id, port,
          # data); anything else builds stable. Computed here from the tag, not
          # inherited from guard (env does not cross jobs).
          case "$TAG" in *-beta.*-desktop) export SUTRA_CHANNEL=beta ;; *) export SUTRA_CHANNEL=stable ;; esac
          echo "building channel: $SUTRA_CHANNEL"
          ./make-dmg.sh --arch ${{ matrix.arch }}
          rm -f "$RUNNER_TEMP/notary.p8"

      # A release must never CLAIM notarization it did not get. make-dmg.sh
      # degrades to ad-hoc on purpose (so a contributor without credentials can
      # still build), and that same tolerance would let a real release ship
      # silently unsigned -- every downloader then meets "Apple could not verify
      # Sutra is free of malware", whose only buttons are Done and Move to Bin.
      # When a signing certificate WAS supplied, the ticket must be stapled.
      - name: A signed build must actually be notarized
        if: env.HAVE_SIGNING_CERT == 'true'
        working-directory: marketplace/plugin/sutra-ui/electron/dist
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg | head -1)"
          if ! xcrun stapler validate "$dmg"; then
            echo "::error::$dmg is NOT stapled. A certificate was provided, so this"
            echo "build was expected to be notarized. Shipping it would hand every"
            echo "downloader a Gatekeeper block. Check the notarytool log above."
            exit 1
          fi
          echo "stapled: $dmg"

      # A stable asset name is what makes /releases/latest/download/... work
      # from the website without editing the page every release.
      - name: Name the asset for the website link
        id: asset
        working-directory: marketplace/plugin/sutra-ui/electron/dist
        run: |
          set -euo pipefail
          built="$(ls *.dmg | head -1)"
          cp "$built" "Sutra-${{ matrix.arch }}.dmg"
          shasum -a 256 "Sutra-${{ matrix.arch }}.dmg" > "Sutra-${{ matrix.arch }}.dmg.sha256"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          # NOT a hardcoded Sutra-arm64.dmg: on the Intel leg that file does not
          # exist and `set -e` would fail the whole build on a size lookup.
          echo "size=$(du -h "Sutra-${{ matrix.arch }}.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # NEVER REPLACE A NOTARIZED ASSET WITH AN AD-HOC ONE.
      #
      # make-dmg.sh degrades to ad-hoc when no certificate is present, and the
      # upload below clobbers by design (a re-run must be able to fix a bad
      # asset). Together those are a downgrade path: run this workflow without
      # APPLE_CERT_P12 against a tag whose release already carries notarized
      # DMGs, and every downloader silently gets the Gatekeeper block back --
      # "Apple could not verify", whose only buttons are Done and Move to Bin.
      #
      # So an unsigned build refuses to overwrite a signed one. It still uploads
      # to a release that has no DMG yet, which is what a first release needs.
      - name: Refuse to downgrade a notarized release
        if: env.HAVE_SIGNING_CERT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY"                         --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || true)"
          case "$existing" in
            *Sutra-*.dmg*)
              echo "::error::Release $TAG already carries a DMG, and THIS build is"
              echo "ad-hoc signed (no APPLE_CERT_P12 secret). Uploading would replace a"
              echo "notarized download with an unsigned one and reinstate the Gatekeeper"
              echo "block for every user. Add the signing secrets, or cut a new tag."
              exit 1 ;;
            *) echo "no DMG on $TAG yet — an unsigned first upload is allowed" ;;
          esac

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # A -beta.N tag is a PRERELEASE: GitHub never returns it from
          # /releases/latest, so the production auto-updater (updates.py reads
          # releases/latest) and the website download link ignore it entirely.
          # That single flag is what keeps a beta invisible to everyone who did
          # not deliberately install it.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-beta.') }}
          files: |
            marketplace/plugin/sutra-ui/electron/dist/Sutra-${{ matrix.arch }}.dmg
            marketplace/plugin/sutra-ui/electron/dist/Sutra-${{ matrix.arch }}.dmg.sha256
          # IDENTICAL from both legs, and arch-neutral. Each leg uploads its own
          # asset but they share one release, so a body that named "this" arch
          # would be overwritten by whichever leg finished last and the release
          # would describe only half of what it carries.
          body: |
            Drag to Applications and open. Sutra carries its own Python runtime — no
            Python, Node, Xcode or network needed to install. First launch also installs
            the Sutra plugin for Claude Code and lists every path it writes.

            | Download | For |
            |---|---|
            | `Sutra-arm64.dmg` | Apple Silicon (M1–M4) |
            | `Sutra-x86_64.dmg` | Intel |

            Not sure which? Apple menu → About This Mac. "Apple M…" is arm64.

            Verify your download:
            `shasum -a 256 -c Sutra-<arch>.dmg.sha256`

            The panel serves on 127.0.0.1:8330, loopback only, and refuses to start if
            `ANTHROPIC_API_KEY` is set — so it always bills your Max plan rather than the
            per-token API.

      # THE DELTA LANE. Runs AFTER the DMG upload, from the DMG this leg just
      # published (never from a rebuild: re-signing makes every build differ),
      # against the previous STABLE release's DMG for the same arch. Betas run
      # it too (D80: every version is a beta first), so the proof happens on a
      # prerelease nobody auto-updates from; a beta's assets sit on its own
      # prerelease and never reach /releases/latest. The manifest is always
      # produced; the pack only when a previous stable exists and the pack is
      # worth it (< 50% of the DMG). Channel and bundle id follow the tag.
      #
      # PROOF BEFORE UPLOAD: the previous app plus the pack is rebuilt with the
      # client's own code, compared byte-for-byte with the app in this DMG, and
      # passed through codesign --verify --deep --strict. A pack that cannot do
      # that is not uploaded, and the leg fails so nobody ships it by hand.
      - name: Build and prove the delta manifest and pack
        id: delta
        working-directory: marketplace/plugin/sutra-ui
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="$PWD/electron/dist-delta"; mkdir -p "$OUT"
          NEW_DMG="$PWD/electron/dist/Sutra-$ARCH.dmg"
          ver="${TAG#v}"; ver="${ver%-desktop}"
          case "$TAG" in *-beta.*-desktop) CH=beta ;; *) CH=stable ;; esac
          ver="${ver%-beta.*}"
          # Previous stable by SEMVER over tag names, never by list order or
          # date, and never /releases/latest (which is already this tag).
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
                    --limit 100 --json tagName --jq '.[].tagName' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-desktop$' | grep -vx "$TAG" \
                  | sed 's/^v//; s/-desktop$//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
          echo "this=$ver previous_stable=${prev:-none}"
          NEWM="$(mktemp -d "$RUNNER_TEMP/new.XXXXXX")"; OLDM=""
          cleanup() { hdiutil detach "$NEWM" -quiet 2>/dev/null || true; [ -n "$OLDM" ] && hdiutil detach "$OLDM" -quiet 2>/dev/null || true; }
          trap cleanup EXIT
          hdiutil attach "$NEW_DMG" -nobrowse -readonly -noautoopen -mountpoint "$NEWM" >/dev/null
          # "Sutra.app" on stable, "Sutra Beta.app" on a beta: discover, never assume.
          NEW_APP="$(find "$NEWM" -maxdepth 1 -name '*.app' | head -1)"
          [ -d "$NEW_APP" ] || { echo "::error::no .app inside $NEW_DMG"; exit 1; }
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$NEW_APP/Contents/Info.plist")"
          prev_args=(); [ -n "$prev" ] && prev_args=(--previous "$prev")
          python3 -m updates_delta manifest "$NEW_APP" --version "$ver" --arch "$ARCH" --channel "$CH" \
            --bundle-id "$BUNDLE_ID" --tag "$TAG" "${prev_args[@]}" \
            --out "$OUT/Sutra-$ARCH.manifest.json"
          if [ -n "$prev" ]; then
            gh release download "v$prev-desktop" --repo "$GITHUB_REPOSITORY" -p "Sutra-$ARCH.dmg" \
              -D "$RUNNER_TEMP/prev" --clobber
            OLDM="$(mktemp -d "$RUNNER_TEMP/old.XXXXXX")"
            hdiutil attach "$RUNNER_TEMP/prev/Sutra-$ARCH.dmg" -nobrowse -readonly -noautoopen -mountpoint "$OLDM" >/dev/null
            python3 -m updates_delta pack "$OLDM/Sutra.app" "$NEW_APP" --manifest "$OUT/Sutra-$ARCH.manifest.json" \
              --from-version "$prev" --out "$OUT/Sutra-$ARCH.delta.tar.xz"
            pack_bytes=$(stat -f%z "$OUT/Sutra-$ARCH.delta.tar.xz"); dmg_bytes=$(stat -f%z "$NEW_DMG")
            echo "pack=$pack_bytes bytes, dmg=$dmg_bytes bytes"
            if [ "$pack_bytes" -gt $(( dmg_bytes / 2 )) ]; then
              echo "::warning::delta pack for $ARCH is $pack_bytes bytes, over half the DMG; publishing the manifest only"
              rm -f "$OUT/Sutra-$ARCH.delta.tar.xz"
            else
              # THE PROOF. Same code the client runs, on a writable copy of the old app.
              cp -R "$OLDM/Sutra.app" "$RUNNER_TEMP/base.app"
              python3 -m updates_delta reconstruct "$RUNNER_TEMP/base.app" --manifest "$OUT/Sutra-$ARCH.manifest.json" \
                --pack "$OUT/Sutra-$ARCH.delta.tar.xz" --dest "$RUNNER_TEMP/rebuilt.app"
              diff -rq "$RUNNER_TEMP/rebuilt.app" "$NEW_APP"
              codesign --verify --deep --strict "$RUNNER_TEMP/rebuilt.app"
              echo "reconstructed $ARCH from $prev: OK"
            fi
          else
            echo "::notice::no previous stable release found; manifest only (first delta-capable release)"
          fi
          cd "$OUT"
          for f in "Sutra-$ARCH.manifest.json" "Sutra-$ARCH.delta.tar.xz"; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      # Same rule as the DMG: this leg writes its own checksums and uploads its
      # own four files. A pack that was withheld above simply is not here.
      - uses: softprops/action-gh-release@v2
        if: ${{ steps.delta.outcome == 'success' }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-beta.') }}
          files: |
            marketplace/plugin/sutra-ui/electron/dist-delta/Sutra-${{ matrix.arch }}.manifest.json
            marketplace/plugin/sutra-ui/electron/dist-delta/Sutra-${{ matrix.arch }}.manifest.json.sha256
            marketplace/plugin/sutra-ui/electron/dist-delta/Sutra-${{ matrix.arch }}.delta.tar.xz
            marketplace/plugin/sutra-ui/electron/dist-delta/Sutra-${{ matrix.arch }}.delta.tar.xz.sha256

  # A release that carries ONE architecture is a broken release, and the way it
  # happens is quiet: a leg dies (or, before the label fix, hung forever on a
  # retired runner) while the other leg succeeds, uploads, and the run reports
  # green. Nobody notices until an Intel user downloads an arm64 DMG.
  #
  # if: always() so this runs even when a matrix leg failed -- the default would
  # SKIP it exactly when it is needed. It asserts against the published release,
  # not against job status, because what shipped is the only thing that matters.
  verify:
    needs: [guard, dmg]
    # Still runs when a matrix leg failed (that is its whole point), but never
    # after the guard refused -- a guard failure would otherwise surface here as
    # a misleading "missing assets" error on a release that was never attempted.
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Both architectures must be on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                      --json assets --jq '.assets[].name')"
          echo "$assets" | sed 's/^/  /'
          missing=""
          wanted="Sutra-arm64.dmg Sutra-arm64.dmg.sha256 Sutra-x86_64.dmg Sutra-x86_64.dmg.sha256"
          # A stable release also carries a manifest per arch (the delta lane's
          # anchor). The pack is optional -- withheld when no previous stable
          # exists or when it would not save bytes -- so it is not required.
          case "$TAG" in
            *-beta.*) ;;
            *) wanted="$wanted Sutra-arm64.manifest.json Sutra-arm64.manifest.json.sha256 Sutra-x86_64.manifest.json Sutra-x86_64.manifest.json.sha256" ;;
          esac
          for want in $wanted; do
            printf '%s\n' "$assets" | grep -qx "$want" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::release $TAG is missing:$missing"
            echo "A one-architecture release is not shippable. Check whether a matrix"
            echo "leg failed, or was never assigned a runner (a retired runner label"
            echo "queues forever instead of failing)."
            exit 1
          fi
          echo "both architectures present, each with its checksum"
