<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sutra</title>
<link rel="stylesheet" href="/ui/css/j2-shell.css">
<link rel="stylesheet" href="/ui/css/sutra-graph.css"><link rel="stylesheet" href="/ui/css/sutra-panel.css"><link rel="stylesheet" href="/ui/css/sutra-shell.css"><link rel="stylesheet" href="/ui/css/sutra-front.css">
<!--SUTRA-BOOT-->
<script src="/ui/js/sutra_ctx.js"></script>
<script src="/ui/js/tab_heal.js"></script>
<script>/* before the first paint: the viewer's Appearance (Settings sets it: light, dark or system; light by default, as the team pages; one choice for Home and
   the team pages), and which place of Home shows: the front door, or the workspace (a deep link, or where a Manager or Debug owner was last; home.js keeps it) */
try { var tp = localStorage.getItem("j2theme"); document.documentElement.dataset.theme = tp === "dark" ? "dark" : tp === "system" && !matchMedia("(prefers-color-scheme: light)").matches ? "dark" : "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }
try { var hq = new URLSearchParams(location.search), lv = localStorage.getItem("sutra:level"); document.documentElement.dataset.place = hq.has("pane") || hq.has("node") || hq.has("change") || ((lv === "manager" || lv === "debug") && localStorage.getItem("sutra:home:place") === "ws") ? "ws" : "front"; } catch (e) { document.documentElement.dataset.place = "front"; }</script>
</head>
<body class="simple home">
<!-- The front door (front_door.js, painted by home.js): one place to start. What needs you first, then what is running and what finished, and a box
     for a new project. The level (Simple, Manager, Debug; SutraCtx.level) adds the views below it: the workspace further down is where they open. -->
<div id="front" class="front">
  <header class="fdtop">
    <div class="fdorg" id="fdorg" data-slot="org-switcher"><span class="fdmark" aria-hidden="true"></span><b id="fdorgname">Sutra</b></div>
    <nav class="fdnav" id="fdnav" aria-label="More views" hidden></nav>
    <div class="fdlevel" id="fdlevel" role="group" aria-label="How much to show">
      <button type="button" data-level="simple" aria-pressed="true" title="What needs you, what runs, what finished">Simple</button>
      <button type="button" data-level="manager" aria-pressed="false" title="Adds the org chart, the workflow graph, team chats and each team's Detailed view">Manager</button>
      <button type="button" data-level="debug" aria-pressed="false" title="Adds settings, usage and log, the full Heads up lane and the raw AI chat">Debug</button>
    </div>
  </header>
  <main class="fdmain" id="fdmain">
    <section class="fdnew" aria-labelledby="fd-new-h">
      <h1 class="fdtitle" id="fd-new-h">What should we make?</h1>
      <div class="fdcompose"><textarea id="fdbox" rows="3" aria-label="A new project" placeholder="A one-page website for my cafe, with the menu and opening hours&hellip;" maxlength="20000"></textarea>
        <div class="fdcfoot"><p class="fdtry">Try: <button type="button" class="fdtrylink" data-act="fd-try" data-text="A website for my cafe: menu, opening hours, how to find us">a cafe website</button> &middot; <button type="button" class="fdtrylink" data-act="fd-try" data-text="A one-page website for my bakery, with cake orders and contact">a bakery page</button></p><button type="button" class="fdbtn fdyes fdstart" id="fdsend">Start</button></div></div>
      <div id="fdfaces"></div>
      <div id="fdlatest"></div>
    </section>
    <section class="fdneeds" id="fdneeds" aria-live="polite" tabindex="-1"></section>
    <div id="fdlists"></div>
    <div id="fddebug"></div>
  </main>
</div>
<!-- Home: the J2 Simple skeleton. Left, the org chat with the chat agent (the Root node's session cs_org). Right, J2's preview slot (.sprev.sright): what needs you,
     then one pane at a time: Workflow graph, Org chart or Settings, chosen from the rail. Phone: J2's Chat | Graph toggle (.stoggle, has-site, sp-preview). -->
<div id="sview">
  <header class="shead"><button type="button" class="linkbtn gofront" id="gofront">&larr; Home</button><b id="stitle">Sutra</b><span class="meta" id="sotype">&middot; your teams</span><span class="spacer"></span></header>
  <main class="smain">
    <div class="stoggle" role="tablist" aria-label="Show"><button type="button" role="tab" data-show="chat" aria-selected="true">Chat</button><button type="button" role="tab" data-show="right" aria-selected="false">Graph</button></div>
    <section class="schat" id="schat" aria-label="Chat with Sutra">
      <div class="cswitch" id="cswitch" role="tablist" aria-label="Chats" hidden></div>
      <div class="sprog" id="sprog" aria-label="Progress" hidden></div>
      <div class="smsgs" id="smsgs" aria-live="polite"></div>
      <div class="cjump" id="sjump" hidden></div>
      <div class="ccstream" id="sstream" hidden></div>
      <div class="sbanner" id="sbanner" role="alert" hidden></div>
      <div class="sstatus" id="sstatus" role="status"></div>
      <div class="snote" id="snote" hidden></div>
      <div class="npill" id="spill" hidden></div>
      <div class="scompose" id="scompose"><div class="ccbar" id="sbar" hidden></div><div class="row"><textarea id="sbox" aria-label="Your message" placeholder="Tell Sutra what you need&hellip;"></textarea><button class="send" id="ssend" type="button">Send</button></div></div>
      <section class="npinline" id="teamchat" aria-labelledby="npititle" hidden></section>
    </section>
    <section class="sprev sright" id="sright" aria-label="Teams and settings">
      <section class="needs" id="needs" aria-label="Needs you" tabindex="-1"></section>
      <div class="pane" id="pane-graph"></div>
      <div class="pane" id="pane-chart" hidden></div>
      <div class="pane" id="pane-settings" hidden>
        <div id="set-appearance"></div>
        <div id="set-connectors"></div>
        <div id="set-models"></div>
        <div id="set-workdir"></div>
        <div id="set-limits"></div>
        <div id="set-notices"></div>
        <div id="set-recurring"></div>
        <div id="set-engine"></div>
        <div id="set-notes"></div>
        <div id="set-about"></div>
      </div>
    </section>
  </main>
</div>
<div id="dview">
<button type="button" id="railtoggle" aria-controls="rail" aria-expanded="true" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="barbadge" id="barbadge" hidden></span></button>
<nav class="rail tabs" id="rail" aria-label="Sections">
  <button type="button" id="gochat" aria-current="page"><span>Chat</span></button>
  <button type="button" data-pane="graph" aria-current="true"><span>Workflow graph</span></button>
  <button type="button" data-pane="chart"><span>Org chart</span></button>
  <div class="railsec" aria-labelledby="rail-teams-h"><h3 class="railhead" id="rail-teams-h">Teams</h3><input type="search" id="railfind" class="railfind" placeholder="Find a team or its work" aria-label="Find a team or its work" autocomplete="off" maxlength="200"><div id="railfindres" class="railfindres" role="region" aria-label="Search results" hidden></div><div id="railteams"></div></div>
  <div class="railsec" id="railsettings" aria-labelledby="rail-settings-h"><h3 class="railhead" id="rail-settings-h">Settings</h3>
    <button type="button" data-pane="settings" data-group="appearance"><span>Appearance</span></button>
    <button type="button" data-pane="settings" data-group="connectors"><span>Connectors</span></button>
    <button type="button" data-pane="settings" data-group="limits"><span>Limits</span></button>
    <button type="button" data-pane="settings" data-group="notices"><span>Notifications</span></button>
    <button type="button" data-pane="settings" data-group="recurring"><span>Recurring work</span></button>
    <button type="button" data-pane="settings" data-group="engine"><span>Engine</span></button>
    <button type="button" data-pane="settings" data-group="notes"><span>Notes</span></button>
    <button type="button" data-pane="settings" data-group="about"><span>About</span></button>
  </div>
  <div class="railsec" id="railowner" aria-labelledby="rail-owner-h"><h3 class="railhead" id="rail-owner-h">Owner</h3>
    <a class="railteam" href="/console" id="goconsole"><span class="rtname">Usage and log</span><span class="rtstat">cost, Atom log, health</span></a>
  </div>
</nav>
</div>
<aside id="nodepanel" class="agentdrawer" hidden role="dialog" aria-labelledby="nptitle"></aside>

<script src="/ui/js/chat_pill.js"></script>
<script src="/ui/js/agent_chats.js"></script>
<script src="/ui/js/chat_fold.js"></script>
<script src="/ui/js/chat_search.js"></script>
<script src="/ui/js/chat_composer.js"></script>
<script src="/ui/js/chat_draft.js"></script>

<script src="/ui/js/chat_switch.js"></script>
<script src="/ui/js/node_panel.js"></script>
<script src="/ui/js/plan_meter.js"></script>
<script src="/ui/js/settings_view.js"></script>
<script src="/ui/js/limits_view.js"></script>
<script src="/ui/js/recurring_view.js"></script>

<script src="/ui/js/welcome.js"></script>
<script src="/ui/js/front_door.js"></script><script src="/ui/js/home.js"></script>
</body>
</html>
