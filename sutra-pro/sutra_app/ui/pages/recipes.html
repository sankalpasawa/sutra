<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Recipes - Sutra</title>
<link rel="stylesheet" href="/ui/css/j2-shell.css">
<link rel="stylesheet" href="/ui/css/sutra-panel.css"><link rel="stylesheet" href="/ui/css/sutra-console.css"><link rel="stylesheet" href="/ui/css/sutra-project.css"><link rel="stylesheet" href="/ui/css/sutra-work.css"><link rel="stylesheet" href="/ui/css/sutra-recipes.css">
<!--SUTRA-BOOT-->
<script src="/ui/js/sutra_ctx.js"></script>
<script>/* the viewer's Appearance before the first paint (Home's Settings sets it): light, dark or system; dark by default; one choice for every page */
try { var tp = localStorage.getItem("j2theme"); document.documentElement.dataset.theme = tp === "light" ? "light" : tp === "system" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
</head>
<body class="console project work recipes">
<!-- Recipes: a way of working you save and start again. Starting one writes a request in plain words and sends it the way any request goes: Sutra plans it again and asks what it asks. This page exists only
     while SUTRA_RECIPES_V1 is on (the server answers 404 otherwise). It holds no data of its own: recipe_page.js fills it from /api/recipes. -->
<header class="shead"><a class="ghost" href="/">&larr; Home</a><b id="stitle">Recipes</b><span class="meta" id="r-state" role="status"></span><span class="spacer"></span></header>
<main class="cmain" id="recipes-root">
  <section class="cpanel" id="r-list" aria-label="Recipes"><p class="cempty">Loading&hellip;</p></section>
  <section class="cpanel" id="r-detail" aria-label="One recipe" aria-live="polite" tabindex="-1"></section>
</main>
<script src="/ui/js/recipe_view.js"></script>
<script src="/ui/js/recipe_page.js"></script>
</body>
</html>
