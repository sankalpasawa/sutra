<script src="/ui/js/sutra_ctx.js"></script>
<script>/* the viewer's Appearance before the first paint, and after it (D396). The owner's own choice, light or dark (the key `j2theme` is written only when they pick one on Home or a team page: one choice for every page), wins.
   With none, or "system", this page follows the computer's light or dark setting and changes with it while it is open. A change of the choice in another tab is followed too. */
(function () {
  var root = document.documentElement;
  function chosen() { try { var tp = localStorage.getItem("j2theme"); return tp === "light" || tp === "dark" ? tp : ""; } catch (e) { return ""; } }
  function os() { try { return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (e) { return "dark"; } }
  function apply() { root.dataset.theme = chosen() || os(); }
  apply();
  try { var query = matchMedia("(prefers-color-scheme: light)"); if (query.addEventListener) query.addEventListener("change", apply); else if (query.addListener) query.addListener(apply); } catch (e) { /* no media queries: the first paint stands */ }
  try { addEventListener("storage", function (event) { if (!event.key || event.key === "j2theme") apply(); }); } catch (e) { /* no events */ }
})();</script>
</head>
