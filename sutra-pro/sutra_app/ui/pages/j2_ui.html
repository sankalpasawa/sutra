<script>
const WHO = {user:["Requester (you)","R"],validator:["Validator","V"],identity:["Identity","I"],adaptation:["Adaptation","Ad"],
  priority:["Priority","P"],coordination:["Coordination","C"],builder:["Builder","B"],audit:["Audit","Au"],system:["System","!"]};
// Workflow agents ("W-1") get "W-1 Builder" and a colour from the --wf palette.
const isWf = k => /^W-\d+$/.test(k || "");
const who = k => WHO[k] || (isWf(k) ? [k + " Builder", k.replace("-", "")] : [k, "?"]);
const col = k => isWf(k) ? `var(--wf${(+k.slice(2) - 1) % 6})` : `var(--${k})`;
const $ = id => document.getElementById(id);
// Panes are re-rendered on every poll. Leave a pane alone when its HTML is unchanged, and when it does change, reopen
// any <details> the user had open (matched by data-key), so an opened screenshot or log stays open until closed.
function paint(el, html){
  if (el.__html === html) return;
  const open = new Set([...el.querySelectorAll("details[open][data-key]")].map(d => d.dataset.key));
  el.innerHTML = html; el.__html = html;
  open.forEach(k => { const d = el.querySelector(`details[data-key="${CSS.escape(k)}"]`); if (d) d.open = true; });
}
// Example briefs for both views: different kinds of business, so nothing assumes a cafe.
const EXAMPLES = ["A website for my cafe", "A website for Sweet Crumbs Bakery in Pune: menu, cake orders, contact",
  "A website for Petal & Stem, a florist in Jaipur: bouquets, same-day delivery, wedding flowers",
  "A website for Asha Rao Photography, a wedding and portrait photographer in Mumbai: portfolio, packages, booking"];
// Output types the start page offers (J2_OUTPUT sets the default); the run keeps its type once it starts.
const OUTS = [["auto", "Let the team decide"], ["website", "Website"], ["prd", "PRD document"], ["project", "Project work"]];
const PRD_EXAMPLES = ["Write a PRD for QuickQueue, a mobile app that lets clinic patients join a waiting line remotely. "
  + "Users: patients at small clinics and the front-desk staff who manage the line. Problem: patients wait 45 minutes on "
  + "average in crowded waiting rooms. Must-have features: join the queue from a phone, live position updates, SMS alert "
  + "when 2 patients are ahead, staff dashboard to call the next patient. Constraints: works on low-end Android phones; no "
  + "patient health data stored. Success: average in-room wait under 10 minutes; 60% of patients join remotely within 3 months."];
const examples = s => s.doc ? PRD_EXAMPLES : EXAMPLES;
let EFFOUT = "", PICKEDOUT = "";      // E19: the engine's own default for this team, and what the owner picked on this page
(async () => { try { const r = await (await fetch("/api/engine/settings" + (SutraCtx.dept ? "?dept=" + encodeURIComponent(SutraCtx.dept) : ""), {cache: "no-store"})).json(); EFFOUT = String(((r || {}).effective || {}).output || ""); } catch (e) {} })();
const outOptions = s => { const cur = PICKEDOUT || (s.output && s.output !== "website" ? s.output : "") || EFFOUT || s.output;
  return OUTS.map(([v, l]) => `<option value="${v}"${cur === v ? " selected" : ""}>${l}</option>`).join(""); };
const docLinks = s => (s.docset_files || []).map(d => `<a href="/file/${d.md}${runQ().replace("&", "?")}" download>${esc(d.kind.toUpperCase())} .md</a> <a href="/file/${d.docx}${runQ().replace("&", "?")}" download>${esc(d.kind.toUpperCase())} .docx</a>`).join(" ");
const plainDocLinks = s => (s.docset_files || []).map(d => `<a href="/file/${d.md}${runQ().replace("&", "?")}" download>Download the ${esc(d.label)} (markdown)</a> <a href="/file/${d.docx}${runQ().replace("&", "?")}" download>Download the ${esc(d.label)} (Word file)</a>`).join(" ");
const fileLinks = s => (s.files || []).map(f => `<a href="/file/${f}${runQ().replace("&", "?")}" download>Download ${f.split(".").pop() === "docx" ? "the Word file (.docx)" : "the markdown (.md)"}</a>`).join(" ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Detailed view wording: plain names for J2 terms; the J2 step codes stay, in small grey text.
const dv = t => String(t ?? "").replace(/\benvelope's\b/gi, "limits'").replace(/\benvelopes?\b/gi, "limits")
  .replace(/\bdone[-_ ]when list\b/gi, "checklist").replace(/\bdone[-_ ]when\b/gi, "checklist");
const md = s => esc(dv(s)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/@(\w+)/g,"<b>@$1</b>");
let seen = 0, state = null, versions = 0, allChat = [], viewRun = new URLSearchParams(location.search).get("run") || "";
let RUNLIST = [];        // the saved runs (/api/runs): the header picker and the Board story's compare picker
const runQ = () => (viewRun ? "&run=" + encodeURIComponent(viewRun) : "") + (SutraCtx.dept ? "&dept=" + encodeURIComponent(SutraCtx.dept) : "");

function addMsg(m){
  const el = document.createElement("div");
  if (m.who === "system"){ el.className = "sys"; if (m.test) el.style.cssText = "color:var(--bad);font-weight:700";
    el.textContent = dv(m.text); $("msgs").appendChild(el); return; }
  el.className = "msg " + m.who + (m.to_user ? " touser" : ""); el.style.setProperty("--c", col(m.who)); el.dataset.id = m.id;
  let t = "";
  if (m.act) t += `<span class="tag ${m.act==="PARK"||m.act==="DISPUTE"?"bad":m.act==="LESSON"?"ok":""}">${m.act}</span>`;
  if (m.auto) t += `<span class="tag">by code, no AI call</span>`;
  if (m.envelope) t += `<span class="tag ${m.envelope==="allowed"?"ok":"bad"}">limits: ${m.envelope}</span>`;
  if (m.attempt) t += `<span class="tag ${m.agree?"ok":"bad"}">${m.agree?"agrees":"holds position"} · attempt ${m.attempt}/4</span>`;
  if (m.audience) t += `<span class="tag aud">for ${esc(m.audience === "user" ? "Requester (you)" : who(m.audience)[0])}</span>`;
  else if (m.next && !m.to_user) t += `<span class="tag">→ ${esc(who(m.next)[0])}</span>`;
  if (m.lesson_used) t += m.lesson_test ? `<span class="tag bad">used TEST LESSON ${esc(m.lesson_used)} (from a forced failure, demo only)</span>`
    : `<span class="tag ok">used lesson ${esc(m.lesson_used)}</span>`;
  if (m.lessons) t += `<span class="tag ok">saved ${esc(m.lessons.join(", "))}</span>`;
  if (m.playbook) t += `<span class="tag ok">saved playbook ${esc(m.playbook)}</span>`;
  if (m.playbook_used) t += `<span class="tag ok">used playbook ${esc(m.playbook_used)}${m.playbook_changes ? ": " + esc(m.playbook_changes) : ""}</span>`;
  if (m.section) t += `<span class="tag">section ${esc(m.section)}</span>`;
  if (m.workable !== undefined) t += `<span class="tag ${m.workable?"ok":"bad"}">${m.workable?"workable":"not workable"}</span>`;
  if (m.stamp === true) t += `<span class="tag ok">charter valid</span>`;
  if (m.stamp === false) t += `<span class="tag bad">charter rejected</span>`;
  if (m.proposal) t += `<span class="tag">proposes ${m.proposal.length} workflow(s) · ${m.proposal.reduce((a,w)=>a+(+w.cost||0),0)} work credits</span>`;
  if (m.decision && m.who === "priority") t += `<span class="tag ${m.decision==="grant"?"ok":"bad"}">${m.decision.toUpperCase()} · ${m.exchange==="ruling"?"after ruling":"exchange "+m.exchange+"/4"}</span>`;
  if (m.accept !== undefined) t += `<span class="tag ${m.accept?"ok":"bad"}">${m.accept?"accepts":"pushes back"} · exchange ${m.exchange}/4</span>`;
  if (m.conflict) t += `<span class="tag bad">${m.conflict}${m.decision === true ? " · ruling" : ""}</span>`;
  if (m.forced_test) t += `<span class="tag bad">TEST: item ${m.forced_test} forced to fail, not a real finding</span>`;
  if (m.check) t += `<span class="tag ${m.ok?"ok":"bad"}">charter check: ${m.ok?"ok":"issues"}</span>`;
  if (m.schedule) t += `<span class="tag">schedule: ${m.schedule.join(" → ")}</span>`;
  if (m.done !== undefined) t += `<span class="tag ${m.done?"ok":"bad"}">${m.done?"checklist holds":"not done"}</span>`;
  if (m.register === true) t += `<span class="tag ok">registered</span>`;
  if (m.register === false) t += `<span class="tag bad">rejected</span>`;
  if (m.version) t += `<span class="tag">site v${m.version}</span>`;
  if (m.audit !== undefined) t += `<span class="tag ${m.audit?"ok":"bad"}">${m.audit?"all criteria pass":"criteria failing"}</span>`;
  el.innerHTML = `<div class="av">${esc(who(m.who)[1])}</div><div class="bubble"><div class="who">${isAgent(m.who) ? `<button type="button" class="whobtn" data-agent="${esc(m.who)}" title="See conversation and thinking">${esc(who(m.who)[0])}</button>` : esc(who(m.who)[0])}${m.to_user ? '<span class="touser-label">to you</span>' : ""}<span>${m.t}</span></div>
    <div class="text">${md(m.text)}</div>${t ? `<div>${t}</div>` : ""}</div>`;
  $("msgs").appendChild(el);
}
function renderSteps(s){
  $("steps").innerHTML = Object.entries(s.steps).map(([n,l]) =>
    `<div class="st ${+n===s.step?"on":(+n<s.step?"past":"")}"><small class="code">${esc(l.split(" ")[0])}</small>${esc(dv(l.split(" ").slice(1).join(" ")))}</div>`).join("");
}
function renderGoal(s){
  const g = s.goal;
  if (!g) return `<p class="empty">Identity reads your brief (J2.a), asks you for anything it needs, records the charter, and the validator checks it before work starts.</p>`;
  return `<h3>${esc(g.site_name || "Goal")} ${s.stamped ? '<span class="pill done">validated</span>' : ""}</h3>
    <dl><dt>goal</dt><dd>${esc(g.statement)}</dd><dt>audience</dt><dd>${esc(g.audience)}</dd>
    <dt>standards</dt><dd>${(g.standards||[]).map(esc).join("<br>")}</dd><dt>rules</dt><dd>${(g.rules||[]).map(esc).join("<br>")}</dd>
    <dt>checklist</dt><dd>${(g.done_when||[]).map(esc).join("<br>")}</dd>
    ${(g.to_be_confirmed||[]).length ? `<dt>to be confirmed</dt><dd class="fail">${g.to_be_confirmed.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}<br><span class="empty">These items are not met until you confirm the fact.</span></dd>` : ""}
    ${(g.confirmed_facts||[]).length ? `<dt>confirmed by you</dt><dd>${g.confirmed_facts.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}</dd>` : ""}
    ${(g.dropped_by_requester||[]).length ? `<dt>dropped by you</dt><dd>${g.dropped_by_requester.map(esc).join("<br>")}</dd>` : ""}</dl>`;
}
function envCell(w){
  const e = w.envelope; if (!e) return '<span class="empty">none</span>';
  return `money ${e.money_limit} · calls ${w.calls_used||0}/${e.model_call_limit} · retries ${w.retries_used||0}/${e.retry_limit}`
    + (e.time_limit_minutes != null ? ` · ${e.time_limit_minutes} min` : "")
    + (e.stop_loss ? `<br><span class="empty">stop-loss: ${esc(dv(e.stop_loss))}</span>` : "");
}
// ===== atom cards: start (rendered in a browser-free harness by j2_ui_render.js; keep it free of DOM calls)
// A work atom card: a preview of what it built, then eight blocks in three groups: particles (goal, how, constraints,
// context), defined output and verification, outputs (human_output, agent_output). Long blocks are collapsed.
const ATOM_ROWS = [["goal", "Goal", "What must be true when this is done"], ["constraints", "Constraints", "What must never break"],
  ["context", "Context", "What it needs to know"], ["how", "How", "Who builds it"],
  ["expected_output", "Expected output", "What must exist when it is done"],
  ["verification", "Verification", "The check that proves the goal is met"]];
const sentence = t => { t = dv(t).trim(); return t && !/[.!?]$/.test(t) ? t + "." : t; };
const words = v => (Array.isArray(v) ? v : [v]).filter(Boolean).map(x => typeof x === "string" ? x : Object.values(x).join(" ")).join("; ");
function atomRow(a, k, w){
  const v = a[k];
  if (k === "goal") return linkDocItems(esc(sentence(words(v))));
  if (k === "constraints") return constraintsHTML(v);
  if (k === "context") return contextHTML(v, a, w);
  if (k === "how"){ const ai = !(v && v.kind === "code"); let ag = v && v.agent;
    if (ai && (!ag || /^(W-\d+ )?builder$/i.test(ag) || w.revises)) ag = builderName(w);   // "W-1 PRD Problem section builder", never a bare "Builder"
    const o = ai && wfOrigin(w);
    return esc(sentence((ai ? "AI builds it" : "Code builds it") + (ag ? ": " + ag : "") + (o ? ` as a revision of ${o.id} ${o.name}` : ""))); }
  // one line per item, marked once code has run the atom's checks
  if (k === "expected_output") return (Array.isArray(v) ? v : []).map(x => esc(sentence(typeof x === "string" ? x : x.text))
    + (!a.attempts ? "" : x.met === true ? ' <span class="pass">Met</span>' : x.met === false ? ' <span class="fail">Not met</span>'
      : ' <span class="empty">Not run</span>')).join("<br>") || '<span class="empty">None written.</span>';
  // each check with what code found when it ran it (the atom's latest receipts)
  return (Array.isArray(v) ? v : []).map((c, i) => { const r = (a.results || [])[i];
    const st = !r ? '<span class="empty">Not run yet.</span>'
      : r.pass === null ? `<span class="empty">Could not run</span>: ${esc(sentence(r.evidence))} <span class="empty">Not counted as a failed attempt.</span>`
      : `<span class="${r.pass ? "pass" : "fail"}">${r.pass ? "Passed" : a.status === "escalated" ? "Failed, escalated" : "Failed"}</span>: ${esc(sentence(r.evidence))} <span class="empty">Attempt ${r.attempt} of ${r.of}${r.recheck ? ", " + esc(r.recheck) : ""}.</span>`;
    return `${esc(sentence(typeof c === "string" ? c : c.text))}<br>${st}`; }).join("<br>");
}
// Context and Constraints in plain words; a document item named on a card (PRD R2, S1) links to the Documents tab.
let CTX = null, FOCUS = {};   // CTX: the state the cards are drawn from (charter items, sections); FOCUS: the item the Documents tab shows

    + `<h3>Replans</h3>${rounds.length || revs.length ? `<ul>${rounds.join("")}${revs.join("")}</ul>` : `<p class="empty">No replans recorded.</p>`}</div>`;

function railModel(s, m, tabs){

  const acts = nodes.filter(n => n.kind === "work" && n.tag === "Send").map(n => { const w = sendWord(n);

    adaptation: wfs.length ? `${plural(wfs.length, "workflow")} planned` : "no workflows yet", priority: prioModel(s).status,
    coordination: wfs.length ? `${wfs.filter(w => w.status === "done").length} of ${wfs.length} workflows done` : "no workflows yet",
    audit: af.n ? `${plural(af.n, "finding")}, ${af.fixed} fixed${af.open ? `, ${af.open} open` : ""}` : (s.audits || []).length ? "no findings" : "no audits yet",
    artifacts: artN ? plural(artN, "artifact") : "", actions: acts.length ? `${plural(acts.length, "action")}: ${["sent", "waiting for you", "blocked"].map(k => [k, acts.filter(a => a.state === k).length]).filter(x => x[1]).map(x => x[1] + " " + x[0]).join(", ") || "none sent yet"}` : "none", other: "", settings: ""};
  const at = {}; (tabs || []).forEach(t => { const [sec, how] = place(t); (at[sec] = at[sec] || []).push({tab: t, how, dim: (RAILDIM[t] && RAILDIM[t](s)) || ""}); });
  return RAILORDER.map(([id, name]) => ({id, name, persona: id === "audit" ? pers.audit + " + Validator" : pers[id] || "", status: stat[id], tabs: at[id] || [], needs: !!needs[id],
    items: id === "conflicts" ? conf.map(c => ({kind: "conflict", id: c.id, text: `${c.id} · ${c.subject || c.topic || ""}`, state: c.status === "settled" ? "settled" : "open", fns: c.between || []})) : id === "actions" ? acts.map(a => ({kind: "action", ...a})) : [],

const railFirst = (model, fn) => ((model.find(x => x.id === fn) || {}).tabs || [])[0];

function railMount(){

    if (!el.__init){ el.__init = true; railSetOpen(sec.id, sec.open, false); } else if (sec.needs && !(sec.id in RAILOPEN)) railSetOpen(sec.id, true, false); });

function railReveal(name){ const b = document.querySelector(`#railsub [data-tab="${name}"]`), sec = b && b.closest && b.closest(".rsec"); if (sec) railSetOpen(sec.dataset.sec, true, false); }
