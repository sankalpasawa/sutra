[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-pro"
version = "0.1.0"
description = "The new Sutra app: a chat on top of one global org chart, five agentic function nodes per department, and a Claude / Codex connector layer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
]

[project.scripts]
sutra-pro = "sutra_app.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sutra_app*"]

# Non-Python files that ship inside the package: UI pages and static assets, the vendored J2 engine's data,
# the chat agent's prompt templates, the default routing policy. Without these a built wheel would miss them.
[tool.setuptools.package-data]
sutra_app = [
    "ui/pages/*",
    "ui/static/**/*",
    "engine/agents/**/*",
    "engine/conditions/**/*",
    "engine/artifacts/**/*",
    "engine/templates/**/*",
    "engine/seed/**/*",
    "orchestrator/agent/templates/*.md",
    "library/specs/*.json",
    "connectors/policy.default.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: talks to the real claude or codex CLI; runs only with SUTRA_LIVE=1",
    "slow: long engine suites (legacy J2 scripts, prompt goldens); runs only with SUTRA_SLOW=1",
    "browser: drives a real headless Chrome over CDP; runs only with SUTRA_BROWSER=1",
]
