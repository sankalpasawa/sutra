.st.on{background:var(--accent);color:var(--on)}

.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}

.row{display:flex;gap:8px}

#dview{display:contents}

/* ---- Detailed view layout: icon rail, one title, two soft cards (message board + output), a collapsed Run details row.
   Everything is scoped to #dview so the Simple view is untouched. System serif for headings, no web fonts. */
#dview{--vio:#6b45b3;--serif:ui-serif,Georgia,"Times New Roman",serif;--gut:24px}
@media (prefers-color-scheme:dark){#dview{--vio:#ab8cec}}
body:not(.simple) #dview{display:flex;flex:1;min-height:0}
#dview h1,#dview h2,#dview h3,#dview h4{font-family:var(--serif);font-weight:600}
.rail.tabs{flex:0 0 76px;width:76px;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:4px;padding:10px 8px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
.rail.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:12px;padding:8px 2px;font:500 10.5px/1.2 var(--body);text-align:center;color:var(--muted)}
.rail.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail.tabs button:hover{color:var(--ink)}
.rail.tabs button[aria-selected="true"],.rail.tabs #gochat[aria-current="page"]{color:var(--vio);background:color-mix(in srgb,var(--vio) 13%,transparent);font-weight:600}
body.simple .rail.tabs button[aria-selected="true"]{color:var(--muted);background:none;font-weight:500}
.rail.tabs button:focus-visible,.rdrow:focus-visible{outline:2px solid var(--vio);outline-offset:1px}
.dcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#dview header.dtop{align-items:flex-end;gap:10px;padding:18px var(--gut) 8px;border-bottom:0;background:none}
#dview h1{font-size:28px;line-height:1.1;margin:0}
#dview .banner{margin:0 var(--gut) 8px;border:1px solid var(--line);border-radius:10px}
.rdmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#pane-rundetails .steps{padding:8px 0;background:none;border:0}
#pane-rundetails .lanes{flex-direction:row;flex-wrap:wrap;border:0;padding:0;overflow:visible;background:none}
#pane-rundetails .lanes h2{flex:0 0 100%}#pane-rundetails .lane{flex:1 1 200px}
#dview main{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:14px;padding:0 var(--gut) 20px}
#dview .chat,#dview .work{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.wbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wbar>div{flex:1;min-width:0}.wbar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 6px;font:inherit}
.wtitle{font-size:18px;margin:0}.wsub{display:block;color:var(--muted);font-size:13px}
#dview .pane:not(.preview){width:100%;max-width:880px;margin:0 auto}
@media (max-width:900px){#dview .dcol{overflow:auto}#dview main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(460px,70vh) minmax(420px,70vh);flex:none}}
@media (max-width:600px){
  #dview{--gut:12px}body:not(.simple) #dview{flex-direction:column-reverse}
  .rail.tabs{flex:0 0 auto;width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:6px}
  .rail.tabs>button{flex:0 0 64px}
  .railsub{position:fixed;left:8px;right:8px;bottom:64px;z-index:5;flex-direction:row;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}.rail.tabs .railsub button{flex:1 1 90px}}
</style>

<script>
const WHO = {user:["Requester (you)","R"],validator:["Validator","V"],identity:["Identity","I"],adaptation:["Adaptation","Ad"],
  priority:["Priority","P"],coordination:["Coordination","C"],builder:["Builder","B"],audit:["Audit","Au"],system:["System","!"]};
// Workflow agents ("W-1") get "W-1 Builder" and a colour from the --wf palette.
const isWf = k => /^W-\d+$/.test(k || "");
const who = k => WHO[k] || (isWf(k) ? [k + " Builder", k.replace("-", "")] : [k, "?"]);
const col = k => isWf(k) ? `var(--wf${(+k.slice(2) - 1) % 6})` : `var(--${k})`;
const $ = id => document.getElementById(id);
const WD = (k, d) => { const w = CTX && CTX.words; return w && w[k] != null ? w[k] : d; };
// Panes are re-rendered on every poll. Leave a pane alone when its HTML is unchanged, and when it does change, reopen
// any <details> the user had open (matched by data-key), so an opened screenshot or log stays open until closed.
function paint(el, html){
  if (el.__html === html) return;
  const open = new Set([...el.querySelectorAll("details[open][data-key]")].map(d => d.dataset.key));
  el.innerHTML = html; el.__html = html;
  open.forEach(k => { const d = el.querySelector(`details[data-key="${CSS.escape(k)}"]`); if (d) d.open = true; });
}
// Example briefs for both views: different kinds of business, so nothing assumes a cafe.
const EXAMPLES = ["A website for my cafe", "A website for Sweet Crumbs Bakery in Pune: menu, cake orders, contact",
  "A website for Petal & Stem, a florist in Jaipur: bouquets, same-day delivery, wedding flowers",
  "A website for Asha Rao Photography, a wedding and portrait photographer in Mumbai: portfolio, packages, booking"];
// Output types the start page offers (J2_OUTPUT sets the default); the run keeps its type once it starts.
const OUTS = [["website", "Website"], ["prd", "PRD document"]];
const PRD_EXAMPLES = ["Write a PRD for QuickQueue, a mobile app that lets clinic patients join a waiting line remotely. "
  + "Users: patients at small clinics and the front-desk staff who manage the line. Problem: patients wait 45 minutes on "
  + "average in crowded waiting rooms. Must-have features: join the queue from a phone, live position updates, SMS alert "
  + "when 2 patients are ahead, staff dashboard to call the next patient. Constraints: works on low-end Android phones; no "
  + "patient health data stored. Success: average in-room wait under 10 minutes; 60% of patients join remotely within 3 months."];
const examples = s => WD("examples", s.doc ? PRD_EXAMPLES : EXAMPLES);
const outOptions = s => OUTS.map(([v, l]) => `<option value="${v}"${s.output === v ? " selected" : ""}>${l}</option>`).join("");
const docLinks = s => (s.docset_files || []).map(d => `<a href="file/${d.md}${runQ().replace("&", "?")}" download>${esc(d.kind.toUpperCase())} .md</a> <a href="file/${d.docx}${runQ().replace("&", "?")}" download>${esc(d.kind.toUpperCase())} .docx</a>`).join(" ");
const plainDocLinks = s => (s.docset_files || []).map(d => `<a href="file/${d.md}${runQ().replace("&", "?")}" download>Download the ${esc(d.label)} (markdown)</a> <a href="file/${d.docx}${runQ().replace("&", "?")}" download>Download the ${esc(d.label)} (Word file)</a>`).join(" ");
const fileLinks = s => (s.files || []).map(f => `<a href="file/${f}${runQ().replace("&", "?")}" download>Download ${f.split(".").pop() === "docx" ? "the Word file (.docx)" : "the markdown (.md)"}</a>`).join(" ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Detailed view wording: plain names for J2 terms; the J2 step codes stay, in small grey text.
const dv = t => String(t ?? "").replace(/\benvelope's\b/gi, "limits'").replace(/\benvelopes?\b/gi, "limits")
  .replace(/\bdone[-_ ]when list\b/gi, "checklist").replace(/\bdone[-_ ]when\b/gi, "checklist");
const md = s => esc(dv(s)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/@(\w+)/g,"<b>@$1</b>");
let seen = 0, state = null, versions = 0, allChat = [], viewRun = new URLSearchParams(location.search).get("run") || "";
const runQ = () => viewRun ? "&run=" + encodeURIComponent(viewRun) : "";

function addMsg(m){
  const el = document.createElement("div");
  if (m.who === "system"){ el.className = "sys"; if (m.test) el.style.cssText = "color:var(--bad);font-weight:700";
    el.textContent = dv(m.text); $("msgs").appendChild(el); return; }
  el.className = "msg " + m.who + (m.to_user ? " touser" : ""); el.style.setProperty("--c", col(m.who)); el.dataset.id = m.id;
  let t = "";
  if (m.act) t += `<span class="tag ${m.act==="PARK"||m.act==="DISPUTE"?"bad":m.act==="LESSON"?"ok":""}">${m.act}</span>`;
  if (m.auto) t += `<span class="tag">by code, no AI call</span>`;
  if (m.envelope) t += `<span class="tag ${m.envelope==="allowed"?"ok":"bad"}">limits: ${m.envelope}</span>`;
  if (m.attempt) t += `<span class="tag ${m.agree?"ok":"bad"}">${m.agree?"agrees":"holds position"} · attempt ${m.attempt}/4</span>`;
  if (m.audience) t += `<span class="tag aud">for ${esc(m.audience === "user" ? "Requester (you)" : who(m.audience)[0])}</span>`;
  else if (m.next && !m.to_user) t += `<span class="tag">→ ${esc(who(m.next)[0])}</span>`;
  if (m.lesson_used) t += m.lesson_test ? `<span class="tag bad">used TEST LESSON ${esc(m.lesson_used)} (from a forced failure, demo only)</span>`
    : `<span class="tag ok">used lesson ${esc(m.lesson_used)}</span>`;
  if (m.lessons) t += `<span class="tag ok">saved ${esc(m.lessons.join(", "))}</span>`;
  if (m.playbook) t += `<span class="tag ok">saved playbook ${esc(m.playbook)}</span>`;
  if (m.playbook_used) t += `<span class="tag ok">used playbook ${esc(m.playbook_used)}${m.playbook_changes ? ": " + esc(m.playbook_changes) : ""}</span>`;
  if (m.section) t += `<span class="tag">section ${esc(m.section)}</span>`;
  if (m.workable !== undefined) t += `<span class="tag ${m.workable?"ok":"bad"}">${m.workable?"workable":"not workable"}</span>`;
  if (m.stamp === true) t += `<span class="tag ok">charter valid</span>`;
  if (m.stamp === false) t += `<span class="tag bad">charter rejected</span>`;
  if (m.proposal) t += `<span class="tag">proposes ${m.proposal.length} workflow(s) · ${m.proposal.reduce((a,w)=>a+(+w.cost||0),0)} work credits</span>`;
  if (m.decision && m.who === "priority") t += `<span class="tag ${m.decision==="grant"?"ok":"bad"}">${m.decision.toUpperCase()} · ${m.exchange==="ruling"?"after ruling":"exchange "+m.exchange+"/4"}</span>`;
  if (m.accept !== undefined) t += `<span class="tag ${m.accept?"ok":"bad"}">${m.accept?"accepts":"pushes back"} · exchange ${m.exchange}/4</span>`;
  if (m.conflict) t += `<span class="tag bad">${m.conflict}${m.decision === true ? " · ruling" : ""}</span>`;
  if (m.forced_test) t += `<span class="tag bad">TEST: item ${m.forced_test} forced to fail, not a real finding</span>`;
  if (m.check) t += `<span class="tag ${m.ok?"ok":"bad"}">charter check: ${m.ok?"ok":"issues"}</span>`;
  if (m.schedule) t += `<span class="tag">schedule: ${m.schedule.join(" → ")}</span>`;
  if (m.done !== undefined) t += `<span class="tag ${m.done?"ok":"bad"}">${m.done?"checklist holds":"not done"}</span>`;
  if (m.register === true) t += `<span class="tag ok">registered</span>`;
  if (m.register === false) t += `<span class="tag bad">rejected</span>`;
  if (m.version) t += `<span class="tag">${esc(WD("noun", "site"))} v${m.version}</span>`;
  if (m.audit !== undefined) t += `<span class="tag ${m.audit?"ok":"bad"}">${m.audit?"all criteria pass":"criteria failing"}</span>`;
  el.innerHTML = `<div class="av">${esc(who(m.who)[1])}</div><div class="bubble"><div class="who">${esc(who(m.who)[0])}${m.to_user ? '<span class="touser-label">to you</span>' : ""}<span>${m.t}</span></div>
    <div class="text">${md(m.text)}</div>${t ? `<div>${t}</div>` : ""}</div>`;
  $("msgs").appendChild(el);
}
function renderSteps(s){
  $("steps").innerHTML = Object.entries(s.steps).map(([n,l]) =>
    `<div class="st ${+n===s.step?"on":(+n<s.step?"past":"")}"><small class="code">${esc(l.split(" ")[0])}</small>${esc(dv(l.split(" ").slice(1).join(" ")))}</div>`).join("");
}
function renderGoal(s){
  const g = s.goal;
  if (!g) return `<p class="empty">Identity reads your brief (J2.a), asks you for anything it needs, records the charter, and the validator checks it before work starts.</p>`;
  return `<h3>${esc(g.site_name || "Goal")} ${s.stamped ? '<span class="pill done">validated</span>' : ""}</h3>
    <dl><dt>goal</dt><dd>${esc(g.statement)}</dd><dt>audience</dt><dd>${esc(g.audience)}</dd>
    <dt>standards</dt><dd>${(g.standards||[]).map(esc).join("<br>")}</dd><dt>rules</dt><dd>${(g.rules||[]).map(esc).join("<br>")}</dd>
    <dt>checklist</dt><dd>${(g.done_when||[]).map(esc).join("<br>")}</dd>
    ${(g.to_be_confirmed||[]).length ? `<dt>to be confirmed</dt><dd class="fail">${g.to_be_confirmed.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}<br><span class="empty">These items are not met until you confirm the fact.</span></dd>` : ""}
    ${(g.confirmed_facts||[]).length ? `<dt>confirmed by you</dt><dd>${g.confirmed_facts.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}</dd>` : ""}
    ${(g.dropped_by_requester||[]).length ? `<dt>dropped by you</dt><dd>${g.dropped_by_requester.map(esc).join("<br>")}</dd>` : ""}</dl>`;
}
function envCell(w){
  const e = w.envelope; if (!e) return '<span class="empty">none</span>';
  return `money ${e.money_limit} · calls ${w.calls_used||0}/${e.model_call_limit} · retries ${w.retries_used||0}/${e.retry_limit}`
    + (e.time_limit_minutes != null ? ` · ${e.time_limit_minutes} min` : "")
    + (e.stop_loss ? `<br><span class="empty">stop-loss: ${esc(dv(e.stop_loss))}</span>` : "");
}
// ===== atom cards: start (rendered in a browser-free harness by j2_ui_render.js; keep it free of DOM calls)
// A work atom card: a preview of what it built, then eight blocks in three groups: particles (goal, how, constraints,
// context), defined output and verification, outputs (human_output, agent_output). Long blocks are collapsed.
const ATOM_ROWS = [["goal", "Goal", "What must be true when this is done"], ["constraints", "Constraints", "What must never break"],
  ["context", "Context", "What it needs to know"], ["how", "How", "Who builds it"],
  ["expected_output", "Expected output", "What must exist when it is done"],
  ["verification", "Verification", "The check that proves the goal is met"]];
const sentence = t => { t = dv(t).trim(); return t && !/[.!?]$/.test(t) ? t + "." : t; };
const words = v => (Array.isArray(v) ? v : [v]).filter(Boolean).map(x => typeof x === "string" ? x : Object.values(x).join(" ")).join("; ");
function atomRow(a, k, w){
  const v = a[k];
  if (k === "goal") return linkDocItems(esc(sentence(words(v))));
  if (k === "constraints") return constraintsHTML(v);
  if (k === "context") return contextHTML(v, a, w);
  if (k === "how"){ const ai = !(v && v.kind === "code"); let ag = v && v.agent;
    if (ai && (!ag || /^(W-\d+ )?builder$/i.test(ag) || w.revises)) ag = builderName(w);   // "W-1 PRD Problem section builder", never a bare "Builder"
    const o = ai && wfOrigin(w);
    return esc(sentence((ai ? "AI builds it" : "Code builds it") + (ag ? ": " + ag : "") + (o ? ` as a revision of ${o.id} ${o.name}` : ""))); }
  // one line per item, marked once code has run the atom's checks
  if (k === "expected_output") return (Array.isArray(v) ? v : []).map(x => esc(sentence(typeof x === "string" ? x : x.text))
    + (!a.attempts ? "" : x.met === true ? ' <span class="pass">Met</span>' : x.met === false ? ' <span class="fail">Not met</span>'
      : ' <span class="empty">Not run</span>')).join("<br>") || '<span class="empty">None written.</span>';
  // each check with what code found when it ran it (the atom's latest receipts)

$("pane-map").addEventListener("focusin", e => mapHover(e, true)); $("pane-map").addEventListener("focusout", e => mapHover(e, false));
$("pane-map").addEventListener("keydown", e => { const g = mapNode(e); if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); mapSelect(MAPPIN === g.dataset.id ? "" : g.dataset.id); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && MAPPIN && !$("pane-map").hidden) mapSelect(""); });
$("pane-map").addEventListener("click", async e => { const t = e.target.closest("[data-maptab]"); if (t){ e.preventDefault(); showTab(t.dataset.maptab); return; }
  if (e.target.closest("[data-mapclose]")){ e.preventDefault(); mapSelect(""); return; }
  const go = e.target.closest("[data-mapgo]"); if (go){ e.preventDefault(); mapGo(go.dataset.mapgo); return; }
  if (e.target.closest("[data-mapfiltclear]")){ e.preventDefault(); MAPFILT = ""; paint($("pane-map"), renderMap(MAP)); return; }
  const g = mapNode(e); if (g){ e.preventDefault(); mapSelect(MAPPIN === g.dataset.id ? "" : g.dataset.id); return; }
  const b = e.target.closest("[data-mapopen]"); if (!b) return; e.preventDefault();
  await openArtifact(b.dataset.mapopen); });
// Documents: read-only, reloaded when the run's chat or documents change; a link on an atom card opens the tab at that item.
let docsKey = null;
(async () => { try { const r = await fetch("api/refs"); if (r.ok){ Object.assign(REFS, await r.json()); if (state) paint($("pane-workflows"), renderWorkflows(state)); } } catch (e) {} })();
async function loadDocs(){
  try { const r = await fetch(`api/docs?${runQ().slice(1)}`, {cache:"no-store"});
    if (r.ok) Object.assign(DOCS, await r.json()); } catch (e) {}
  try { const r = await fetch(`api/audits?${runQ().slice(1)}`, {cache:"no-store"});
    if (r.ok){ STAGE_AUDITS.length = 0; STAGE_AUDITS.push(...await r.json()); } } catch (e) {}
  if (state) paint($("pane-workflows"), renderWorkflows(state));
  paint($("pane-docs"), renderDocs());
}
$("pane-docs").addEventListener("click", e => { const a = e.target.closest("[data-docjump]"); if (!a) return; e.preventDefault();
  const t = a.dataset.docjump === "top" ? $("pane-docs") : document.getElementById("docblock-" + a.dataset.docjump);
  if (t && t.scrollIntoView) t.scrollIntoView({block: "start"}); });
$("pane-workflows").addEventListener("click", e => { if (!e.target.closest("[data-wfclear]")) return; WFSTEP = []; if (state) paint($("pane-workflows"), renderWorkflows(state)); });
$("pane-workflows").addEventListener("click", e => { const b = e.target.closest("[data-otag]"); if (!b) return;
  OTAG = OTAG === b.dataset.otag ? "" : b.dataset.otag; if (state) paint($("pane-workflows"), renderWorkflows(state)); });
$("pane-workflows").addEventListener("click", e => { const b = e.target.closest("[data-fold]"); if (!b) return;
  const k = b.dataset.fold; FOLD.has(k) ? FOLD.delete(k) : FOLD.add(k); if (state) paint($("pane-workflows"), renderWorkflows(state)); });
document.addEventListener("click", e => { const a = e.target.closest("[data-charter]"), t = e.target.closest("[data-tabjump]"); if (!a && !t) return;
  e.preventDefault(); CHFOCUS = a ? +a.dataset.charter : 0; paint($("pane-charter"), renderCharter(state)); showTab("charter");
  const el = a && document.getElementById("charter-item-" + CHFOCUS); if (el && el.scrollIntoView) el.scrollIntoView({block: "center"}); });
document.addEventListener("click", e => { const a = e.target.closest("[data-wfcard]"); if (!a) return; e.preventDefault();
  const w = (state.workflows || []).find(x => x.id === a.dataset.wfcard); showTab("workflows");
  [`wf-${a.dataset.wfcard}`, ...((w && w.atoms) || []).map(x => `atom-${x.id}`)].forEach(k => { const d = document.querySelector(`details[data-key="${CSS.escape(k)}"]`); if (d) d.open = true; });
  const d = document.querySelector(`details[data-key="atom-${CSS.escape((w && w.atoms && w.atoms[0] || {}).id || "")}"]`); if (d && d.scrollIntoView) d.scrollIntoView({block: "start"}); });
$("pane-workflows").addEventListener("click", e => { const a = e.target.closest("[data-doc]"); if (!a) return;
  e.preventDefault(); FOCUS = {kind: a.dataset.doc, item: a.dataset.item};
  paint($("pane-docs"), renderDocs()); showTab("docs");
  const t = document.getElementById(`doc-${FOCUS.kind}-${FOCUS.item}`); if (t && t.scrollIntoView) t.scrollIntoView({block: "center"}); });
async function send(){
  const text = $("box").value.trim(); if (!text) return;
  $("box").value = "";
  await fetch("api/say", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
}
$("send").onclick = send;
// The start page's output type (both views): only before the first message; the server refuses it after.
document.addEventListener("change", async e => { if (!e.target.matches(".outsel")) return;
  await fetch("api/output", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({type: e.target.value})}); });
// Delegated clicks: panes are re-rendered on every poll.
// Detail view: click an agent message, a timeline step, or a lane (its latest message).
$("msgs").addEventListener("click", e => { const b = e.target.closest(".msg"); if (b && b.dataset.id) openDetail(b.dataset.id); });
$("pane-timeline").addEventListener("click", e => { const b = e.target.closest("[data-msg]"); if (b) openDetail(b.dataset.msg); });
$("lanes").addEventListener("click", e => { const b = e.target.closest("[data-msg]"); if (b && b.dataset.msg) openDetail(b.dataset.msg); });
$("dclose").onclick = () => $("detail").close();
// Atom card links that open stored data in the detail pane: the atom's agent_output, or its verification evidence.
async function wantPreview(id){
  PREVIEWS[id] = "";                                  // asked once; the answer replaces it
  try { const r = await fetch(`api/preview?atom=${encodeURIComponent(id)}${runQ()}`, {cache:"no-store"});
    PREVIEWS[id] = r.ok ? (await r.json()).html || "" : ""; } catch (e) {}
  if (state) paint($("pane-workflows"), renderWorkflows(state));
}
$("pane-workflows").addEventListener("click", e => { const b = e.target.closest("[data-link]"); if (!b || b.tagName === "A") return;
  const a = state.workflows.flatMap(w => w.atoms || []).find(x => x.id === b.dataset.atom); if (!a) return;
  $("dtitle").textContent = `${a.id} · ${b.dataset.link === "agent" ? "workflow output" : "verification evidence"}`;
  $("dbody").innerHTML = `<pre>${esc(JSON.stringify(b.dataset.link === "agent" ? a.agent_output : (a.results || []), null, 2))}</pre>`;
  $("detail").showModal(); });
// Saved runs: pick one to open it read-only; the URL keeps ?run= so it can be reloaded or shared locally.
(async () => { try { const r = await (await fetch("api/runs")).json();
  $("runsel").innerHTML = `<option value="">Live run (${esc(r.live)})</option>` + r.runs.filter(x => x.id !== r.live)
    .map(x => `<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.status)} · ${esc(x.brief.slice(0, 50))}</option>`).join("");
  $("runsel").value = viewRun; } catch (e) {} })();
$("runsel").onchange = () => { location.search = $("runsel").value ? "?run=" + encodeURIComponent($("runsel").value) : ""; };
$("pane-playbooks").addEventListener("click", async e => {
  if (e.target.id !== "clear-playbooks" || !confirm("Delete every saved playbook (memory/playbooks.jsonl)? This can't be undone.")) return;
  await fetch("api/playbooks/clear", {method:"POST"});
});
$("pane-lessons").addEventListener("click", async e => {
  if (e.target.id !== "clear-lessons" || !confirm("Delete every saved lesson (memory/lessons.jsonl)? This can't be undone.")) return;
  await fetch("api/lessons/clear", {method:"POST"});
});
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("reset").onclick = async () => { if (WD("new_task", null) != null){ ($("sbox").offsetParent ? $("sbox") : $("box")).focus(); return; } await fetch("api/reset", {method:"POST"}); location.search = ""; };
poll();
</script>
</body>
</html>
