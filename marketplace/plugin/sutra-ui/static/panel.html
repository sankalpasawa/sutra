<title>Sutra</title>

<link rel="stylesheet" href="/static/panel.css">

<div class="wrap">
  


  <div class="app" id="app">
    <nav class="rail" aria-label="Sutra">
      <div class="rtop">
        <div class="rmark">s</div><b>Sutra</b>
        <button class="railtog" id="railToggle" type="button"
                aria-label="Hide the sidebar" aria-pressed="false" title="Hide the sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
          </svg>
        </button>
      </div>
      <div class="rtabs" role="tablist" aria-label="Sidebar">
        <button type="button" role="tab" id="tabBtnHome" data-railtab="home"
                aria-selected="true" aria-controls="tabHome">Home</button>
        <button type="button" role="tab" id="tabBtnCode" data-railtab="code"
                aria-selected="false" aria-controls="tabCode">Code</button>
      </div>
      <div class="rscroll">
       <div class="rtab" id="tabHome" role="tabpanel" aria-labelledby="tabBtnHome">
        <button class="grp" type="button" data-railsec="org" aria-expanded="true"
                aria-controls="secOrg">Organization
          <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="rsec" id="secOrg"><ul class="nav" id="navOrg"></ul></div>
        <button class="grp" type="button" data-railsec="change" aria-expanded="true"
                aria-controls="secChange">Change
          <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="rsec" id="secChange"><ul class="nav" id="navChange"></ul></div>
        <button class="grp" type="button" data-railsec="runtime" aria-expanded="true"
                aria-controls="secRuntime">Runtime
          <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="rsec" id="secRuntime"><ul class="nav" id="navRuntime"></ul></div>
       </div>
       <div class="rtab" id="tabCode" role="tabpanel" aria-labelledby="tabBtnCode" hidden>
        <button class="newBtn" id="newSession" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New session
        </button>
        <div class="rtoggle">
          <button type="button" data-sgroup="recent">Recent</button>
          <button type="button" data-sgroup="project">Project</button>
          <button type="button" data-sgroup="dept">Dept</button>
          <!-- Sort applies to the PROJECT grouping only: "Recent" is already an
               ordering (that is what the buckets are) and "Dept" is ordered by the
               department path, which is a hierarchy, not a preference. The control
               is therefore disabled rather than hidden outside Project view -- a
               control that vanishes reads as a bug, one that greys out reads as
               "not for this view". -->
          <button type="button" class="rsort" id="sessSort"
                  title="Sort projects" aria-label="Sort projects">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" aria-hidden="true">
              <path d="M7 4v16M7 20l-3-3M7 4l3 3M17 20V4M17 4l3 3M17 20l-3-3"/></svg>
          </button>
        </div>
        <div id="sessions"></div>
       </div>
      </div>
      <div class="rfoot">
        <div class="av">TC</div>
        <!-- Tenancy is removed: one registry holds one org. The label that named
             the tenant here is gone too -- naming a scope that has no alternative
             is noise, and it was the last place the word appeared to an operator. -->
        <div style="margin-left:auto;display:flex;gap:2px">
          <button class="ib" id="termBtn" type="button" aria-pressed="false"
                  aria-label="Show the terminal" title="Terminal — the real claude TUI in a PTY">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" aria-hidden="true">
              <rect x="2.5" y="4" width="19" height="16" rx="2"/>
              <path d="M6.5 9.5l3 2.5-3 2.5M12.5 15h5"/>
            </svg>
          </button>
          <button class="ib" id="themeBtn" type="button" aria-label="Switch theme">
            <svg class="ico-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
            <svg class="ico-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 019.8 4a8.4 8.4 0 102.4 16.4A8.3 8.3 0 0020 14.2z"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <button class="railshow" id="railShow" type="button"
            aria-label="Show the sidebar" title="Show the sidebar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
      </svg>
    </button>
    <div class="panes" id="panes"></div>

    <!-- Terminal. Deliberately a SIBLING of #panes, not a child: render() sets
         panes.innerHTML wholesale, which would destroy the iframe and with it the
         PTY and whatever is running inside it, on every unrelated state change.
         The <iframe> is created lazily on first open and then never re-created;
         hiding is a CSS concern only. It points at /legacy/term, the existing,
         working terminal (real `claude` TUI over a PTY) rather than a second
         implementation of the same thing. -->
    <section class="pane termpane" id="termPane" hidden aria-label="Terminal">
      <button class="termgrip" id="termGrip" type="button" role="separator"
              aria-orientation="vertical"
              aria-label="Resize the terminal (left and right arrows adjust, home resets)"></button>
      <div class="ph">
        <span class="tabs sidetabs">
          <button type="button" id="sideTabTerm" aria-pressed="true">Terminal</button>
          <button type="button" id="sideTabPrev" aria-pressed="false">Preview</button>
        </span>
        <!-- Shell vs the real Claude Code TUI. app.py:729 already spawns either;
             only the shell was ever reachable. -->
        <span class="tabs sidetabs" role="group" aria-label="Terminal runs">
          <button type="button" id="termModeShell" aria-pressed="true"
                  title="Your login shell — git, ls, builds">Shell</button>
          <button type="button" id="termModeClaude" aria-pressed="false"
                  title="The real Claude Code TUI: /mcp, /plugin, /context, /rewind, vim mode, plan approval">Claude</button>
        </span>
        <span class="termcwd" id="termCwd"></span>
        <button class="ib" id="termReload" type="button"
                aria-label="Restart the terminal session" title="Restart the terminal session">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" aria-hidden="true"><path d="M20 11A8 8 0 106 17M20 5v6h-6"/></svg>
        </button>
        <button class="ib" id="termClose" type="button"
                aria-label="Hide the terminal" title="Hide the terminal">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="pb termbody" id="termBody"></div>
      <!-- Preview. Its own body, hidden rather than unmounted, for the same reason
           the terminal iframe is mounted once: tearing down a running dev-server
           view on every tab switch would reload the page and lose its state. -->
      <div class="pb termbody" id="prevBody" hidden>
        <div class="prevbar">
          <input type="text" id="prevUrl" class="wdin" spellcheck="false"
                 placeholder="http://localhost:3000" aria-label="Preview URL">
          <button class="btn" type="button" id="prevGo">Open</button>
        </div>
        <div class="prevnote" id="prevNote">Point this at a dev server you are already
          running. Loopback addresses only — this pane will not load a remote site.</div>
        <div class="prevframe" id="prevFrame"></div>
      </div>
    </section>
  </div>
</div>

<script src="/static/js/01-state.js"></script>
<script src="/static/js/02-helpers.js"></script>
<script src="/static/js/03-org.js"></script>
<script src="/static/js/04-screens.js"></script>
<script src="/static/js/05-chat.js"></script>
<script src="/static/js/06-render.js"></script>
<script src="/static/js/07-loaders.js"></script>
<script src="/static/js/08-boot.js"></script>
<!-- 10-activity.js loads before 09-tail.js on purpose: 09-tail ends with boot(),
     which must remain the final statement (see test 21b). Activity self-mounts on
     DOMContentLoaded, so load order before boot() is safe. -->
<script src="/static/js/10-activity.js"></script>
<script src="/static/js/09-tail.js"></script>
