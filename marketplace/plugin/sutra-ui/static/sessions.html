<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sutra — Sessions</title>
<style>
  :root { --bg:#0d1117; --panel:#10151c; --line:#21262d; --fg:#c9d1d9; --dim:#8b949e; --hi:#58a6ff; --you:#1f6feb; --low:#3fb950; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg);
              font:13px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto 1fr; height:100vh; }
  header { grid-column:1/3; display:flex; align-items:center; gap:12px; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header .logo { font-weight:700; font-size:15px; } header .logo span { color:var(--hi); }
  header .dim { color:var(--dim); font-size:12px; }
  header a { margin-left:auto; color:var(--hi); text-decoration:none; font-size:13px;
             border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
  header a:hover { border-color:var(--hi); }
  aside { border-right:1px solid var(--line); overflow-y:auto; }
  #search { width:100%; background:var(--panel); color:var(--fg); border:0;
            border-bottom:1px solid var(--line); padding:10px 14px; font:inherit; }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.sel { background:#1f6feb14; }
  .item .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .m { color:var(--dim); font-size:11px; margin-top:3px; display:flex; gap:8px; }
  main { overflow-y:auto; padding:0; display:flex; flex-direction:column; }
  .conv-head { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; position:sticky; top:0; background:var(--bg); }
  .conv-head .cwd { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .resume { margin-left:auto; background:var(--low); color:#04260f; border:0; border-radius:8px;
            padding:7px 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .resume:hover { filter:brightness(1.1); }
  #conv { padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:760px; padding:9px 13px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--you); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:#161b22; border:1px solid var(--line);
                   border-bottom-left-radius:4px; font:12.5px/1.55 ui-monospace, Menlo, monospace; }
  .tools { margin-top:6px; display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  .empty { color:var(--dim); margin:60px auto; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">&#10022; <span>Sutra</span></div>
    <div class="dim">sessions &middot; read-only history</div>
    <a href="/">+ New terminal</a>
  </header>

  <aside>
    <input id="search" placeholder="Search sessions…" />
    <div id="list"></div>
  </aside>

  <main>
    <div class="conv-head" id="conv-head" style="display:none">
      <span class="cwd" id="conv-cwd"></span>
      <button class="resume" id="resume">Resume in terminal ▸</button>
    </div>
    <div id="conv"><div class="empty">Pick a session on the left to read it.</div></div>
  </main>
</div>

<script>
  const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  const listEl = document.getElementById("list");
  const convEl = document.getElementById("conv");
  const headEl = document.getElementById("conv-head");
  const cwdEl = document.getElementById("conv-cwd");
  const resumeBtn = document.getElementById("resume");
  let sessions = [], current = null;

  function fmt(ts) { try { return new Date(ts * 1000).toLocaleString(); } catch (_) { return ""; } }

  function renderList(filter) {
    const f = (filter || "").toLowerCase();
    listEl.innerHTML = "";
    sessions.filter(s => !f || (s.title + " " + s.project).toLowerCase().includes(f)).forEach(s => {
      const d = document.createElement("div");
      d.className = "item" + (current === s.id ? " sel" : "");
      d.innerHTML = `<div class="t">${esc(s.title)}</div>` +
        `<div class="m"><span>${esc(s.project.replace(/^-/, "").replace(/-/g, "/"))}</span>` +
        `<span>·</span><span>${fmt(s.mtime)}</span>${s.branch ? "<span>· " + esc(s.branch) + "</span>" : ""}</div>`;
      d.onclick = () => open(s);
      listEl.appendChild(d);
    });
  }

  async function open(s) {
    current = s.id;
    renderList(document.getElementById("search").value);
    convEl.innerHTML = '<div class="empty">Loading…</div>';
    headEl.style.display = "flex";
    cwdEl.textContent = s.cwd || "";
    resumeBtn.onclick = () => {
      location.href = "/?resume=" + encodeURIComponent(s.id) + "&cwd=" + encodeURIComponent(s.cwd || "");
    };
    try {
      const data = await (await fetch("/api/sessions/" + encodeURIComponent(s.id))).json();
      convEl.innerHTML = "";
      if (!data.messages || !data.messages.length) { convEl.innerHTML = '<div class="empty">No readable messages.</div>'; return; }
      data.messages.forEach(m => {
        const d = document.createElement("div");
        d.className = "msg " + m.role;
        d.textContent = m.text || (m.tools && m.tools.length ? "" : "(empty)");
        if (m.tools && m.tools.length) {
          const t = document.createElement("div");
          t.className = "tools";
          t.innerHTML = m.tools.map(x => `<span class="chip">⚙ ${esc(x)}</span>`).join("");
          d.appendChild(t);
        }
        convEl.appendChild(d);
      });
    } catch (_) { convEl.innerHTML = '<div class="empty">Failed to load session.</div>'; }
  }

  document.getElementById("search").addEventListener("input", e => renderList(e.target.value));

  (async () => {
    try {
      sessions = await (await fetch("/api/sessions?limit=200")).json();
      renderList("");
      if (!sessions.length) listEl.innerHTML = '<div class="empty">No sessions found.</div>';
    } catch (_) { listEl.innerHTML = '<div class="empty">Failed to load sessions.</div>'; }
  })();
</script>
</body>
</html>
