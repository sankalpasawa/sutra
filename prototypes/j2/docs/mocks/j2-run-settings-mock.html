<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J2 Run Settings</title>
<style>
:root,[data-theme=light]{--bg:#f6f1e9;--card:#fbf8f3;--card2:#fffdf9;--line:#e6dccd;--fg:#2e2721;--muted:#8b7f71;--accent:#e08a4f;--soft:#fbe9d7;--ok:#5f8a4a;--okbg:#e4efdc;--warn:#a5492e;--warnbg:#fbe2d6}
[data-theme=dark]{--bg:#161412;--card:#1f1c18;--card2:#24201b;--line:#34302a;--fg:#efe7dc;--muted:#a39687;--soft:#2c241d;--ok:#a8cf95;--okbg:#25331f;--warn:#f0a58b;--warnbg:#3a2219}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:84px 1fr;min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.rail{background:var(--card);border-right:1px solid var(--line)}
main{padding:16px;display:grid;grid-template-rows:auto 1fr;gap:14px}
.needs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.needs b{font-family:Georgia,serif;font-weight:500;font-size:18px}.needs .n{background:var(--soft);border-radius:6px;padding:0 7px;font-size:12px}.needs span:last-child{color:var(--muted)}
.page{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 28px 40px}
.back{color:var(--accent);text-decoration:none;font-size:13px}
h1{font-family:Georgia,serif;font-weight:500;font-size:26px;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 24px}
.wrap{max-width:820px;display:grid;gap:22px}
.sec{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.sec h2{margin:0 0 2px;font-size:15px}.sec p{margin:0 0 12px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;gap:6px}
.seg button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;min-width:108px}
.seg button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px #e08a4f22}
.seg .sw{width:30px;height:20px;border-radius:6px;border:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{margin:0}
.search{margin-left:auto;position:relative}
.search input{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px 8px 30px;font:inherit;width:220px}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--muted)}
.new{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.runs{display:grid;gap:8px;max-height:430px;overflow:auto;padding-right:2px}
.run{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.run:hover{border-color:var(--accent)}
.run.cur{border-color:var(--accent);background:var(--soft)}
.run .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}.run.cur .ic{color:var(--accent)}
.run .t{font-weight:600}.run .m{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .r{display:flex;gap:8px;align-items:center}
.st{font-size:11.5px;border-radius:99px;padding:2px 9px}.st.done{background:var(--okbg);color:var(--ok)}.st.live{background:var(--soft);color:var(--accent)}.st.stop{background:var(--warnbg);color:var(--warn)}
.st.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.open{font-size:12.5px;color:var(--accent);font-weight:600}
.run.cur .open{color:var(--muted)}
.top h2 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.fl{display:flex;gap:6px;margin-bottom:10px}
.fl button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.fl button i{font-style:normal;opacity:.7;margin-left:3px}
.fl button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.runs{max-height:560px!important}
.grp{position:sticky;top:0;z-index:1;background:var(--card2);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 2px 4px}
.run{padding:9px 14px!important}
.mid{min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.mid .m{grid-column:1/-1}
.mid code{font:12px ui-monospace,Menlo,monospace;color:var(--muted);background:var(--bg);border-radius:6px;padding:1px 6px;justify-self:start}
.more{margin:8px auto 2px;display:block;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer}
.empty{color:var(--muted);font-size:13px;padding:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

html,body{height:100%;overflow:hidden}
body{min-height:0!important;height:100vh}
main{height:100vh;min-height:0;overflow:hidden}
.page{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-bottom:22px!important}
.wrap{flex:1;min-height:0;display:flex!important;flex-direction:column}
.wrap>.sec:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
.runs{flex:1;min-height:0;max-height:none!important;overflow:auto;align-content:start;grid-auto-rows:max-content}
</style>
</head>
<body>
<nav class="rail" aria-label="Rail (see rail mock)"></nav>
<main>
  <div class="needs"><b>Needs you</b><span class="n">0</span><span>Nothing needs you right now.</span></div>
  <section class="page">
    <a class="back" href="#">← Back to map</a>
    <h1>Run settings</h1>
    <p class="sub">How the app looks, and which run you're looking at.</p>
    <div class="wrap">
      <div class="sec">
        <h2>Appearance</h2><p>Applies to this browser only.</p>
        <div class="seg" role="group" aria-label="Appearance">
          <button data-t="light" aria-pressed="true"><span class="sw" style="background:#fbf8f3"></span>Light</button>
          <button data-t="dark" aria-pressed="false"><span class="sw" style="background:#1f1c18"></span>Dark</button>
          <button data-t="system" aria-pressed="false"><span class="sw" style="background:linear-gradient(90deg,#fbf8f3 50%,#1f1c18 50%)"></span>System</button>
        </div>
      </div>
      <div class="sec">
        <div class="top"><h2>Runs <small id="count"></small></h2><div class="search"><input id="q" placeholder="Search runs" aria-label="Search runs"></div><button class="new">＋ New run</button></div>
        <div class="fl" role="group" aria-label="Filter by status"><button data-f="all" aria-pressed="true">All <i></i></button><button data-f="live" aria-pressed="false">Running <i></i></button><button data-f="done" aria-pressed="false">Done <i></i></button><button data-f="stop" aria-pressed="false">Stopped <i></i></button></div>
        <div class="runs" id="runs"></div>
      </div>
    </div>
  </section>
</main>
<script>
const T=["Sudoku for phones","Green Leaf Cafe website","Sudoku with daily puzzle","Food delivery PRD","Tiffin Trail launch","Brew Corner website","Bakery menu site","Florist in Jaipur","Photographer portfolio","Launch plan for a cafe","HLD for a booking app","Yoga studio website","Tuition centre site","Product spec: notes app","Dental clinic website"];
const B=["Build me a Sudoku game as a single web page…","A one-page website for a small vegetarian cafe…","3 prompts · 36 workflows · 2 changes","Write a PRD for a food delivery app…","A launch-ready website for a lunch subscription…","A one-page site with a menu and opening hours…"];
const R=[];let d=new Date(2026,10,6,11,55);for(let k=0;k<50;k++){if(k)d=new Date(d.getTime()-(3+((k*37)%30))*3600e3);
 const pad=n=>String(n).padStart(2,"0"),id=`j2-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad((k*7)%60)}`;
 const t=T[k%T.length],doc=/PRD|HLD|spec|plan/i.test(t);R.push({id,t,m:B[k%B.length],d:new Date(d),st:k===0?"live":k%9===4?"stop":"done",ic:doc?"doc":"web",cur:k===0})}
const ICON={web:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r=".6" fill="currentColor"/><circle cx="9" cy="6.5" r=".6" fill="currentColor"/></svg>`,doc:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 15.5h6"/></svg>`};
const LBL={live:"running",done:"done",stop:"stopped"};
let F="all",SHOW=20;
const day=x=>{const t=new Date(2026,10,6),dd=new Date(x.getFullYear(),x.getMonth(),x.getDate()),n=Math.round((t-dd)/864e5);return n===0?"Today":n===1?"Yesterday":n<7?"This week":n<31?"Earlier this month":"Older"};
const fmt=x=>x.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · "+x.toTimeString().slice(0,5);
function draw(){const q=document.getElementById("q").value.toLowerCase(),box=document.getElementById("runs");
 const L=R.filter(r=>(F==="all"||r.st===F)&&(r.t+r.m+r.id).toLowerCase().includes(q));
 document.querySelectorAll(".fl button").forEach(b=>{const n=b.dataset.f==="all"?R.length:R.filter(r=>r.st===b.dataset.f).length;b.querySelector("i").textContent=n});
 if(!L.length){box.innerHTML='<div class="empty">No runs match.</div>';return}
 let h="",g="";L.slice(0,SHOW).forEach((r,k)=>{const G=day(r.d);if(G!==g){g=G;h+=`<div class="grp">${G}</div>`}
  h+=`<button class="run ${r.cur?"cur":""}" data-id="${r.id}"><span class="ic">${ICON[r.ic]}</span><span class="mid"><span class="t">${r.t}</span><code>${r.id}</code><div class="m">${fmt(r.d)} · ${r.m}</div></span><span class="r"><span class="st ${r.st}">${LBL[r.st]}</span><span class="open">${r.cur?"Open now":"Open"}</span></span></button>`});
 if(L.length>SHOW)h+=`<button class="more" id="more">Show ${Math.min(20,L.length-SHOW)} more · ${L.length-SHOW} left</button>`;
 box.innerHTML=h;document.getElementById("count").textContent=L.length===R.length?R.length+" runs":L.length+" of "+R.length+" runs";
 box.querySelectorAll(".run").forEach(b=>b.onclick=()=>{R.forEach(r=>r.cur=r.id===b.dataset.id);draw()});
 const m=document.getElementById("more");if(m)m.onclick=()=>{SHOW+=20;draw()}}
document.querySelectorAll(".fl button").forEach(b=>b.onclick=()=>{F=b.dataset.f;SHOW=20;document.querySelectorAll(".fl button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
document.getElementById("q").oninput=()=>{SHOW=20;draw()};draw();
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));const t=b.dataset.t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):b.dataset.t;document.documentElement.dataset.theme=t});
</script>
</body>
</html>
