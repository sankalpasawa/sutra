ons | W-9 | Also `.j2-btn`, `data-level=\"easy\"` / `\"medium\"` / `\"hard\"`, `aria-pressed`, class `.active` on the current level |\n| `#new-puzzle` | button | W-9 | Starts a new puzzle at the current level |\n| `#notes` | `.tool` button | W-10 | `aria-pressed`, `.active` when on; sets `state.notesMode` |\n| `.note` | small element inside an empty `.cell` | W-10 | One per marked candidate, in a 3\u00d73 sub-layout. Never on a given or filled cell. |\n| `#undo` | `.tool` button | W-11 | |\n| `.peer`, `.same`, `.conflict` | classes on `.cell` | W-12 | Up to 20 `.peer` when a cell is selected |\n| `#hint` | `.tool` button | W-13 | |\n| `.hint-cell` | class on one `.cell` | W-13 | At most one; carries no digit |\n| `#howto-btn` | button | W-14 | `aria-expanded`, `aria-controls=\"howto-panel\"` |\n| `#howto-panel` | `hidden` panel | W-14 | Closed on load. Short text from `copy.md`. |\n| `#howto-close` | button in the panel | W-14 | Labelled Close |\n| `#continue-prompt` | `hidden` overlay, `role=\"dialog\"` | W-15 | Shown only when a valid save exists |\n| `#continue-btn` | button in the prompt | W-15 | Labelled Continue |\n| `#win` | `hidden` overlay, `role=\"dialog\"` | W-16 | Friendly text from `copy.md`, no claims |\n| `#win-new` | button in `#win` | W-16 | Starts a new puzzle and clears the save |\n| `#app-boot` | `<script>` | W-17 | One only, last script on the page |\n\n**Rules about the markup:**\n- Cell labels (`aria-label`, `title`, `data-*`) may hold position and the digit currently shown. They must never hold a hint, a candidate or any other digit.\n- Hint, conflict and highlight states are shown only with classes. No digit is ever written for them.\n- The page must stay under about 60 KB. Audit sees at most about 150k characters.\n- The only in-page link is the nav link to `#board`; it must keep pointing at an existing element.\n- No handler may throw on an empty history, a missing save, unavailable storage, or nothing selected.\n\n## Rules for later workflows\n\n1. Follow the names, events and function signatures above exactly. Do not rename a hook.\n2. Never add a solution field, never store or log a finished grid, and never read one. Help features use `values` only.\n3. Only W-8's `applyMove` changes `values` or `notes` during play. Everything else asks it to.\n4. Hint, repeat and win logic use board values only. Win means: no empty cell and `SD.conflicts(values)` is empty. Because each puzzle has exactly one solution, that grid is the solution.\n5. No code at load time may call another section's functions. Use events.\n6. No digits in hint templates, in any form.\n7. Stay inside your own section and your own ids and classes. Style only your own hooks.\n8. Do not put claims, statistics or invented facts in any text.\n9. Use only the shared `SD` boilerplate to talk between sections. No globals besides `SD`.\n\n## Assumptions\n\nChosen by us because the Requester left details to us and the charter does not state them:\n- No CDN library; system fonts only.\n- Givens are selectable (to show equal numbers), but cannot be changed.\n- Entering the digit already in a cell does nothing; erase on an empty cell clears its notes.\n- Peer notes are not removed automatically; notes are filled only by the player.\n- Puzzles are not symmetric.\n- Clue ranges, technique limits and timings in Difficulty and Generation are UNVERIFIED.\n- Hint order and wording (repeat, stuck, single-cell, hidden, fewest) are our choice, and hints have no cost or score.\n- Undo history is saved, capped at 100 moves.\n- A finished game's save is cleared on win.\n- The start button in the header means \"go to the grid\".\n- The \"New puzzle\" button inside the continue prompt is identified by `data-action=\"new\"`, not an id.\n- No sound, scores, timers, sharing or accounts.\n", "copy.v1.md": "# Sudoku copy\n\nReference for W-5, W-9, W-10, W-11, W-13, W-14, W-15, W-16 and W-17. It follows the charter, `product-plan.md` and `architecture.md`. Names of ids and classes come from `architecture.md`; this file only decides wording. Anything the charter does not state is marked **(assumption)**.\n\nTone **(assumption: chosen by us, the Requester left details to us)**: warm, calm, short sentences, plain English, no pressure and no jargon. Nothing here makes a claim or gives a statistic. No wording tells the player that a non-repeating number is wrong, and no wording names a correct number.\n\n## Labels\n\nUse these exact texts on buttons and headings. Where a button needs a screen-reader name, the aria text is given too.\n\n| Key | Text | Used on | Aria or note |\n|---|---|---|---|\n| title | Sudoku | `h1` and page title | none |\n| tagline | A calm puzzle for a quick break. | under the `h1` (optional) | **(assumption)** |\n| nav-board | Go to the puzzle | nav link to `#board` | none |\n| start | Start playing | W-5 start button `.j2-btn` | **(assumption)** moves focus to the board |\n| easy | Easy | `.level-btn` | `aria-pressed` shows the chosen level |\n| medium | Medium | `.level-btn` | `aria-pressed` |\n| hard | Hard | `.level-btn` | `aria-pressed` |\n| level-group | Difficulty | label for the level wrapper | none |\n| new-puzzle | New puzzle | `#new-puzzle`, `#win-new` and the continue prompt | none |\n| digit | 1 to 9 | `.pad-digit`, text is the numeral | aria: \"Enter {n}\" |\n| erase | Erase | `#erase` | aria: \"Erase the selected cell\" |\n| notes | Notes | `#notes` | `aria-pressed` shows on or off |\n| undo | Undo | `#undo` | aria: \"Undo your last move\" |\n| hint | Hint | `#hint` | aria: \"Show a hint\" |\n| howto | How to play | `#howto-btn` | `aria-expanded` |\n| close | Close | `#howto-close` | aria: \"Close how to play\" |\n| continue | Continue | `#continue-btn` | none |\n| footer | No sign-up. No ads. | small line at the bottom (optional) | **(assumption)** |\n\n**Cell aria text.** Pattern: \"Row {r}, column {c}, {state}\". State is one of: \"given {n}\", \"your number {n}\", \"empty\", \"empty with notes {list}\". It describes only what is on the board and never the correct number.\n\n**Level words inside sentences.** Use the label text in lower case where a sentence needs it: easy, medium, hard.\n\n## How to play\n\nShort text for `#howto-panel`, closed on load. Show it as a heading \"How to play\" followed by these lines, one list item each.\n\n- Fill the grid so every row, every column and every 3x3 box holds the numbers 1 to 9, with no repeats.\n- The numbers already in the grid are fixed. Tap an empty cell, then tap a number under the grid.\n- Tap Erase to clear a cell you filled.\n- Switch on Notes to jot small pencil marks in a cell. Notes are only for you and never count as an answer.\n- If a number repeats in its row, column or box, it is marked. The mark tells you a number repeats. It never tells you the right answer.\n- Stuck? Tap Hint. It marks a cell to look at and explains why in words. It never gives you the number.\n- Made a slip? Tap Undo to take back your last move.\n- Your game is saved in this browser, so you can carry on later.\n\n## Hint templates\n\nUsed by `SD.findHint` (W-13) and written to `#message`. Every sentence here is free of numerals and of spelled-out numbers. A hint names no cell position, so it cannot hint at a digit through wording.\n\nPlaceholder: `{unit}` is replaced only by the word row, column or box. Nothing else is ever inserted.\n\n| Key | When it is used | Text |\n|---|---|---|\n| hint-cell-only | A marked cell has a sole candidate (a naked single). | Look at the marked cell. Its row, its column and its box already hold most of the numbers, so a sole candidate is left for it. Which number is missing from all of those neighbours? |\n| hint-place-only | A number fits in only one place in a row, column or box (a hidden single). | Look at the marked cell and the {unit} it sits in. A number that this {unit} still needs has nowhere else to go except this cell. Try each missing number and see which has no other place to go. |\n| hint-fewest | Neither of the above is found; the empty cell with the fewest possibilities is marked. | No clear next step stands out right now. The marked cell has the fewest possibilities left, so it is a good place to look. Check what its row, column and box already hold, and try Notes to jot the candidates down. |\n| hint-repeats-first | The board has marked repeats, so a hint would not be reliable. No cell is marked. | Some numbers repeat in a row, column or box. Sort out the marked repeats before asking for a hint. |\n| hint-grid-full | There is no empty cell. No cell is marked. | Every cell is filled, so there is nothing to point at. |\n\n## Repeats\n\nShown in `#message` when the player enters a number that repeats, and as the screen-reader text of a `.conflict` cell. These sentences say only that a number repeats. They never say what the right number is and never compare with the solution.\n\n| Key | Text |\n|---|---|\n| repeat-row | This number already appears in its row. |\n| repeat-column | This number already appears in its column. |\n| repeat-box | This number already appears in its box. |\n| repeat-many | This number repeats in more than one place. |\n| repeat-aria | Repeats in its row, column or box |\n| repeat-full | The grid is full, but a number repeats. Look for the marked cells. |\n\nChoice **(assumption)**: when a number repeats in several units, use `repeat-many`.\n\n## Continue\n\nShown in `#continue-prompt` when a saved game is found on return.\n\n- Heading: Welcome back\n- Body: Your {level} puzzle is waiting. Would you like to carry on?\n- Buttons: **Continue** (`#continue-btn`) and **New puzzle**\n- `{level}` is replaced by easy, medium or hard.\n- If the player chooses New puzzle, start a new puzzle at the level currently chosen and discard the old save.\n\n## Win\n\nShown in `#win` when the grid is full and has no repeats.\n\n- Heading: Well done!\n- Body: You filled the whole grid correctly. Take a moment to enjoy it. Ready for another whenever you are.\n- Button: **New puzzle** (`#win-new`)\n- No time, score, streak, count or comparison is shown **(assumption: nothing is measured, so nothing is claimed)**.\n\n## Messages\n\nShort lines for `#message`. Keep each to one or two lines so the page does not jump.\n\n| Key | When | Text |\n|---|---|---|\n| msg-start | A new game is ready | Tap a cell, then pick a number. |\n| msg-new | After a level or New puzzle choice | A fresh {level} puzzle is ready. |\n| msg-generating | While a puzzle is being made | Mixing up a new puzzle... |\n| msg-given | The player taps a number on a fixed cell and tries to change it | That number is part of the puzzle and cannot be changed. |\n| msg-select-first | A number button is tapped with no empty cell selected | Tap an empty cell first. |\n| msg-notes-on | Notes switched on | Notes are on. Numbers you tap become small pencil marks. |\n| msg-notes-off | Notes switched off | Notes are off. |\n| msg-undo-empty | Undo with no history | Nothing to undo yet. |\n| msg-no-save | Saving is unavailable in this browser | Saving is not available here, so this game will not be kept. |\n\n## Rules for later workflows\n\n- Use the texts above word for word. Do not add claims, statistics, times or counts to any message.\n- W-13: write only the templates in Hint templates. Fill `{unit}` with row, column or box and nothing else. Never add a digit, a cell position or the correct number to a hint. Set text with `textContent`. If you cannot match a template, use `hint-fewest`.\n- W-12: use the Repeats texts. Never read the stored solution to choose a message.\n- W-9: build the buttons from the Labels table. Easy is chosen on a first visit.\n- W-14: copy the How to play list as written. The panel is closed on load.\n- W-15: use the Continue texts. Storage failure shows `msg-no-save` and must not throw.\n- W-16: use the Win texts and show them only for a correct, full grid.\n- If a label you need is missing, use a plain, friendly wording in the same tone and note it as an assumption in your report.\n"}, "rzmd": "# Realization plan: A friendly, uncluttered, single-file Sudoku web game for casual players who want a quick game on their phone, with several difficulty levels and beginner help that never reveals answers, designed so people enjoy it and come back.\n\nPlan confidence **0.85** \u00b7 17 workflows \u00b7 1 revision round(s) \u00b7 8 AI calls \u00b7 683s \u00b7 sonnet \u00b7 web off\n\nGoal zone: `analyze`. Rule 3 needs open_choices to be 'no', but it is 'yes', so rule 4 applies and the zone is analyze. broken is no and reaction is no, so rules 1 and 2 do not apply. No signal is unknown, so rule 5 does not move the zone. Four decision workflows (product, architecture, design, copy) settle the open choices first. Build workflows then follow them, and most are operate. The puzzle engine and the hint finder stay analyze because their grading and technique choices carry the most risk. In this revision only two done-tests/inputs changed; no signal changed.\n\n## Factors\n\n| Factor | Source | Stages | Why |\n|---|---|---|---|\n| Casual phone audience incl. beginners | brief | product | It sets the scope: quick sessions, one-handed touch use, and help that teaches without spoiling. |\n| Enjoy and come back | brief | product | It decides which return-visit features are in scope without accounts, ads or tracking: saved game, several levels, a friendly win message. |\n| No sign-up, ads or tracking | brief | product | It limits scope. There are no accounts, no analytics, no third-party scripts and no external requests. |\n| Beginner help never reveals a digit | brief | product | It governs the hint, the repeat marks and the how-to text. Help may point and explain but must never place or show the answer. |\n| Warm calm uncluttered look | brief | design | It decides the palette, spacing and type scale, and what is left off the screen. |\n| Phone-first touch layout | brief | design | At 360px, nine cells across leave about 36px each, so the layout, button sizes and height budget need deliberate design. |\n| No invented facts | brief | content | All page text (how-to, hints, messages) must be plain instruction or encouragement with no stats, rankings or claims. |\n| Beginner-friendly how-to wording | general | content | Short, plain explanations of the rules and controls work best for newcomers. Unverified: no web access to check common practice. |\n| Single file, no build step | brief | engineering | It fixes the structure: one index.html with inline style and script sections and no external resources. |\n| Exactly one solution | brief | engineering | It decides the generator and the in-page solution counter that rejects any puzzle with two or more solutions. |\n| Difficulty levels meaning | general | engineering | Easy, Medium and Hard need defined clue ranges and technique limits so the levels feel different. Unverified: no web access to confirm common calibrations. |\n| Saved game reliability | general | engineering | localStorage can be blocked, full or hold old data, and none of that may cause a JavaScript error. Unverified: no web access. |\n| No errors or overflow at 360 and 1280 | brief | build | It is a standard for the finished page and needs one integration workflow that boots the page and checks the layout. |\n| Tokens and workflow count | budget | - | Time and tokens are limited, so the plan has one small workflow per output, no workflows that only check, and no stage that does not earn its place. |\n\n## Stages\n\n| Stage | Thinking | Zone (derived) | Confidence | Owns |\n|---|---|---|---|---|\n| product | Users and scope: who, which jobs, what is in and out, in what order | analyze | 0.95 | Casual phone audience incl. beginners, Enjoy and come back, No sign-up, ads or tracking, Beginner help never reveals a digit |\n| design | Experience: flows, layout, look, interaction, accessibility | analyze | 0.95 | Warm calm uncluttered look, Phone-first touch layout |\n| content | Words and media: what is said, its structure and tone | analyze | 0.89 | No invented facts, Beginner-friendly how-to wording |\n| engineering | Structure: components, interfaces, data model, scale (high-level and low-level design) | analyze | 0.95 | Single file, no build step, Exactly one solution, Difficulty levels meaning, Saved game reliability |\n| build | Making the thing: the code, page, app or document itself | analyze | 0.85 | No errors or overflow at 360 and 1280 |\n\n## Workflows\n\n| Workflow | Stage | Kind | Zone | Delivers | Informs | Reads | Scores | Held |\n|---|---|---|---|---|---|---|---|---|\n| product-plan | product | decide | analyze | - | 3, 5, 6, 9, 10, 11, 12, 13 | - | 0.89 \u2192 0.95 |  |\n| game-architecture | engineering | decide | analyze | - | 1, 3, 4, 6, 8, 9, 11 | product-plan | 0.95 \u2192 0.95 |  |\n| design-guide | design | decide | analyze | - | 1, 2, 7, 8, 10, 12, 14 | product-plan | 0.95 \u2192 0.95 |  |\n| copy-and-hint-wording | content | decide | analyze | - | 3, 9, 10, 11, 12 | product-plan, game-architecture | 0.89 \u2192 0.89 |  |\n| page-shell-and-layout | build | deliver | operate | 13 | 14 | design-guide, copy-and-hint-wording, game-architecture | 0.95 \u2192 0.95 |  |\n| puzzle-engine | build | deliver | analyze | 4 | 3 | game-architecture, page-shell-and-layout | 0.95 \u2192 0.95 |  |\n| board-and-cell-selection | build | deliver | operate | 1 | - | game-architecture, page-shell-and-layout, puzzle-engine, design-guide | 0.95 \u2192 0.95 |  |\n| number-pad-and-erase | build | deliver | operate | 2 | - | board-and-cell-selection, game-architecture, design-guide | 0.75 \u2192 0.95 |  |\n| difficulty-and-new-game | build | deliver | operate | 3 | - | puzzle-engine, board-and-cell-selection, copy-and-hint-wording | 0.95 \u2192 0.85 |  |\n| notes-mode | build | deliver | operate | 5 | - | number-pad-and-erase, board-and-cell-selection, design-guide | 0.95 \u2192 0.95 |  |\n| undo | build | deliver | operate | 6 | - | number-pad-and-erase, notes-mode | 0.95 \u2192 0.95 |  |\n| highlights-and-conflict-marks | build | deliver | operate | 7, 8 | - | board-and-cell-selection, design-guide | 0.95 \u2192 0.95 |  |\n| hint-finder | build | deliver | analyze | 9 | - | puzzle-engine, board-and-cell-selection, highlights-and-conflict-marks, copy-and-hint-wording, game-architecture | 0.95 \u2192 0.95 |  |\n| how-to-play-panel | build | deliver | operate | 10 | - | page-shell-and-layout, copy-and-hint-wording, design-guide | 0.95 \u2192 0.95 |  |\n| save-and-continue | build | deliver | operate | 11 | - | difficulty-and-new-game, notes-mode, undo, copy-and-hint-wording, game-architecture | 0.95 \u2192 0.95 |  |\n| win-celebration | build | deliver | operate | 12 | - | board-and-cell-selection, difficulty-and-new-game, save-and-continue, copy-and-hint-wording, design-guide | 0.95 \u2192 0.95 |  |\n| startup-and-link-integrity | build | deliver | operate | 14, 15 | - | page-shell-and-layout, game-architecture, design-guide, puzzle-engine, board-and-cell-selection, number-pad-and-erase, difficulty-and-new-game, notes-mode, undo, highlights-and-conflict-marks, hint-finder, how-to-play-panel, save-and-continue, win-celebration | 0.54 \u2192 0.95 |  |\n\n## Judge, last round\n\n| Workflow | Score | Weakest | Failed | Missing |\n|---|---|---|---|---|\n| product-plan | 0.95 | - | - | - |\n| game-architecture | 0.95 | - | - | - |\n| design-guide | 0.95 | - | - | - |\n| copy-and-hint-wording | 0.89 | done_test | D4 | 'no phrase giving the answer' and 'no ... other factual claim' need a reader's judgement. Only the label list, the 150-word limit and the no-digit rule can be checked mechanically. |\n| page-shell-and-layout | 0.95 | - | - | - |\n| puzzle-engine | 0.95 | - | - | - |\n| board-and-cell-selection | 0.95 | - | - | - |\n| number-pad-and-erase | 0.95 | - | - | - |\n| difficulty-and-new-game | 0.85 (looked twice: 0.85 / 0.85) | done_test | K6 | The test checks each level's given count against its own range. Nothing requires the three ranges to differ or not overlap, and no check compares the levels with each other. |\n| notes-mode | 0.95 | - | - | - |\n| undo | 0.95 | - | - | - |\n| highlights-and-conflict-marks | 0.95 | - | - | - |\n| hint-finder | 0.95 | - | - | - |\n| how-to-play-panel | 0.95 | - | - | - |\n| save-and-continue | 0.95 | - | - | - |\n| win-celebration | 0.95 | - | - | - |\n| startup-and-link-integrity | 0.95 | - | - | - |\n\nItem questions (frozen for this plan): K1 (item 1): Does a check verify that the page renders a 9x9 grid of 81 cells with the 3x3 box boundaries visibly marked?; K2 (item 1): Does a check verify that clicking or tapping an empty cell selects it, and that given cells cannot be changed or overwritten by the player?; K3 (item 2): Does a check verify that tapping each number button 1 to 9 enters that digit into the selected empty cell, and that the erase button clears the selected cell?; K4 (item 2): Does a check verify that the number buttons and the erase button each have a touch target of at least 44px at 360px width?; K5 (item 3): Does a check verify that Easy, Medium and Hard are all offered as choices and that choosing each one starts a new puzzle?; K6 (item 3): Does a check verify that the puzzles for the three levels differ in difficulty, such as by a different number of given cells?; K7 (item 4): Does a check verify that the page's own solver counts the solutions of each generated puzzle and accepts the puzzle only when the count is exactly one?; K8 (item 4): Does a check verify, across several generated puzzles at every difficulty level, that each one has exactly one solution?; K9 (item 5): Does a check verify that, with notes mode on, tapping a number button shows a small candidate number in the selected cell without entering it as the cell's value?; K10 (item 5): Does a check verify that tapping the same candidate number again in notes mode removes it, and that entering a real digit replaces the notes in that cell?; K11 (item 6): Does a check verify that pressing undo after a digit entry restores the cell to its state before that move?; K12 (item 6): Does a check verify that undo also reverses other kinds of move (erase, note), and does nothing harmful when there are no moves to undo?; K13 (item 7): Does a check verify that selecting a cell highlights all cells in its row, its column and its 3x3 box?; K14 (item 7): Does a check verify that selecting a cell holding a number highlights every other cell holding the same number?; K15 (item 8): Does a check verify that entering a digit that repeats in the same row, column or box marks the conflicting cells, and that the mark disappears when the conflict is fixed?; K16 (item 8): Does a check verify that the conflict marking does not display or reveal the correct digit for any cell?; K17 (item 9): Does a check verify that pressing hint highlights a cell where a next step is possible and shows a written explanation of the reasoning?; K18 (item 9): Does a check verify that the hint neither places a digit in the grid nor names the correct digit in the explanation or highlight?; K19 (item 10): Does a check verify that the how-to-play explanation is hidden until opened, appears when the player opens it, and disappears when the player closes it?; K20 (item 10): Does a check verify that the how-to-play explanation contains readable beginner text about how to play Sudoku (rows, columns, boxes, digits 1 to 9 used once)?; K21 (item 11): Does a check verify that the current grid, including entered digits, is saved in the browser and restored after the page is reloaded?; K22 (item 11): Does a check verify that, when the player returns with a saved game, the page offers to continue it and that accepting restores that game while declining starts a new one?; K23 (item 12): Does a check verify that completing the grid correctly shows a friendly congratulation message, and that an incomplete or incorrect grid does not show it?; K24 (item 12): Does a check verify that the congratulation message has a button that starts a new puzzle when pressed?; K25 (item 13): Does a check verify that the page contains no form for sign-up or login, no password or email input, and no advertising content?; K26 (item 13): Does a check verify that the page loads no external script, ad script or tracking script, and makes no requests to third-party hosts?; K27 (item 14): Does a check verify at 360px width that the whole grid and all number buttons are visible and that the page does not scroll horizontally?; K28 (item 14): Does a check verify at 1280px width that the page lays out correctly, with the grid and controls fully visible and nothing cut off?; K29 (item 15): Does a check verify that loading the page and playing it (selecting cells, entering digits, using hint, undo, notes and new game) logs no JavaScript errors?; K30 (item 15): Does a check verify at both 360px and 1280px that the document width does not exceed the viewport width?; K31 (item 15): Does a check verify that every in-page link (href starting with #) points to an element id that exists on the page?\n\n## Round 1 changes\n\n- **number-pad-and-erase** (done_test, `rewrite`): Rewrote the done_test. It now loops over every digit 1 to 9 (enter, check value, erase) instead of clicking only 5. It names the 44px by 44px touch minimum and the 360x640 viewport, and checks that all ten buttons sit inside the 360px width. It also loops over all ten buttons for the given-cell and no-selection cases.\n- **startup-and-link-integrity** (inputs, `realization:add`): Added game-architecture (the init order the approach follows) and design-guide (the height budget the CSS fixes need) to inputs_from, and named both in the approach.\n- **startup-and-link-integrity** (done_test, `rewrite`): Replaced the vague 1280 'centred, not stretched' line with measurable checks. At both sizes the board, the pad and every pad and action button must lie fully inside the viewport. At 1280x800 the joined board-and-pad box must have its centre within 16px of 640, and the board must be at most 640px wide.\n\n## Open facts\n\n- The game's title or name is not given in the charter. (non-blocking, page-shell-and-layout): Assumption: the page title and heading are the plain word 'Sudoku'. The Requester can rename it later.\n- Which difficulty is selected on a player's first visit is not given. (non-blocking, product-plan): Decision recorded as an assumption: first visit starts at Easy, which suits the beginners in the audience.\n"};
const MD={"streak-rules.md": "# Sudoku streak rules\n\nRules for counting, storing and showing the day streak (charter item 19: the number of days in a row the player has completed the daily puzzle, kept in the browser). W-32 daily-streak reads this file and follows it. It builds nothing itself.\n\nAnything marked \"Assumption\" is not given by the charter or the earlier files. The workflow that uses it must check it against the existing code or tell Coordination.\n\nNames fixed by game-architecture (change 2): `#streak`, `STREAK_LABEL`, `dayNumber`, `applyDailyWin`, `state.dailyDate`, `dateKey()`.\n\n## Storage\n\n- One record in `localStorage`, as JSON: `{\"v\":1,\"count\":N,\"last\":\"YYYY-MM-DD\"}`.\n  - `count`: whole number from 0 to 99999. The streak as of the last counted win.\n  - `last`: the date of the last daily puzzle the player completed, or `null` if none.\n- Key: `sudoku-streak-v1`. Assumption: this does not collide with the key W-15 uses for the saved game. W-32 must read W-15's key in the code and pick a different one if they clash.\n- Keep a copy of the record in memory as well, so the page works for the session even if storage is unavailable.\n- Read it once on load and after any write. Accept it only if it parses, `v` is 1, `count` is a whole number from 0 to 99999, and `last` is `null` or a valid date (see Day number). Anything else counts as the empty record `{\"v\":1,\"count\":0,\"last\":null}`.\n- Write only when a daily win changes the record. Never write on load, on level choice or on a non-daily win.\n- All storage calls are inside `try/catch` (see Failure).\n- The streak record is separate from the saved game. Starting a new puzzle never clears it.\n\n## Day number\n\n- Dates are text in the form `YYYY-MM-DD`, from `dateKey()` (the player's local date, as set in game-architecture).\n- `dayNumber(key)` turns such a key into a whole number of days:\n  1. Check the text matches `^\\d{4}-\\d{2}-\\d{2}$`. If not, return `null`.\n  2. Split into year, month and day. Compute `Date.UTC(year, month - 1, day)` and divide by 86400000 (whole days).\n  3. Check the date is real by reading the year, month and day back from that value. If they differ from the input (for example 2026-02-30), return `null`.\n  4. Return the whole number.\n- Using UTC for the arithmetic only avoids errors when clocks change for summer time. The key itself still comes from the local date.\n- Two dates are consecutive when `dayNumber(b) - dayNumber(a) === 1`. This is right across month ends, year ends and leap days.\n- If either number is `null`, no comparison is made and the record is left alone.\n\n## Update rule\n\n`applyDailyWin(record, puzzleDate, todayKey)` returns the record after one daily win. It never changes the record it was given (it returns a new object), never writes storage and never throws. The caller writes the result.\n\nApply in this order and stop at the first rule that fits:\n\n1. `puzzleDate` is `null` or not a valid date, or `todayKey` is not a valid date: return the record unchanged. A game that is not the daily puzzle never changes the streak.\n2. `puzzleDate` is not equal to `todayKey`: return the record unchanged. Assumption: a daily puzzle finished after midnight, or restored from a save made on an earlier day, does not count, because the streak counts the daily puzzle of the day it is played. Mention this choice to the Requester in the final summary.\n3. `record.last` equals `puzzleDate`: return the record unchanged. Today's daily is already counted, so finishing it a second time adds nothing.\n4. `record.last` is `null` (or the record is empty): `count` becomes 1.\n5. Let `gap = dayNumber(puzzleDate) - dayNumber(record.last)`:\n   - `gap === 1` (yesterday was completed): `count` becomes `record.count + 1`, at most 99999.\n   - `gap > 1` (at least one day was missed): `count` becomes 1. The streak starts again.\n   - `gap < 1` (the saved date is later than today, for example the device clock was moved back): return the record unchanged. Do not reset it.\n6. When `count` changes, set `last` to `puzzleDate`.\n\nCalling rules:\n- Call it once when `#win` opens on a correctly finished game whose `state.dailyDate` is valid. Use a per-game flag so reopening or redrawing `#win` does not call it twice. Rule 3 is the safety net if it does.\n- Read `todayKey` from `dateKey()` at the moment of the win, not at page load.\n- Hints used, notes and undo do not affect the streak. Assumption: the charter says \"completed the daily puzzle\" and does not say hints disqualify it.\n- Starting a level or New puzzle, abandoning the daily, or missing a day by itself changes nothing in storage. A missed day shows up only in Display (the count shows as 0) and in rule 5 at the next daily win.\n\nWorked examples (today is the date of the win, count is the stored count):\n\n| last | puzzleDate | todayKey | count before | result |\n|---|---|---|---|---|\n| null | 2026-11-03 | 2026-11-03 | 0 | count 1, last 2026-11-03 |\n| 2026-11-02 | 2026-11-03 | 2026-11-03 | 4 | count 5, last 2026-11-03 |\n| 2026-11-03 | 2026-11-03 | 2026-11-03 | 5 | unchanged |\n| 2026-11-01 | 2026-11-03 | 2026-11-03 | 7 | count 1, last 2026-11-03 |\n| 2026-10-31 | 2026-11-01 | 2026-11-01 | 2 | count 3 (month end) |\n| 2026-12-31 | 2027-01-01 | 2027-01-01 | 9 | count 10 (year end) |\n| 2028-02-28 | 2028-02-29 | 2028-02-29 | 1 | count 2 (leap day) |\n| 2026-11-02 | 2026-11-02 | 2026-11-03 | 4 | unchanged (finished after midnight) |\n| 2026-11-05 | 2026-11-03 | 2026-11-03 | 6 | unchanged (clock went back) |\n| any | null | 2026-11-03 | 3 | unchanged (not a daily game) |\n\n## Display\n\n- `#streak` is one element that is always on the page, not hidden until a win. It shows `STREAK_LABEL` and the count, for example \"Day streak\" and \"3\". `STREAK_LABEL = 'Day streak'` (wording comes from copy.md; use its text if it differs).\n- The number shown is the stored `count`, except when the streak has lapsed: if `dayNumber(todayKey) - dayNumber(record.last) > 1`, show 0. The stored record stays as it is until the next daily win (rule 5 then restarts it at 1). If today's or yesterday's daily was completed, show the stored `count`.\n- Update what `#streak` shows on page load, when `#daily` is pressed, and after a daily win writes the record. Assumption: no live timer is needed to catch midnight while the page stays open; the next daily press or win recalculates.\n- Set the text with `textContent` from a whole number. Never put raw storage text into the page.\n- Wording is kind and plain: no scolding when the count is 0, no pressure, no \"you lost your streak\". No claims about other players, rankings or averages.\n- Placement and size come from design-guide.md. `#streak` must stay inside the viewport, and `#pad` must stay visible on a 360x640 phone screen with no horizontal scrolling at 360px or 1280px. Give it a text label as well as the number so it does not depend on colour.\n\n## Daily mark\n\n- The daily mark is `state.dailyDate`: the `YYYY-MM-DD` date of the daily puzzle being played, or `null`.\n- `#daily` sets it to `dateKey()` after it starts the daily game. `SD.newGame(level)`, `#new-puzzle`, every `.level-btn` and the Continue prompt's New puzzle set it to `null`.\n- W-15 saves and restores it with the game (W-33). A restored game keeps its mark, so a daily game that is continued still counts when it is won on the same day.\n- The mark is the only thing that tells the streak a game is the daily. Never decide it from the puzzle contents, the level or the time of day.\n- Boot must not call `SD.newGame` after a restore or Continue, because that would erase the mark (game-architecture and W-34).\n- Pressing `#daily` after today's daily has been completed starts the same puzzle again. Winning it adds nothing (rule 3).\n\n## Failure\n\n- Storage unavailable, blocked, full or throwing on read or write: catch it, do not show an error, keep the in-memory record for this session, and keep the game and the win message working. The streak may then not survive a reload.\n- Stored text missing, not valid JSON, wrong version, wrong shape, `count` not a whole number from 0 to 99999, or `last` not a valid date: use the empty record. Do not throw and do not try to repair it.\n- `dateKey` or `dayNumber` missing or returning `null`: the guarded call does nothing and the streak stays as it was. Guard every call with an existence check, so a missing function never throws.\n- Any error inside `applyDailyWin` or the code that calls it is caught. The win message still shows and the new-puzzle button still works.\n- The same failure must never block `#win`, `#daily`, level buttons, the pad or saving the game.\n- If the device clock is wrong, the streak follows the device clock. The page does not try to detect cheating.\n\n## Privacy\n\n- The streak lives only in this browser, in `localStorage`. Nothing is sent anywhere: no network request, no cookie, no analytics, no tracking, no account.\n- Clearing site data, or using another browser or device, starts the streak from nothing. The page must not say or suggest that the streak follows the player across devices.\n- Do not claim how many other players there are or what they did. Say only what the page itself knows: the player's own number of days.\n- Do not add a share button, leaderboard or any link out. None is in the charter.\n", "architecture.md": "# Sudoku architecture\n\nTechnical plan for the single-file Sudoku page. Later workflows read this file and follow it. Change 2 adds the daily puzzle (item 18) and the day streak (item 19). Items 1 to 17 behave as before. R-6 (39px cells) and the page size are out of scope.\n\nAnything marked \"Assumption\" is not given by the charter or the earlier files and must be checked against the existing code by the workflow that uses it.\n\n## Structure\n\nOne HTML file with plain HTML, CSS and JavaScript. No build step, no external requests, no forms. Each workflow owns one marked section and writes only that section.\n\n| Section | Owner role | Holds |\n|---|---|---|\n| style | W-5 | shared style guide, `.j2-btn`, `.j2-btn-secondary`, `.j2-card` |\n| W-5 | shell | header, `#site-nav`, `#app`, `#board`, `#message`, `#pad`, skip link, footer |\n| W-6 | engine | `#engine-script`: `SD.engine` with solve, countSolutions, generate |\n| W-7 | board | `#w7-cells`: builds 81 `.cell` buttons, selection |\n| W-8 | pad | `.pad-digit` x9 and `#erase` |\n| W-9 | levels | `#new-puzzle`, `.level-btn` x3, `#daily`, `#w9-script`, daily seed helpers |\n| W-10 | notes | `#notes`, `.note` spans |\n| W-11 | undo | `#undo`, snapshot stack |\n| W-12 | marks | `.peer`, `.same`, `.conflict` |\n| W-13 | hint | `#hint`, `.hint-cell`, hint text |\n| W-14 | how to play | `#howto-btn`, `#howto-panel`, `#howto-close` |\n| W-15 | save | `#continue-prompt`, `#continue-btn`, save and restore |\n| W-16 | win | `#win`, `#win-time`, `#win-hints`, `#win-new` |\n| W-17 | boot | `#app-boot`: startup order |\n| W-32 (new) | streak | `#streak`, `STREAK_LABEL`, `dayNumber`, `applyDailyWin` |\n\nModules talk through one global object `SD` and DOM events, not through each other's private variables. Assumption: the existing events are `newgame` and `change` and `win` handling is driven by `change`; later workflows check the code before relying on any other event name.\n\n## State\n\n`SD.state` is the single source of truth for the current game:\n\n- `puzzle`: 81 values, 0 for an empty cell (the givens)\n- `solution`: 81 values, used only by the generator, the hint finder's own checks and the win check. Never used for conflict marking and never shown.\n- `values`: 81 values as the board now stands\n- `given`: 81 booleans\n- `notes`: 81 sets of candidate digits\n- `selected`: index 0 to 80 or null\n- `level`: `easy`, `medium` or `hard`\n- `elapsedMs`: whole milliseconds played, number >= 0\n- `hintsUsed`: whole number >= 0\n- `dailyDate`: string `YYYY-MM-DD` when the current game is the daily puzzle, otherwise `null`. New field in change 2.\n\nRules for `dailyDate`:\n- Set to `dateKey()` when `#daily` starts a game.\n- Set to `null` by `SD.newGame(level)`, `#new-puzzle` and every `.level-btn`.\n- Saved and restored with the game (see Save). Restore accepts it only if it is a string matching `^\\d{4}-\\d{2}-\\d{2}$`; anything else becomes `null`. Old saves without the field restore as `null`.\n\n## Generation\n\n`SD.engine.generate(level)` returns `{puzzle, solution}` for `easy`, `medium` or `hard`. It removes digits from a full solved grid, one cell at a time, and keeps a removal only if the solver still counts exactly one solution (see Uniqueness).\n\nNormal play uses the plain generator with the normal `Math.random`.\n\n### Daily puzzle (item 18)\n\nThe daily puzzle is the same generator, run with a seed taken from the date:\n\n- `DAILY_LEVEL = 'medium'` (assumption: the charter does not name a daily level; Medium is a middle choice, to be told to the Requester in the final summary).\n- `dateKey()` returns the player's local date as `YYYY-MM-DD`. Assumption: \"current date\" means the date on the player's device, so the puzzle changes at local midnight. Players in different time zones may get different puzzles at the same moment; the page must not claim otherwise.\n- `hashSeed(str)` is FNV-1a over the characters of the key, returning an unsigned 32-bit integer.\n- `seededRandom(seed)` is mulberry32, returning a function that gives numbers in [0, 1).\n- `#daily` calls `generate(DAILY_LEVEL)` with `Math.random` temporarily replaced by `seededRandom(hashSeed(dateKey()))`, inside `try/finally` so `Math.random` is always restored, even on an error.\n- The seed is read only from `dateKey()`. Nothing else (player, time of day, history) feeds it.\n\nSameness requirement: everyone gets the same puzzle only if the generator's result depends on nothing but the sequence of `Math.random` calls. Assumption to check in W-6's code: generate has no branch on elapsed time, `Date.now`, `performance.now` or a try-count limit that depends on device speed. If it does, W-30 must make the daily path independent of them (for example, a fixed attempt count) without changing normal play. If the daily result cannot be made repeatable, W-30 reports it to Coordination instead of shipping a daily that differs between devices.\n\n## Uniqueness\n\nEvery puzzle, including the daily one, is accepted only when the page's own solver `countSolutions(puzzle, 2)` returns exactly 1 and `solve(puzzle)` equals the source solution. The fallback loop also requires a count of 1. The seeded path goes through the same function, so it carries the same guarantee. No code path may return a puzzle that skipped this check.\n\n## Difficulty\n\nThree levels, `.level-btn` buttons named Easy, Medium and Hard. Each calls `SD.newGame(level)`, which calls `SD.engine.generate(level)`, sets `dailyDate = null`, resets `elapsedMs` and `hintsUsed` to 0, clears undo history and notes, and fires the new-game event. The active level button gets `.active`. Level differs by how many digits are removed and, where the code already does so, how hard the remaining steps are. Assumption: exact removal counts are as in the existing engine and are not changed by change 2.\n\n`#daily` marks Medium as active, because the daily puzzle is a Medium game. `#new-puzzle` starts a fresh puzzle at the active level. Normal level buttons keep giving fresh random puzzles and must never be seeded.\n\n## Hints\n\n`#hint` finds a cell where a next step is possible (the existing `findHint` returns a cell index and a text key). It adds `.hint-cell` to that cell and shows the words in `#message`. Hint wording contains no digits. It never places a value, never writes a note and never shows the digit. Hints work the same on the daily puzzle. The hint finder reads the board, not the stored solution to display anything.\n\n## Conflicts\n\n`SD.conflicts` compares board values only (rows, columns, boxes) and adds `.conflict` to repeated numbers. It never reads `SD.state.solution`. No change in change 2.\n\n## Undo\n\n`#undo` pops a snapshot stack of values and notes and restores them. It does nothing, without an error, when the stack is empty. Starting any new game (level, new puzzle, daily) clears the stack. Undo does not change `hintsUsed` or `elapsedMs`. No change in change 2.\n\n## Timer and hint count\n\n- `elapsedMs` counts only time when the player can play. The timer ticks about every 500 ms and adds the time since its last tick. It is paused when the page is hidden, when `#win` is shown and while `#continue-prompt` is open.\n- `hintsUsed` rises by 1 only when `.hint-cell` appears after a `#hint` press. It does not rise for notes, undo or highlights.\n- Both reset to 0 in `SD.newGame` and in `#daily`.\n- `#win-time` shows `elapsedMs` as minutes and seconds. `#win-hints` shows `hintsUsed` with the wording from copy.md.\n- On the daily puzzle the win message shows the same time and hints as on any other puzzle.\n\n## Streak (item 19)\n\nThe streak counts days in a row on which the player completed the daily puzzle. It lives in W-32's section. The detailed rules (storage, day counting, update, display, failure, privacy) are in `streak-rules.md` (W-31); this file fixes only the shape.\n\n- Storage: its own localStorage key, separate from the saved game, so a new game never erases it. Value is versioned JSON holding the last completed daily date and the count. Assumption: key name and exact fields are set in `streak-rules.md`.\n- `STREAK_LABEL = 'Day streak'` (final wording from copy.md).\n- `dayNumber(key)` turns a `YYYY-MM-DD` key into a whole day count in a way that does not drift on daylight-saving days (for example, `Date.UTC` on the parsed parts divided by 86400000, rounded down).\n- `applyDailyWin(record, puzzleDate, todayKey)` returns the new record. Summary of what it must guarantee:\n  - Only a daily game (`state.dailyDate` is not null) can change the streak. A win on Easy, Medium or Hard from the level buttons, or on New puzzle, never changes it.\n  - It runs once per win: when `#win` opens on a daily game. Winning the same date's daily again (press Daily puzzle again and finish) must not add a second day.\n  - The streak rises only when `puzzleDate` equals `todayKey`; consecutive days add 1, a gap restarts the count at 1. Assumption: a daily puzzle started on one day and finished after midnight does not count; `streak-rules.md` may refine this.\n- `#streak` shows `STREAK_LABEL` and the count. It reads the stored record on load, so it shows the right number before any game. If the stored last date is older than yesterday, the display shows 0 (the streak is broken) but the stored record is only rewritten on the next daily win. Assumption: the display rule follows `streak-rules.md`.\n- Nothing is sent anywhere. No network call, no cookie, no claim about other players. The page may say \"everyone gets the same puzzle each day\" only as a description of how it picks the puzzle, with no counts of players.\n- Storage failure (private mode, quota, disabled storage) never throws: wrap every read and write in `try/catch`; on failure the streak shows 0 and the game keeps working.\n\n## Save\n\nVersioned JSON in localStorage, written after each change and at new game, wrapped in `try/catch`. Fields: version, level, puzzle, solution, values, given, notes, `elapsedMs`, `hintsUsed` and, from change 2, `dailyDate`.\n\n- Restore accepts `elapsedMs` only if it is a finite number >= 0 and `hintsUsed` only if it is a whole number >= 0; otherwise 0. `dailyDate` as described under State.\n- On load with a valid save, show `#continue-prompt` with `#continue-btn` (Continue) and a New puzzle button. The timer stays paused while the prompt is open.\n- Continue restores the saved game as it was, including a daily game. A restored daily game is not regenerated, so it is the puzzle that was saved even if the date has since changed. Finishing it after the date has changed does not raise the streak (see Streak).\n- New puzzle from the prompt calls `SD.newGame`, which sets `dailyDate` to `null` and resets time and hints.\n- The streak record is not part of the saved game and is not touched by Save or New puzzle.\n- A storage error never throws and never blocks play.\n\n## DOM contract\n\nIds and classes later workflows may rely on. Do not rename. Do not create a second element with the same id.\n\nExisting, unchanged:\n- Shell: `#w5-start`, `#site-nav`, `#app`, `#board`, `#message`, `#pad`\n- Cells: `.cell` (81 in `#board`), state classes `.empty`, `.given`, `.player`, `.selected`, `.peer`, `.same`, `.conflict`, `.hint-cell`, notes as `.note` spans\n- Pad: `.pad-digit` x9, `#erase` (every tap target at least 44px)\n- Levels: `.level-btn` x3 (names Easy, Medium, Hard; `.active` marks the chosen one), `#new-puzzle`\n- Tools: `#notes`, `#undo`, `#hint`\n- How to play: `#howto-btn`, `#howto-panel` (hidden on load), `#howto-close`\n- Save: `#continue-prompt`, `#continue-btn`\n- Win: `#win` (hidden until a correct, complete grid), `#win-time`, `#win-hints`, `#win-new`\n- Boot: `#app-boot`\n\nNew in change 2:\n- `#daily`: one button labelled Daily puzzle, classes `j2-btn j2-btn-secondary`, in section W-9 next to the level buttons, at least 44px tall. Clicking it starts the daily puzzle and shows `#board`.\n- `#streak`: one element showing the label and the count, in W-32's section. Visible on load, inside the viewport, and it must not push `#pad` off a 360x640 screen or cause horizontal overflow. Its exact position is decided by design-guide.md (W-28). Assumption: it sits near the level controls. It is plain text, not a link, so it adds no in-page link to check.\n\nShared API on `SD` (names that exist or are added):\n- `SD.newGame(level)`: starts a random puzzle, sets `dailyDate = null`.\n- `SD.engine.generate(level)`: returns `{puzzle, solution}`.\n- `SD.state`: as in State.\n- Helpers added in W-9: `dateKey`, `hashSeed`, `seededRandom`, `DAILY_LEVEL`, `DAILY_LABEL`. Added in W-32: `STREAK_LABEL`, `dayNumber`, `applyDailyWin`.\n- Assumption: how `#daily` loads a given generated puzzle into `SD.state` uses the same path `SD.newGame` uses. If `SD.newGame` cannot accept an already generated puzzle, W-30 adds a small loader in section W-9 and has it reset time, hints, notes and undo exactly like `SD.newGame`, and set `dailyDate` afterwards.\n\n## Rules for later workflows\n\n1. Change only your own section. Keep ids and classes above unchanged.\n2. Every puzzle, including the daily one, must pass the exactly-one-solution check.\n3. `Math.random` must be restored after a seeded run, using `try/finally`.\n4. Hint text and help never contain a digit and never place or show the answer.\n5. Only a completed daily game can change the streak. Level and New puzzle wins never do.\n6. Storage reads and writes never throw. No network calls, cookies or forms.\n7. At 360x640, `#board` and `#pad` stay visible and nothing overflows horizontally. At 1280px it displays correctly.\n8. Do not state facts, numbers of players or statistics that the charter does not give.\n", "product-plan.md": "# Sudoku product plan\n\nA friendly, uncluttered, single-file Sudoku web game for casual players who want a quick game on their phone, with several difficulty levels and beginner help that never reveals answers, designed so people enjoy it and come back.\n\nAudience: casual players who play quick games on their phones, such as on a commute, including beginners.\n\n## Scope\n\nIn scope: the 19 done-when items below, in one plain HTML, CSS and JavaScript file with no build step.\n\nOut of scope for this change (change 2): the 39px grid cell size (R-6), the page size over the ~60 KB guidance, and anything not in the 19 items. Items 1 to 17 stay as they are; change 2 adds only items 18 and 19.\n\nChange 2 adds a daily puzzle button and a day streak counter. Both stay in the browser. Nothing is sent anywhere.\n\n## Priority list\n\n### Must (the page is not a Sudoku game without these)\n1. Item 1: 9x9 grid with 3x3 boxes marked; givens fixed; empty cells selectable and fillable.\n2. Item 2: number buttons 1 to 9 and an erase button, sized for touch.\n3. Item 3: Easy, Medium and Hard; choosing one starts a new puzzle of that level.\n4. Item 4: each generated puzzle has exactly one solution, checked by the page's own code.\n5. Item 13: no sign-up form, no login, no ads, no ad scripts.\n6. Item 14: fits 360px wide with grid and number buttons visible and no horizontal scrolling; displays correctly at 1280px.\n7. Item 15: no JavaScript errors, no horizontal overflow at 360px and 1280px, every in-page link points to an existing section.\n\n### Should (what makes it friendly and worth returning to)\n8. Item 5: notes mode for small candidate numbers.\n9. Item 6: undo reverses the last move.\n10. Item 7: selecting a cell highlights its row, column and box, and other cells with the same number.\n11. Item 8: a number repeated in its row, column or box is marked, without showing the correct answer.\n12. Item 9: hint button points to a cell where a next step is possible and explains the reasoning in words, without placing or showing the digit.\n13. Item 10: short how-to-play explanation that opens and closes.\n14. Item 11: current game saved in the browser; the player is offered to continue it on return.\n15. Item 12: friendly congratulation on a correct finish, with a button to start a new puzzle.\n16. Item 16: the win message shows the time taken.\n17. Item 17: the win message shows the number of hints used.\n18. Item 18: a Daily puzzle button starts a puzzle chosen from the current date.\n19. Item 19: a streak counter shows the days in a row the player has completed the daily puzzle.\n\n### Could\nNothing is committed beyond the 19 items. Any further idea needs a new done-when item from the Requester first.\n\n## Acceptance\n\n- Item 1: the board holds 81 cells; box lines are visible; tapping a given changes nothing; tapping an empty cell selects it.\n- Item 2: nine digit buttons and Erase, each at least 44px, enter or clear the selected empty cell.\n- Item 3: three level buttons named Easy, Medium and Hard; each starts a new puzzle.\n- Item 4: the generator accepts a puzzle only when its own solver counts exactly one solution. This also holds for the daily puzzle.\n- Item 5: in notes mode a digit adds or removes a small note and never sets a value.\n- Item 6: undo restores the state before the last move and does not fail when there is nothing to undo.\n- Item 7: row, column, box and same-number cells are visibly tinted when a cell is selected.\n- Item 8: repeats are marked by comparing the numbers on the board only, never the solution.\n- Item 9: a hint marks a cell and shows words with no digit; the digit is neither placed nor shown.\n- Item 10: the panel is closed on load, opens from a button and closes again.\n- Item 11: after a reload with a saved game, a prompt offers Continue or New puzzle; a storage error never throws.\n- Item 12: the congratulation shows only when the grid is full and correct, and has a New puzzle button.\n- Item 13: no forms, no login, no ad content, no external resources.\n- Item 14: no horizontal scroll at 360px or 1280px; the grid and pad are visible on a 360px phone screen.\n- Item 15: no JavaScript errors; no overflow at either width; no broken in-page link.\n- Item 16: the win message shows the time taken, counted while the player is playing.\n- Item 17: the win message shows the hints used, counted only when a hint marks a cell.\n- Item 18: the Daily puzzle button gives the same puzzle for the same date and a different puzzle on the next date; the normal level buttons still work and give fresh puzzles.\n- Item 19: the streak counter shows the number of consecutive days with a completed daily puzzle; only a correctly completed daily puzzle can raise it; it is stored in the browser.\n\n## Rules\n\n1. Beginner help must never fill in or reveal a correct digit\n2. Every puzzle must have exactly one solution\n3. No sign-up, login, ads or ad scripts anywhere on the page\n4. Never invent facts; the page contains no made-up claims or statistics\n\n## Help policy\n\n- Help may point to a cell and explain the reasoning in words. It never places a digit and never shows a digit.\n- Hint wording contains no digits.\n- Repeat marking compares what is on the board. It never reads the solution.\n- Notes, undo and highlights are free to use. A hint counts toward the hints used shown on the win message.\n- The daily puzzle gets the same help as any other puzzle, with the same rules.\n\n## Engagement\n\nWhy people come back, using only what the Requester asked for:\n- No sign-up and no ads, so a quick game on a commute starts at once.\n- A calm, warm look and large touch targets.\n- Three levels, so players can pick a game that suits the moment.\n- Continue prompt, so an interrupted game is not lost.\n- A friendly win message with time taken and hints used.\n- Daily puzzle: one button gives everyone the same puzzle for the day, and a new one the next day.\n- Day streak: the number of days in a row the player has completed the daily puzzle. Wording is kind and never scolds when a streak ends.\n- Streak and daily progress stay in the browser only. No sign-up, no tracking, no network call, no cookie, and no claims about other players.\n- Storage rules for the streak are in streak-rules.md.\n\n## Assumptions\n\nAssumption: the charter does not set the daily puzzle's difficulty or how a day is counted. The daily puzzle is Medium, and a day is the player's local calendar date. A player in a different time zone may get a different date's puzzle. The Requester can change this.\n", "copy.md": "# Sudoku copy\n\nAll wording for the single-file Sudoku page. Later workflows copy these lines exactly and do not invent new claims. Change 2 adds the Daily puzzle and Day streak wording.\n\nTone: warm, short, kind. Never scold. Never claim anything about other players, rankings or statistics.\n\nPlaceholders in curly braces, such as {time}, are filled in by the page code. Anything marked \"Assumption\" is not given by the charter and must be checked by the workflow that uses it.\n\n## Labels\n\nButtons and controls. Each line is the visible text, then the aria-label where it differs.\n\n| Control | Visible text | aria-label |\n|---|---|---|\n| Page title | Sudoku | |\n| Level buttons | Easy, Medium, Hard | Start a new Easy puzzle, Start a new Medium puzzle, Start a new Hard puzzle |\n| New puzzle button | New puzzle | Start a new puzzle at the chosen level |\n| Daily puzzle button | Daily puzzle | Start today's daily puzzle |\n| Notes toggle | Notes | Turn notes mode on or off |\n| Notes toggle, on | Notes: on | |\n| Notes toggle, off | Notes | |\n| Undo button | Undo | Undo your last move |\n| Hint button | Hint | Get a hint with words only |\n| Erase button | Erase | Erase the selected cell |\n| Digit buttons | 1 to 9 | Enter 1, Enter 2, and so on up to Enter 9 |\n| How to play button | How to play | Open how to play |\n| How to play close | Close | Close how to play |\n| Skip link | Skip to the game | |\n| Day streak label | Day streak | Days in a row you have completed the daily puzzle |\n| Level shown in daily message | Medium | |\n\n### Daily puzzle\n\n- Button text: Daily puzzle\n- Message when it starts: Today's daily puzzle. It is picked from the date on your device.\n- Message when the daily puzzle is already finished today and the button is pressed again (Assumption: the page may show this only if the code knows the daily was completed today): You already finished today's daily puzzle. Come back tomorrow for a new one.\n- Small note under the button, optional: A new daily puzzle appears each day.\n- The page does not say that all players worldwide get the same puzzle at the same moment, because the date comes from each device. Say only \"picked from the date on your device\".\n\n### Day streak\n\n- Label: Day streak\n- Display: Day streak: {count}\n- Display when the count is 0: Day streak: 0\n- Hint line when the count is 0: Finish a daily puzzle to start a streak.\n- Display when the count is 1: Day streak: 1\n- Line after the daily win raises the streak: Day streak: {count}. Nice, keep it going tomorrow.\n- Line when the streak starts again after a missed day: A fresh streak begins today. Welcome back.\n- Never use words like \"lost\", \"failed\" or \"broken\" about a streak.\n- The streak is kept in this browser only. Optional small note: Your streak is kept in this browser.\n\n## How to play\n\nTitle: How to play\n\nShort text for beginners. Nothing here reveals an answer.\n\n- Fill the grid so every row, every column and every 3x3 box holds the numbers 1 to 9 once each.\n- Tap an empty square, then tap a number below to place it. The numbers already on the board cannot be changed.\n- Tap Erase to clear the square you picked.\n- Notes: turn on Notes to jot small possible numbers in a square. Notes never place a number.\n- Undo takes back your last move.\n- Hint points to a square where a next step is possible and explains the thinking in words. It never gives you the number.\n- If a number appears twice in a row, column or box, it is marked so you can spot it.\n- Choose Easy, Medium or Hard to start a new puzzle. Daily puzzle gives a puzzle picked from today's date, and the Day streak counts the days in a row you finish it.\n- Your game is saved in this browser, so you can pick it up later.\n- Close button text: Close\n\n## Hint templates\n\nRules: a hint template contains no digits at all, no numerals and no digit symbols. It names a place on the board in words and explains the reasoning. It never says which number goes in the cell and never places one.\n\nThe code marks the cell with the hint highlight and shows one of these lines in the message area. Keys are suggestions; the hint workflow maps its own technique names to the nearest line (Assumption: key names are not fixed by the charter).\n\n| Key | Text |\n|---|---|\n| box-single | Look at the highlighted square. Nearly every other square in its box is taken, so only one number can still fit there. |\n| row-single | Look at the highlighted square. Its row is almost complete, so only one number is missing and it belongs here. |\n| column-single | Look at the highlighted square. Its column is almost complete, so only one number is missing and it belongs here. |\n| only-candidate | Look at the highlighted square. The numbers already in its row, column and box rule out all but one possibility. |\n| hidden-in-box | In the highlighted square's box, there is a number that has only one place left to go, and this is that place. |\n| hidden-in-row | In the highlighted square's row, there is a number that has only one place left to go, and this is that place. |\n| hidden-in-column | In the highlighted square's column, there is a number that has only one place left to go, and this is that place. |\n| generic | Take a close look at the highlighted square. Check its row, its column and its box, and see which numbers are already used. |\n| none-found | No easy next step stands out right now. Try turning on Notes and writing the possible numbers in a few squares. |\n| mistake-nearby | Something on the board looks off. Check the marked squares first, then try the hint again. |\n| after-hint-reminder | A hint points the way. The number is up to you. |\n\nEvery line above is free of digits. A workflow that adds a template checks that rule before saving.\n\n## Repeats\n\nUsed when a number appears twice in a row, column or box. The page marks the repeated numbers and never shows the right answer.\n\n- Short message: This number already appears in its row, column or box.\n- Gentle message: A number is repeated here. Check the marked squares.\n- Screen-reader label for a marked square: Repeated number\n- Never say which number should go there.\n\n## Continue\n\nTitle: Welcome back\n\n- Body: You have a game in progress.\n- Level line: Level: {level}\n- Daily line (when the saved game is the daily puzzle): This is a daily puzzle.\n- Time line, optional: Time played so far: {time}\n- Continue button: Continue\n- New puzzle button: New puzzle\n- Note: time spent on this prompt is not counted. Choosing New puzzle starts a fresh puzzle and clears the saved time and hint count.\n- If saving is not possible in the browser, the page stays silent and does not show an error.\n\n## Win message\n\nTitle: Well done!\n\n- Body: You finished the puzzle. Lovely work.\n- Time line: Time: {time}\n- Time format: minutes and seconds as m:ss, for example 4:07, and h:mm:ss only if the game took an hour or more.\n- Hints line: Hints used: {hints}\n- Hints line when {hints} is 0: Hints used: 0. No hints needed, nicely done.\n- Hints line when {hints} is 1: Hints used: 1\n- New puzzle button: New puzzle\n- Close or dismiss: not required by the charter (Assumption: the New puzzle button is the only action).\n\n### After a daily puzzle win\n\n- Extra line under the hints: Daily puzzle complete.\n- Streak line: Day streak: {count}\n- Encouragement when the streak is 1: That is a start. Come back tomorrow for the next daily puzzle.\n- Encouragement when the streak is more than 1: Day {count} in a row. See you tomorrow.\n- If the player already finished today's daily puzzle earlier, the streak line shows the same count and no second increase happens.\n\n### Not shown\n\n- No claims about speed compared with other players, no rankings, no percentages, no statistics.\n", "design-guide.md": "# Sudoku design guide (change 2)\n\nGoal: a warm, calm, uncluttered, phone-first Sudoku. Change 2 adds a Daily puzzle button (item 18) and a Day streak counter (item 19) without pushing the number pad off a 360x640 phone screen.\n\nOut of scope: the 39px grid cell size (R-6, accepted by the Requester) and the page size over ~60 KB. This guide does not change them.\n\nAnything marked \"Assumption\" is not given by the charter. If the existing page already uses a different value for something marked \"Assumption\", keep the page as it is and do not restyle it.\n\n## Colours\n\nFrom the page's style guide (do not change):\n- Primary (teal): #2F6F6A. Text on primary: #FFFFFF.\n- Secondary (sand): #EFE5D6, border #D9CFC2.\n- Accent (amber): #C98A1B. Use only for borders, outlines and underlines, never for text (too pale for small text on cream).\n- Background: #FBF6EE. Surface (cards, cells): #FFFDF9.\n- Text: #2F2A26. Muted text: #6B6159.\n\nGrid and state colours (Assumption: the existing page values win if they differ):\n- Given digit: #2F2A26, weight 600. Player digit: #2F6F6A.\n- Selected cell: soft teal tint. Row, column and box peers: #EFE5D6. Same-number cells: a light amber tint.\n- Repeat (conflict) mark: a warm red text on a pale red tint. Never colour alone: also keep the existing visual mark.\n- Hint cell: 3px accent (#C98A1B) outline. No digit shown.\n- Thin cell lines #D9CFC2 (1px). Box lines #2F2A26 (2px).\n\nNew in change 2:\n- Daily puzzle button: secondary button style plus a 2px accent (#C98A1B) border, so it stands out as special without competing with the teal active level.\n- Streak chip: no background or a #EFE5D6 background, text #2F2A26, with a 2px accent underline or left border. It is not a button.\n- Wording stays kind. A streak of 0 is shown as plain \"0\", never in red and never with scolding text.\n\n## Type scale\n\nSystem font stack only (no web fonts, no external requests). Sizes in px:\n- Page title \"Sudoku\": 22px / 28px line, weight 700.\n- Buttons, normal: 16px, weight 600 (page style guide).\n- Buttons in the compact control rows (see Layout 360px): 14px, weight 600, padding 0 8px. Assumption: needed so three labels fit on one row at 360px.\n- Pad digits: 22px, weight 600.\n- Grid digits: 20px.\n- Notes (small candidates): 10px (3x3 inside a cell).\n- Streak chip: 14px, weight 600, label and number on one line.\n- Message line (hints, short notices): 13px / 16px line, up to two lines.\n- Win and prompt text: 16px body, 18px for the time and hints lines, 22px title.\n- Minimum for any readable text: 13px. Notes are the only text smaller.\n\n## Touch sizes\n\n- Every button: at least 44px tall and 44px wide, including .level-btn, #daily, #new-puzzle, #howto-btn, #undo, #notes, #hint, .pad-digit, #erase, #win-new, #continue-btn.\n- Gap between neighbouring buttons: at least 4px.\n- Grid cells stay at their built size (39px at 360px). This is the accepted R-6 limit; nine 44px cells do not fit 360px. Do not shrink them further.\n- #streak is read-only text and needs no tap size. It must not look like a button (no raised fill, no pointer cursor).\n- Use touch-action: manipulation on buttons. Visible focus outline of 2px primary on every button.\n- Respect prefers-reduced-motion: no animation is needed; any change is under 200ms.\n\n## Layout 360px\n\nOne column, rows in this order, all rows as wide as the board, with 1 to 4px side padding so nothing scrolls sideways:\n\n1. Title row (32px): \"Sudoku\" on the left, #streak (\"Day streak\" and the count) on the right. A message (hint text or short notice) uses this same 32px line and replaces the title and streak while it is shown; the title and streak come back when the message clears. Keep messages to about 90 characters so they fit in two lines at 13px. (Assumption about the existing hint wording; Audit checks it.)\n2. Level row (44px): Easy | Medium | Hard, three equal buttons, active level in primary style.\n3. Game row (44px): Daily puzzle (#daily) | New puzzle (#new-puzzle) | How to play (#howto-btn), three equal buttons in the compact style.\n4. Board (#board): 9x9, as built.\n5. Tools row (44px): Undo | Notes | Hint, three equal buttons.\n6. Pad (#pad): 5 columns by 2 rows, digits 1 to 9 and Erase, each at least 44px tall.\n7. Below the first screen: #site-nav, then the footer. They may sit lower than 640px.\n\nOverlays (#howto-panel, #continue-prompt, #win) stay centred cards that fit inside 360px with 16px side margin, with buttons stacked or equal-width.\n\nShared containers: a button may be in a different section's slot than its row mates. Use CSS grid or flex with `order`, or `display: contents` on the slot, in that section's own styles. Do not add wrapper elements to other sections and do not rename ids.\n\n## Layout 1280px\n\n- One centred column, max-width 480px, centred with auto margins; background fills the page. Assumption: a single column keeps the calm look and keeps each section's CSS simple.\n- Same row order as at 360px. Cells may grow up to 48px (board about 440px wide). Buttons keep their 44px minimum height; rows keep the same labels.\n- #streak stays in the title row on the right. #daily stays beside New puzzle and How to play.\n- Page text and cards use the same sizes as at 360px; nothing is stretched across the full 1280px width.\n- No horizontal overflow at 1280px.\n\n## Height budget\n\nTarget: at 360x640, the whole board, the controls and the whole pad are visible without scrolling. Budget in px (Assumption: board height 357px is taken from the built 39px cells and the 2px box lines; Audit measures the real value):\n\n| Part | Height |\n| --- | --- |\n| Title row (title, streak or message) | 32 |\n| Level row | 44 |\n| Game row (Daily puzzle, New puzzle, How to play) | 44 |\n| Board | 357 |\n| Tools row (Undo, Notes, Hint) | 44 |\n| Pad (2 rows of 44 plus a 4px gap) | 92 |\n| Five 4px gaps between these parts | 20 |\n| Body padding, 3px top and bottom | 6 |\n| Total | 639 |\n\nThat leaves 1px spare, so nothing may be added above the pad. If the real board is taller than 357px, cut in this order: (1) gaps from 4px to 2px, (2) body padding to 0, (3) tell Identity, and do not shrink any button below 44px or any cell below 39px.\n\nRules for this budget:\n- The new Daily puzzle button and streak add no row: #daily joins the existing game row and #streak joins the title row.\n- Any new text goes into the title row message line, never into a new row.\n- #site-nav and the footer come after the pad (below 640px).\n\n## Rules for later workflows\n\n- W-29 (copy): keep labels short enough for a 14px button about 112px wide: \"Daily puzzle\", \"New puzzle\", \"How to play\". Streak label \"Day streak\". Keep hint and notice lines under about 90 characters, with no digits in hint text.\n- W-30 (Daily button): add #daily to the game row with classes j2-btn j2-btn-secondary and a 2px accent border. No new row. Keep the three level buttons and #new-puzzle working. At least 44px tall and wide.\n- W-32 (streak): add #streak to the title row on the right, plain text, 14px, label then count, accent underline. It must not push #pad below 640px at 360x640, must not overflow sideways, and must not use red or scolding wording for zero.\n- W-33 and W-34: keep #continue-prompt, #continue-btn and #app-boot ids and tap sizes; no layout change.\n- No section may add external fonts, images, scripts or requests.\n- Audit: check the pad bottom edge is at or above 640px at 360x640, no horizontal overflow at 360px and 1280px, and every button at least 44px (cells excepted, R-6).\n"};
