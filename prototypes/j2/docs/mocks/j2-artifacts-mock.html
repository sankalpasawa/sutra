const all=id=>[id,...(REV[id]||[])];
const isScript=id=>D.sec[id]&&/^0 lines of HTML, 0 CSS rules/.test(D.sec[id][0]);
const doc=w=>w.o.endsWith('.md');
const made=id=>{const w=W[id];return doc(w)?w.o:isScript(id)?'Puzzle engine script':'Website section'};
const cyl=c=>c==5?'change 1':c==6?'change 2':'fix';

const ok=b=>b?'<span class="ok">✓</span>':'<span class="wn">!</span>';
const pf=v=>v===true||v==='PASS'?'<span class="ok">✓</span>':'<span class="wn">!</span>';
function wRow(id){const w=W[id],ids=all(id),items=[...new Set(ids.flatMap(i=>W[i].c))],warn=items.some(i=>AUD[i]&&AUD[i].v!=='PASS');
 return {id,t:w.n.replace(/-/g,' '),s:`${w.pe||'Maker not recorded'} · ${ids.length>1?ids.length+' versions':'1 version'}`,m:ok(!warn),r:`<span class="mono s">${id}</span>`}}

const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(Assumption:)/g,'<span class="as">$1</span>');
function mdHtml(src){const L=src.split('\n');let h='',i=0,hid=0;
 while(i<L.length){let l=L[i];
  if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;h+=`<h${n} id="h${n==2?hid++:'x'}">${inl(l.slice(n+1))}</h${n}>`;i++;continue}
  if(/^\|/.test(l)){const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);const c=r=>r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
   h+='<table><tr>'+c(rows[0]).map(x=>`<th>${inl(x)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+c(r).map(x=>`<td>${inl(x)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
  if(/^\s*([-*]|\d+\.) /.test(l)){const ord=/^\s*\d+\./.test(l);h+=ord?'<ol>':'<ul>';
   while(i<L.length&&/^\s*([-*]|\d+\.) /.test(L[i])){const ind=L[i].match(/^\s*/)[0].length;h+=`<li style="margin-left:${ind*7}px">${inl(L[i].replace(/^\s*([-*]|\d+\.) /,''))}</li>`;i++}h+=ord?'</ol>':'</ul>';continue}
  if(!l.trim()){i++;continue}
  let p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||\s*([-*]|\d+\.) )/.test(L[i]))p.push(L[i++]);h+=`<p>${inl(p.join(' '))}</p>`}
 return h}
const heads=src=>src.split('\n').filter(l=>/^## /.test(l)).map(l=>l.slice(3));
const asms=src=>src.split('\n').filter(l=>/Assumption:/.test(l)).map(l=>l.replace(/^\s*([-*]|\d+\.) /,'').replace(/.*?Assumption:\s*/,'').replace(/`/g,''));
let tab='sum';

let ver='cur';
const TOK=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|<!--[\s\S]*?-->)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|new|true|false|null|try|catch|of|in|typeof|break|continue)\b/g;
function hl(src){const seg=[];let i=0,m;TOK.lastIndex=0;while((m=TOK.exec(src))){seg.push(['',src.slice(i,m.index)]);seg.push([m[1]?'cm':m[2]?'sg':'k',m[0]]);i=TOK.lastIndex}seg.push(['',src.slice(i)]);
 const lines=[''];seg.forEach(([c,s])=>s.split('\n').forEach((p,k)=>{if(k)lines.push('');if(p)lines[lines.length-1]+=c?`<span class="${c}">${esc(p)}</span>`:esc(p)}));
 return lines.map(l=>`<span class="l">${l||' '}</span>`).join('')}
function parts(src){const out=[];const css=[...src.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(m=>m[1].replace(/^\n|\s+$/g,'')).join('\n');
 const js=[...src.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1].replace(/^\n|\s+$/g,'')).join('\n');
 const html=src.replace(/<(style|script)[^>]*>[\s\S]*?<\/\1>/gi,'').replace(/^\s*\n/gm,'').trim();
 if(js)out.push(['JavaScript',js]);if(css)out.push(['CSS',css]);if(html)out.push(['HTML',html]);return out}
const block=(name,src,file)=>`<div class="code"><div class="hd2"><b style="color:var(--fg)">${name}</b>${src.split('\n').length} lines${file?` · <span class="mono">${file}</span>`:''}<span class="sp"></span><a data-copy>Copy</a></div><pre>${hl(src)}</pre></div>`;
const tabsH=(a)=>`<div class="tabs">${a.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>`;
function codePane(id){const src=EX.code[id];const ps=parts(src);return `<p class="s" style="margin:0 0 10px;font-size:12.5px">The code this workflow wrote into <span class="mono">site/index.html</span>, as it is in page v${D.site.v}${(REV[id]||[]).length?`, after ${REV[id].length} rewrite${REV[id].length>1?'s':''} (${REV[id].join(', ')})`:''}. <a>Open full page source</a></p>`+ps.map(p=>block(p[0],p[1])).join('')}
function rzWrap(h){const i=h.indexOf('</div>')+6;return h.slice(0,i)+tabsH([['sum','Summary'],['doc','Read document']])+(tab==='doc'?`<div class="md">${mdHtml(EX.rzmd)}</div>`:h.slice(i))}
function wPane(id){const w0=W[id];if(doc(w0)&&MD[w0.o]){const src=MD[w0.o],a=asms(src),hs=heads(src);const top=`<h2>${esc(w0.n.replace(/-/g,' '))}</h2><div class="by">${esc(w0.pe||'Maker not recorded')} wrote <span class="mono">artifacts/${esc(w0.o)}</span> · ${src.split(/\s+/).length} words · <a>Open raw</a></div><div class="tabs"><button data-tab="sum" class="${tab==='sum'?'on':''}">Summary</button><button data-tab="doc" class="${tab==='doc'?'on':''}">Read document</button></div>`;
 if(tab==='doc'){const bn=w0.o.replace('.md','');const vs=Object.keys(EX.old).filter(k=>k.startsWith(bn+'.v')).sort();const txt=ver==='cur'||!EX.old[ver]?src:EX.old[ver];return top+(vs.length?`<div class="vers"><span class="s" style="font-size:12px;align-self:center">Version</span>${vs.map((k,i)=>`<button data-ver="${k}" class="${ver===k?'on':''}">v${i+1} · ${all(w0.id)[i]}</button>`).join('')}<button data-ver="cur" class="${ver==='cur'||!EX.old[ver]?'on':''}">current · ${all(w0.id).at(-1)}</button></div>`:'')+`<div class="md">${mdHtml(txt)}</div>`}
 return top+(a.length?`<div class="asm"><h5 style="margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)">Assumptions to confirm (${a.length})</h5><p class="s" style="font-size:12.5px;margin:0 0 4px">Not given by the charter. The maker chose these; a person should confirm them.</p><ul class="ckl">${a.map(x=>`<li><span class="wn">!</span>${esc(x)}</li>`).join('')}</ul></div>`:'')+`<div class="blk toc" style="columns:2"><h5>What is inside (${hs.length} sections)</h5>${hs.map((h,i)=>`<a data-jump="h${i}">${esc(h)}</a>`).join('')}</div>`+wBody(w0.id).replace(/^<h2>[\s\S]*?<\/div>/,'')}if(EX.code[id]){const b=wBody(id);const i=b.indexOf('</div>')+6;return b.slice(0,i)+tabsH([['sum','Summary'],['code',isScript(id)?'Script':'Code']])+(tab==='code'?codePane(id):b.slice(i))}return wBody(id)}
function wBody(id){const w=W[id],ids=all(id),items=[...new Set(ids.flatMap(i=>W[i].c))];
 const reuse=isScript(id)?D.w.filter(x=>x.dep.includes('puzzle-engine')):[];
 return `<h2>${esc(w.n.replace(/-/g,' '))}</h2><div class="by">${esc(w.pe||'Maker not recorded')} made <span class="mono">${doc(w)?'artifacts/'+esc(w.o):'site/index.html'}</span>${isScript(id)?' · a script':''} · <span class="mono">${id}</span></div>
 <div class="grid4"><div class="blk"><h5>Goal</h5><p>${esc(w.p)}</p></div><div class="blk"><h5>Method</h5><p>${esc(w.st.split('. ')[0].replace(/\.+$/,''))}.</p></div></div>
 ${reuse.length?`<div class="blk"><h5>Reused by</h5><ul class="ckl">${reuse.map(x=>`<li><span class="mono s">${x.id}</span>${esc(x.n)}</li>`).join('')}</ul></div>`:''}
 <div class="grid4"><div class="blk"><h5>Checked by code</h5><ul class="ckl">${ids.flatMap(i=>W[i].rc.map(r=>`<li>${pf(r[1])}<span>${esc(r[0])}${ids.length>1?` <span class="s mono">${i}</span>`:''}</span></li>`)).join('')}</ul></div>
 <div class="blk"><h5>Checked by the audit</h5>${items.length?`<ul class="ckl">${items.filter(i=>AUD[i]).map(i=>`<li>${pf(AUD[i].v)}<span><b>#${i}</b> ${esc(AUD[i].n)}</span></li>`).join('')}</ul><p class="s" style="margin-top:6px;font-size:12.5px">Screenshot: <span class="mono">site/shots/v33.png</span></p>`:`<p class="s">${doc(w)?'Guides are not audited, only checked by code.':'Covers no done-when item.'}</p>`}</div></div>
 <div class="blk"><h5>Versions</h5><ul class="ckl">${ids.map((i,k)=>`<li><span class="mono s">${i}</span><span>${k?'<b>'+cyl(W[i].cy)+':</b> ':'First version. '}${esc(W[i].p)}</span></li>`).join('')}</ul></div>`}
const last=D.cyc.at(-1);
const G=[
 {k:'plan',t:'Run plan',c:'3 files',sub:'What the run set out to do and how it planned it.',rows:[
   {id:'charter',t:'Charter',s:`Client Lead · ${D.charter.n} done-when items`,m:ok(1),r:'<span class="mono s">goal.json</span>',p:()=>`<h2>Charter</h2><div class="by">Client Lead (Identity) wrote it · <span class="mono">goal.json</span> · <a>Open file</a></div><div class="blk"><h5>Who it is for</h5><p>${esc(D.charter.aud)}</p></div><div class="blk"><h5>Done when (${D.charter.n})</h5><ul class="ckl">${D.dw.map((x,i)=>`<li><span class="mono s">#${i+1}</span>${esc(x)}</li>`).join('')}</ul></div>`},
   {id:'rz',t:'Realization plan',s:`Planner · ${D.stages.length} stages`,m:ok(1),r:'<span class="mono s">realization.json</span>',p:()=>rzWrap(`<h2>Realization plan</h2><div class="by">Planner (Adaptation), scored by the confidence judge · <span class="mono">realization.json</span> · <a>Open file</a> · <a>Text version</a></div><div class="stat"><div><b>${esc(D.zone)}</b><span>certainty zone</span></div><div><b>${D.conf}</b><span>plan confidence</span></div><div><b>${D.stages.length}</b><span>stages</span></div></div><div class="blk"><h5>Stages</h5><ul class="ckl">${D.stages.map((s,i)=>`<li><span class="mono s">${i+1}</span>${s}</li>`).join('')}</ul></div>`)},
   {id:'wf',t:'Workflows',s:`Gatekeeper · ${D.w.length} workflows`,m:ok(1),r:'<span class="mono s">workflows.json</span>',p:()=>`<h2>Workflows</h2><div class="by">Checked by the Gatekeeper (code) · <span class="mono">workflows.json</span> · <a>Open file</a></div><div class="stat"><div><b>${D.w.length}</b><span>workflows</span></div><div><b>${D.bycy.length}</b><span>cycles</span></div></div><div class="blk"><h5>Workflows per cycle</h5><ul class="ckl">${D.bycy.map(([c,n])=>`<li><span class="mono s">cycle ${c}</span>${n} workflow${n>1?'s':''}${c==1?' · first build':c==5?' · change 1':c==6?' · change 2':' · fix after audit'}</li>`).join('')}</ul></div>`}]},
 {k:'guides',t:'Guides the makers read',c:`5 guides · ${STAGES[0][1].reduce((a,i)=>a+all(i).length,0)} versions`,sub:'Each guide, who wrote it, and how it was checked.',rows:STAGES[0][1].map(id=>({...wRow(id),p:()=>wPane(id)}))},
 {k:'site',t:'Website sections',c:`${STAGES[1][1].length} sections · 1 script`,sub:`Website v${D.site.v}: the latest audit passes ${last[2]} of ${last[3]} items.`,rows:[...STAGES[1][1].map(id=>({...wRow(id),p:()=>wPane(id)})),{id:'style',t:'Style guide',s:'Web Developer · colours, fonts, spacing',m:ok(1),r:'<span class="mono s">style.json</span>',p:()=>`<h2>Style guide</h2><div class="by">Web Developer made it in W-5 · <span class="mono">style.json</span> · read by ${D.style_rb} workflows</div>`+parts(EX.code.style).map(p=>block(p[0],p[1])).join('')}]},
 {k:'rec',t:'Run records',c:'15 files',sub:'The raw files behind the other views.',rows:[
   {id:'rc',t:'Check results',s:`${D.rcn[0]} entries`,m:'',r:'<span class="mono s">receipts.jsonl</span>',p:()=>`<h2>Check results</h2><div class="by">Written by the Checker (code) · <span class="mono">receipts.jsonl</span> · <a>Open file</a></div><div class="stat"><div><b>${D.rcn[0]}</b><span>checks run</span></div><div><b>${D.rcn[0]-D.rcn[1]}</b><span>passed</span></div><div><b>${D.rcn[1]}</b><span>failed, then retried or fixed</span></div></div><p class="s">Each check also appears under the guide or section it checked.</p>`},
   {id:'au',t:'Audits',s:`${D.cyc.length} audits`,m:'',r:'<span class="mono s">audits.json</span>',p:()=>`<h2>Audits</h2><div class="by">Quality check · <span class="mono">audits.json</span> · <a>Open file</a></div><div class="blk"><h5>Items passing per audit</h5><div class="bars">${D.cyc.map(c=>`<div class="bar"><span style="height:${c[2]/c[3]*100}%"></span></div>`).join('')}</div><div class="bl">${D.cyc.map(c=>`<div>page v${c[1]}<br><b>${c[2]}/${c[3]}</b></div>`).join('')}</div></div><p class="s">Item-by-item results appear under the section each one verifies.</p>`},
   {id:'co',t:'Necessary conditions',s:`${D.cond.length} items`,m:'',r:'<span class="mono s">conditions.json</span>',p:()=>`<h2>Necessary conditions</h2><div class="by">Checked by code · <span class="mono">conditions.json</span> · <a>Open file</a></div><ul class="ckl">${D.cond.map(c=>`<li>${pf(c[2])}<span class="mono s">${c[0]}</span>${esc(c[1])}</li>`).join('')}</ul>`},
   {id:'sh',t:'Audit screenshots',s:'6 images',m:'',r:'<span class="mono s">site/shots/</span>',p:()=>`<h2>Audit screenshots</h2><div class="by">Taken by the quality check, one per audit · <span class="mono">site/shots/</span></div><div class="shots">${D.cyc.filter((c,i,a)=>a.findIndex(x=>x[1]===c[1])===i).map(c=>`<div><span class="mono">v${c[1]}.png · ${c[2]}/${c[3]}</span></div>`).join('')}</div>`}]}];
let cur='plan',sel={};
function show(){const g=G.find(x=>x.k===cur);sel[cur]=sel[cur]||g.rows[0].id;const r=g.rows.find(x=>x.id===sel[cur]);
 document.getElementById('nav').innerHTML=`<div class="nv"><b>Preview</b><span>v${D.site.v}</span></div><div class="nv dim"><b>Documents</b><span>this run made no documents</span></div><div class="nh">Artifacts</div>`+G.map(x=>`<div class="nv ${x.k===cur?'on':''}" data-g="${x.k}"><b>${x.t}</b><span>${x.c}</span></div>`).join('');
 document.getElementById('ttl').textContent=g.t;document.getElementById('crumb').textContent=g.t;document.getElementById('cnt').textContent=g.c;document.getElementById('sub').textContent=g.sub;
 document.getElementById('root').innerHTML=`<div class="two"><div class="list">${g.rows.map(x=>`<div class="row ${x.id===r.id?'on':''}" data-r="${x.id}"><span class="t"><b>${esc(x.t)}</b><span>${x.s}</span></span>${x.m}${x.r}</div>`).join('')}</div><div class="pane">${r.p()}</div></div>`}
document.addEventListener('click',e=>{const vb=e.target.closest('[data-ver]');if(vb){ver=vb.dataset.ver;show();return}const cp=e.target.closest('[data-copy]');if(cp){const pre=cp.closest('.code').querySelector('pre');navigator.clipboard&&navigator.clipboard.writeText(pre.innerText).catch(()=>{});cp.textContent='Copied';return}const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;show();return}const jp=e.target.closest('[data-jump]');if(jp){tab='doc';show();const el=document.getElementById(jp.dataset.jump);el&&el.scrollIntoView();return}const n=e.target.closest('[data-g]');if(n){cur=n.dataset.g;show();return}const r=e.target.closest('[data-r]');if(r){sel[cur]=r.dataset.r;tab='sum';ver='cur';show()}});
show();
document.getElementById('th').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark'};
</script></body></html>
