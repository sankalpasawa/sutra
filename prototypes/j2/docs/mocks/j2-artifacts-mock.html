<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J2 Artifacts Simple</title>
<style>
:root,[data-theme=light]{--bg:#f4efe7;--panel:#fbf8f3;--card:#fffdf9;--soft:#f1ebe2;--line:#e4dccf;--fg:#2a2520;--muted:#7a6f63;--link:#4a3fb0;--ok:#3f7a3c;--warn:#a87a12;--bad:#b4473a}
[data-theme=dark]{--bg:#151311;--panel:#1c1a17;--card:#221f1b;--soft:#2b2723;--line:#3a342d;--fg:#f6eee3;--muted:#a4998b;--link:#a99cf5;--ok:#8fc289;--warn:#e0b85a;--bad:#e5857a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;display:flex}
.rail{width:76px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0}
.rail i{width:38px;height:38px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.rail i.on{box-shadow:0 0 0 2px #a8673a}
.fly{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 8px}.fh{padding:0 10px 12px}.fh b{display:block;font:600 20px Georgia,serif}.nv{display:block;padding:9px 12px;border-radius:9px;cursor:pointer}.nv:hover{background:var(--soft)}.nv.on{background:var(--soft);box-shadow:inset 3px 0 0 #a8673a}.nv b{font-weight:600;display:block}.nv span{font-size:12.5px;color:var(--muted)}.nv.dim b{color:var(--muted)}.nh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 12px 4px}
.two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;height:100%}
.two .list{overflow:auto;align-self:start;max-height:100%}
.row{grid-template-columns:1fr auto auto!important}.row.on{background:var(--soft);box-shadow:inset 3px 0 0 #a8673a}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;overflow:auto;min-height:0}
.pane h2{font:600 20px Georgia,serif;margin:0 0 2px}.pane .by{color:var(--muted);font-size:13px;margin-bottom:16px}
.blk{margin-bottom:16px}.blk h5{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0}.ckl{margin:0;padding:0;list-style:none}.ckl li{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.shots div{aspect-ratio:16/10;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--soft) 0 8px,var(--card) 8px 16px);display:flex;align-items:flex-end;padding:6px;font-size:12px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bar{flex:1;background:var(--soft);border-radius:5px 5px 0 0;height:100%;display:flex;align-items:flex-end}.bar span{width:100%;background:var(--ok);opacity:.7;border-radius:5px 5px 0 0}
.bl{display:flex;gap:8px}.bl div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.stat{display:flex;gap:28px;margin-bottom:16px}.stat div b{display:block;font:600 24px Georgia,serif}.stat div span{font-size:12.5px;color:var(--muted)}
@media(max-width:900px){.two{grid-template-columns:1fr;height:auto}.grid4{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}.tabs button{border:0;background:none;font:inherit;font-size:13px;padding:7px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tabs button.on{color:var(--fg);border-color:#a8673a;font-weight:600}
.asm{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:10px;padding:10px 12px;margin-bottom:16px}.asm li{border-color:color-mix(in srgb,var(--warn) 30%,var(--line))!important}
.toc a{display:block;padding:3px 0;font-size:13px}
.md{max-width:76ch;font-size:14px;line-height:1.6}.md h1{font:600 20px Georgia,serif;margin:0 0 8px}.md h2{font:600 16px Georgia,serif;margin:22px 0 6px;padding-top:6px;border-top:1px solid var(--line)}.md h3{font-size:14px;margin:14px 0 4px}
.md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px;padding-left:20px}.md li{margin:3px 0}.md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);padding:1px 4px;border-radius:4px}
.md table{border-collapse:collapse;font-size:12.5px;margin:6px 0 12px;width:100%}.md th,.md td{border:1px solid var(--line);padding:4px 7px;text-align:left}.md th{background:var(--soft)}
.md .as{background:color-mix(in srgb,var(--warn) 18%,transparent);border-radius:3px;padding:0 2px}
.code{background:var(--soft);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:none;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:14px}
.code .hd2{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:12px;color:var(--muted)}
.code pre{margin:0;padding:8px 0;counter-reset:ln}.code pre span.l{display:block;padding:0 12px 0 52px;position:relative;white-space:pre}
.code pre span.l::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:38px;text-align:right;color:var(--muted);opacity:.6}
.k{color:#8a3fa8}.sg{color:#3f7a3c}.cm{color:var(--muted);font-style:italic}[data-theme=dark] .k{color:#d29cf0}[data-theme=dark] .sg{color:#9fd49a}
.vers{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.vers button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;color:var(--fg);cursor:pointer}.vers button.on{border-color:#a8673a;background:var(--soft);font-weight:600}
.hd{padding:14px 20px 12px!important;align-items:center!important}
.crumb{font-size:12px;color:var(--muted);margin-bottom:2px}.crumb span{opacity:.5;margin:0 3px}.crumb b{color:var(--fg);font-weight:500}
.tl{display:flex;align-items:baseline;gap:10px}.hd h1{font:600 20px Georgia,serif!important;margin:0!important}
.cnt{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.hd p{margin-top:3px!important;font-size:13px!important}
.ic{width:34px;height:34px;padding:0!important;display:grid;place-items:center}
.page{flex:1;min-width:0;padding:16px 18px;display:flex}
.box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:10px}
.hd h1{font:600 22px Georgia,serif;margin:2px 0}.hd p{margin:0;color:var(--muted);font-size:13.5px}
a{color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sp{flex:1}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:nowrap}.s{color:var(--muted)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:99px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.scroll{flex:1;overflow:hidden;padding:16px 20px;min-height:0}.in{height:100%}
.gl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 0 6px}.gl:first-child{margin-top:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:16px 1fr auto 18px;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row:hover{background:var(--soft)}
.row .t b{font-weight:600}.row .t span{display:block;font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:11px;transition:transform .15s}.it.open .chev{transform:rotate(90deg)}
.ok{color:var(--ok);font-weight:700}.wn{color:var(--warn);font-weight:700}
.det{display:none;padding:4px 14px 14px 40px;font-size:13.5px}.it.open .det{display:block}
.det dl{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;margin:0}
.det dt{color:var(--muted);font-size:12.5px;padding-top:1px}.det dd{margin:0}
.more{margin-top:10px;font-size:12.5px}.more summary{cursor:pointer;color:var(--link)}
.more ul{margin:6px 0 0;padding-left:18px}.more li{margin:2px 0}
.ev{display:flex;gap:10px;align-items:center;margin-top:4px}
.shot{width:52px;height:36px;flex:none;border-radius:6px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--card) 6px 12px);font-size:10px;color:var(--muted);display:grid;place-items:center}
.foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
@media(max-width:640px){body{flex-direction:column;overflow:auto}.fly{width:auto;border-right:0;border-bottom:1px solid var(--line)}.fly .sp,.fly>a{display:none}.page{min-height:80vh}.rail{display:none}.page{padding:8px}.det{padding-left:14px}.det dl{grid-template-columns:1fr}}

const EX={"code": {"style": "<style>:root{--j2-primary:#2F6F6A;--j2-secondary:#EFE5D6;--j2-accent:#C98A1B;--j2-background:#FBF6EE;--j2-surface:#FFFDF9;--j2-text:#2F2A26;--j2-muted:#6B6159;--j2-font-heading:system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;--j2-font-body:system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background: #2F6F6A; color: #FFFFFF; border: 0; min-height: 44px; padding: 0 16px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; touch-action: manipulation}.j2-btn-secondary{display:inline-block;background: #EFE5D6; color: #2F2A26; border: 1px solid #D9CFC2; min-height: 44px; padding: 0 16px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; touch-action: manipulation}.j2-card{background: #FFFDF9; color: #2F2A26; border: 1px solid #D9CFC2; border-radius: 12px; padding: 16px}<\/style>", "W-5": "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sudoku<\/title>\n<style>\n:root{--bg:#FBF6EE;--surface:#FFFDF9;--text:#2F2A26;--muted:#6B6159;--accent:#2F6F6A;--accent-text:#FFFFFF;--btn:#EFE5D6;--btn-press:#E3D5C0;--line:#D9CFC2;--box-line:#5B514A;--selected:#CFE6E2;--peer:#F1E8DA;--same:#F6DDB0;--conflict-bg:#FBE3DE;--conflict:#B3402F;--hint:#C98A1B;--hint-bg:#FFF4C9;--focus:#1D4E89;--overlay:rgba(47,42,38,0.45)}\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:16px;line-height:24px}\nbutton{font-family:inherit;touch-action:manipulation}\nbutton:focus-visible,a:focus-visible,#board:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n<\/style><style>\n.w5-skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--surface);color:var(--text);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;text-decoration:underline}\n.w5-skip:focus{top:8px}\n.w5-header{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:500px;width:100%;margin:0 auto;padding:6px 10px 0}\n.w5-header h1{margin:0;font-size:24px;line-height:28px;font-weight:700;color:var(--text)}\n.w5-header .j2-btn{min-height:44px;flex:0 0 auto}\n#site-nav{display:flex;flex-wrap:wrap;gap:6px;max-width:500px;width:100%;margin:0 auto;padding:6px 10px 0}\n#site-nav a{flex:1 1 0;min-width:96px;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:0 12px}\n#app{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:500px;width:100%;margin:0 auto;padding:6px 10px}\n#app>*{grid-column:1/-1;min-width:0}\n#app>.slot-levels{order:1}\n#app>#board{order:2}\n#app>#message{order:3}\n#app>#undo,#app>#notes,#app>#hint{order:4;grid-column:auto}\n#app>#pad{order:5}\n#app>.slot-info{order:6}\n#board{width:100vw;width:clamp(300px,calc(100vh - 344px),480px);width:clamp(300px,calc(100svh - 344px),480px);max-width:100%;aspect-ratio:1;justify-self:center;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));background:var(--surface);border:2px solid var(--box-line);border-radius:4px;overflow:hidden}\n#message{height:34px;overflow:hidden;text-align:center;color:var(--muted);font-size:14px;line-height:17px}\n#pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}\n.w5-foot{max-width:500px;margin:0 auto;padding:0 10px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:20px}\n@media (min-width:960px){\n.w5-header,#site-nav,#app,.w5-foot{max-width:560px}\n.w5-header h1{font-size:32px;line-height:36px}\n#message{font-size:16px;line-height:24px;height:34px}\n}\n<\/style>\n<a class=\"w5-skip\" href=\"#board\">Go to the puzzle<\/a>\n<header class=\"w5-header\">\n<h1>Sudoku<\/h1>\n<button type=\"button\" class=\"j2-btn\" id=\"w5-start\" aria-label=\"Start playing and go to the puzzle\">Start playing<\/button>\n<\/header>\n<nav id=\"site-nav\" aria-label=\"Page sections\">\n<a class=\"j2-btn j2-btn-secondary\" href=\"#board\">Puzzle<\/a>\n<a class=\"j2-btn j2-btn-secondary\" href=\"#pad\">Number pad<\/a>\n<a class=\"j2-btn j2-btn-secondary\" href=\"#w5-start\">Start<\/a>\n<\/nav>\n<main id=\"app\">\n<div id=\"board\" tabindex=\"-1\" role=\"grid\" aria-label=\"Sudoku grid\"><\/div>\n<div id=\"message\" role=\"status\" aria-live=\"polite\"><\/div>\n<div id=\"pad\" aria-label=\"Number buttons\"><\/div>\n<\/main>\n<p class=\"w5-foot\">No sign-up. No ads.<\/p>\n<script>\nvar SD = window.SD = window.SD || {};\nSD.h = SD.h || {};\nSD.on = SD.on || function (e, f) { (SD.h[e] = SD.h[e] || []).push(f); };\nSD.emit = SD.emit || function (e, d) { (SD.h[e] || []).forEach(function (f) { f(d); }); };\nSD.say = SD.say || function (t) { var m = document.getElementById('message'); if (m) m.textContent = t || ''; };\n(function () {\n  function adopt() {\n    var app = document.getElementById('app');\n    if (!app) return;\n    var list = document.querySelectorAll('.slot, #undo, #notes, #hint, #continue-prompt, #win');\n    for (var i = 0; i < list.length; i++) {\n      if (!app.contains(list[i])) app.appendChild(list[i]);\n    }\n  }\n  document.addEventListener('DOMContentLoaded', adopt);\n  window.addEventListener('load', adopt);\n  var start = document.getElementById('w5-start');\n  if (start) {\n    start.addEventListener('click', function () {\n      var b = document.getElementById('board');\n      if (!b) return;\n      if (b.scrollIntoView) b.scrollIntoView({ block: 'center' });\n      if (b.focus) b.focus();\n    });\n  }\n})();\n<\/script>", "W-6": "<script id=\"engine-script\">\nvar SD = window.SD = window.SD || {};\nS XT = {\n    cellOnly: 'Look at the marked cell. Its row, its column and its box already hold most of the numbers, so a sole candidate is left for it. Which number is missing from all of those neighbours?',\n    placeOnly: 'Look at the marked cell and the {unit} it sits in. A number that this {unit} still needs has nowhere else to go except this cell. Try each missing number and see which has no other place to go.',\n    fewest: 'No clear next step stands out right now. The marked cell has the fewest possibilities left, so it is a good place to look. Check what its row, column and box already hold, and try Notes to jot the candidates down.',\n    repeatsFirst: 'Some numbers repeat in a row, column or box. Sort out the marked repeats before asking for a hint.',\n    gridFull: 'Every cell is filled, so there is nothing to point at.'\n  };\n\n  // Units: 9 rows, 9 columns, 9 boxes, each a list of cell indexes.\n  var units = [];\n  (function () {\n    var r, c, k, u;\n    for (r = 0; r < 9; r++) { u = []; for (c = 0; c < 9; c++) u.push(r * 9 + c); units.push({ name: 'row', cells: u }); }\n    for (c = 0; c < 9; c++) { u = []; for (r = 0; r < 9; r++) u.push(r * 9 + c); units.push({ name: 'column', cells: u }); }\n    for (k = 0; k < 9; k++) {\n      u = [];\n      var br = Math.floor(k / 3) * 3, bc = (k % 3) * 3;\n      for (r = 0; r < 3; r++) for (c = 0; c < 3; c++) u.push((br + r) * 9 + bc + c);\n      units.push({ name: 'box', cells: u });\n    }\n  })();\n\n  function bitCount(m) { var n = 0; while (m) { n += m & 1; m >>= 1; } return n; }\n\n  function hasRepeat(vals) {\n    for (var u = 0; u < units.length; u++) {\n      var seen = 0, cells = units[u].cells;\n      for (var j = 0; j < 9; j++) {\n        var v = vals[cells[j]];\n        if (!v) continue;\n        var b = 1 << (v - 1);\n        if (seen & b) return true;\n        seen |= b;\n      }\n    }\n    return false;\n  }\n\n  // Candidate masks built only from the digits currently on the board.\n  function candidates(vals) {\n    var used = [], i, u, j;\n    for (i = 0; i < 81; i++) used.push(0);\n    for (u = 0; u < units.length; u++) {\n      var cells = units[u].cells, mask = 0;\n      for (j = 0; j < 9; j++) if (vals[cells[j]]) mask |= 1 << (vals[cells[j]] - 1);\n      for (j = 0; j < 9; j++) used[cells[j]] |= mask;\n    }\n    var cand = [];\n    for (i = 0; i < 81; i++) cand.push(vals[i] ? 0 : (511 & ~used[i]));\n    return cand;\n  }\n\n  SD.findHint = function () {\n    var st = SD.state;\n    if (!st || !st.values || st.values.length !== 81) return { cell: -1, key: null };\n    var vals = st.values, i, empty = 0;\n    for (i = 0; i < 81; i++) if (!vals[i]) empty++;\n    if (!empty) return { cell: -1, key: 'gridFull' };\n    if (hasRepeat(vals)) return { cell: -1, key: 'repeatsFirst' };\n\n    var cand = candidates(vals);\n\n    // 1. Naked single: an empty cell with exactly one candidate.\n    for (i = 0; i < 81; i++) {\n      if (!vals[i] && bitCount(cand[i]) === 1) return { cell: i, key: 'cellOnly' };\n    }\n\n    // 2. Hidden single: a missing number that fits only one cell in a unit.\n    for (var u = 0; u < units.length; u++) {\n      var cells = units[u].cells;\n      for (var d = 0; d < 9; d++) {\n        var bit = 1 << d, present = false, spots = [], j;\n        for (j = 0; j < 9; j++) {\n          if (vals[cells[j]] === d + 1) { present = true; break; }\n          if (!vals[cells[j]] && (cand[cells[j]] & bit)) spots.push(cells[j]);\n        }\n        if (!present && spots.length === 1) return { cell: spots[0], key: 'placeOnly', unit: units[u].name };\n      }\n    }\n\n    // 3. Fallback: the empty cell with the fewest possibilities.\n    var best = -1, bestN = 99, n;\n    for (i = 0; i < 81; i++) {\n      if (vals[i]) continue;\n      n = bitCount(cand[i]);\n      if (n > 0 && n < bestN) { bestN = n; best = i; }\n    }\n    if (best < 0) {\n      for (i = 0; i < 81; i++) if (!vals[i]) { best = i; break; }\n    }\n    return { cell: best, key: 'fewes ls you the right answer.<\/li>\n        <li>Stuck? Tap Hint. It marks a cell to look at and explains why in words. It never gives you the number.<\/li>\n        <li>Made a slip? Tap Undo to take back your last move.<\/li>\n        <li>Choose Easy, Medium or Hard for a new puzzle. Daily puzzle gives a puzzle picked from today's date, and the Day streak counts the days in a row you finish it.<\/li>\n        <li>Your game is saved in this browser, so you can carry on later.<\/li>\n      <\/ul>\n      <button type=\"button\" id=\"howto-close\" class=\"j2-btn w14-close\" aria-label=\"Close how to play\">Close<\/button>\n    <\/div>\n  <\/div>\n  <style>\n    /* The slot adds no box of its own: its button joins the Game row of the parent container. */\n    #w14-slot { display: contents; }\n    /* Order places the button after Daily puzzle and New puzzle. Adjust --w14-order only if the Game row uses a different order scale. */\n    #w14-slot #howto-btn { order: var(--w14-order, 3); flex: 1 1 0; min-width: 44px; min-height: 44px; margin: 0; padding: 0 8px; box-sizing: border-box; max-width: 100%; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; }\n    #w14-slot #howto-btn:focus-visible,\n    #w14-slot #howto-close:focus-visible { outline: 2px solid var(--j2-primary, #2F6F6A); outline-offset: 2px; }\n    #w14-slot #howto-panel { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(47, 42, 38, 0.45); font-family: var(--j2-font-body, system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif); }\n    #w14-slot #howto-panel[hidden] { display: none; }\n    #w14-slot .w14-card { width: 100%; max-width: 340px; max-height: 80vh; max-height: 80svh; overflow-y: auto; box-sizing: border-box; background: var(--j2-surface, #FFFDF9); color: var(--j2-text, #2F2A26); border-radius: var(--j2-radius, 12px); }\    var save = findSave();\n      if (save) {\n        restored = true;\n        // Saved game exists: never call SD.newGame here (it would clear dailyDate).\n        if (!populated() && SD.state) {\n          ['v', 'level', 'puzzle', 'values', 'notes'].forEach(function (k) {\n            if (save[k] !== undefined) SD.state[k] = save[k];\n          });\n          SD.state.elapsedMs = okNum(save.elapsedMs, false) ? save.elapsedMs : 0;\n          SD.state.hintsUsed = okNum(save.hintsUsed, true) ? save.hintsUsed : 0;\n          SD.state.dailyDate = (typeof save.dailyDate === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(save.dailyDate)) ? save.dailyDate : null;\n          if (typeof SD.render === 'function') SD.render();\n        }\n        if (!document.getElementById('continue-prompt') && typeof SD.showContinue === 'function') {\n          SD.showContinue();\n        }\n      } else if (!populated() && typeof SD.newGame === 'function') {\n        SD.newGame('easy');\n      }\n    } catch (e) {}\n    // Optional daily and streak code: run only if it exists, never throw.\n    try { if (typeof SD.refreshStreak === 'function') SD.refreshStreak(); } catch (e) {}\n    try { if (typeof SD.updateStreakDisplay === 'function') SD.updateStreakDisplay(); } catch (e) {}\n    try { SD.emit('booted', { restored: restored }); } catch (e) {}\n    try { fixLinks(); } catch (e) {}\n  }\n\n  SD.boot = boot;\n\n  // Run after every section script, including ones appended after this one.\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', boot);\n  } else {\n    setTimeout(boot, 0);\n  }\n})();\n<\/script>", "W-32": "<!-- W-32 daily-streak -->\n<style>\n#streak{position:static;display:block;width:fit-content;max-width:100%;box-sizing:border-box;margin:2px auto;padding:0 2px;font-family:var(--j2-font-body,system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif);font-size:14px;line-height:18px;font-weight:600;text-align:center;color:var(--j2-text,#2F2A26);background:transparent;border-bottom:2px solid var(--j2-accent,#C98A1B);cursor:default;white-space:nowrap;-webkit-user-select:none;user-select:none}\n#streak .w32-count{font-variant-numeric:tabular-nums}\n<\/style>\n<div id=\"streak\" role=\"status\" aria-live=\"polite\" title=\"Days in a row you have completed the daily puzzle. Your streak is kept in this browser.\"><span class=\"w32-label\">Day streak<\/span><span class=\"w32-sep\">:<\/span> <span class=\"w32-count\">0<\/span><\/div>\n<script id=\"w32-script\">\nvar STREAK_LABEL = 'Day streak';\n\nfunction dayNumber(key) {\n  try {\n    if (typeof key !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(key)) return null;\n    var y = +key.slice(0, 4), m = +key.slice(5, 7), d = +key.slice(8, 10);\n    var t = Date.UTC(y, m - 1, d);\n    if (isNaN(t)) return null;\n    var dt = new Date(t);\n    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;\n    return Math.round(t / 86400000);\n  } catch (e) { return null; }\n}\n\nfunction applyDailyWin(record, puzzleDate, todayKey) {\n  var rec = (record && typeof record === 'object') ? record : { v: 1, count: 0, last: null };\n  try {\n    var p = dayNumber(puzzleDate), t = dayNumber(todayKey);\n    if (p === null || t === null) return rec;\n    if (puzzleDate !== todayKey) return rec;\n    if (rec.last === puzzleDate) return rec;\n    var count;\n    if (rec.last === null || rec.last === undefined) {\n      count = 1;\n    } else {\n      var l = dayNumber(rec.last);\n      if (l === null) return rec;\n      var gap = p - l;\n      if (gap === 1) count = Math.min(99999, (rec.count | 0) + 1);\n      else if (gap > 1) count = 1;\n      else return rec;\n    }\n    return { v: 1, count: count, last: puzzleDate };\n  } catch (e) { return rec; }\n}\n\n(function () {\n  var KEY = 'sudoku-streak-v1';\n  var EMPTY = function () { return { v: 1, count: 0, last: null }; };\n  var mem = EMPTY();\n  var counted = false;\n\n  function sd() { return window.SD || null; }\n\n  function localKey() {\n    var d = new Date();\n    var m = d.getMonth() + 1, day = d.getDate();\n    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;\n  }\n  function todayKey() {\n    try {\n      var s = sd();\n      var f = (typeof window.dateKey === 'function') ? window.dateKey : (s && typeof s.dateKey === 'function' ? s.dateKey : null);\n      if (f) { var k = f(); if (dayNumber(k) !== null) return k; }\n    } catch (e) {}\n    return localKey();\n  }\n\n  function readRecord() {\n    try {\n      var raw = window.localStorage.getItem(KEY);\n      if (!raw) return null;\n      var r = JSON.parse(raw);\n      if (!r || r.v !== 1) return EMPTY();\n      if (typeof r.count !== 'number' || r.count % 1 !== 0 || r.count < 0 || r.count > 99999) return EMPTY();\n      if (r.last !== null && dayNumber(r.last) === null) return EMPTY();\n      return { v: 1, count: r.count, last: r.last };\n    } catch (e) { return null; }\n  }\n  function writeRecord(r) {\n    try { window.localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {}\n  }\n\n  function shownCount() {\n    var r = mem;\n    if (!r.last || !r.count) return 0;\n    var a = dayNumber(todayKey()), b = dayNumber(r.last);\n    if (a === null || b === null) return r.count;\n    return (a - b > 1) ? 0 : r.count;\n  }\n\n  function render() {\n    var el = document.getElementById('streak');\n    if (!el) return;\n    var c = el.querySelector('.w32-count');\n    if (c) c.textContent = String(shownCount());\n  }\n\n  function persist() {\n    try {\n      var s = sd();\n      if (!s) return;\n      if (typeof s.save === 'function') s.save();\n      else if (typeof s.saveGame === 'function') s.saveGame();\n      else if (typeof s.emit === 'function') s.emit('change');\n    } catch (e) {}\n  }\n\n  function setDaily(val) {\n    try {\n      var s = sd();\n      if (s && s.state) s.state.dailyDate = val;\n    } catch (e) {}\n  }\n\n  function isOpen(win) {\n    if (!win || win.hidden || win.hasAttribute('hidden')) return false;\n    try {\n      var cs = window.getComputedStyle(win);\n      return cs.display !== 'none' && cs.visibility !== 'hidden';\n    } catch (e) { return false; }\n  }\n\n  function onWin() {\n    try {\n      var s = sd();\n      var d = s && s.state ? s.state.dailyDate : null;\n      if (typeof d !== 'string' || dayNumber(d) === null) return;\n      var next = applyDailyWin(mem, d, todayKey());\n      if (next !== mem) {\n        mem = next;\n        writeRecord(mem);\n      }\n      render();\n    } catch (e) {}\n  }\n\n  function check() {\n    try {\n      var win = document.getElementById('win');\n      if (!win) return;\n      var open = isOpen(win);\n      if (open && !counted) { counted = true; onWin(); }\n      else if (!open) { counted = false; }\n    } catch (e) {}\n  }\n\n  function init() {\n    var stored = readRecord();\n    if (stored) mem = stored;\n\n    var el = document.getElementById('streak');\n    var hdr = document.querySelector('.w5-header');\n    if (el && hdr && hdr.parentNode && hdr.nextSibling !== el) {\n      hdr.parentNode.insertBefore(el, hdr.nextSibling);\n    }\n    render();\n\n    document.addEventListener('click', function (e) {\n      var t = e.target && e.target.closest ? e.target : null;\n      if (!t) return;\n      if (t.closest('#daily')) {\n        setDaily(todayKey());\n        persist();\n        setTimeout(function () {\n          var s = sd();\n          if (s && s.state && !s.state.dailyDate) { setDaily(todayKey()); persist(); }\n        }, 0);\n      } else if (t.closest('.level-btn') || t.closest('#new-puzzle')) {\n        setDaily(null);\n      }\n    });\n\n    var win = document.getElementById('win');\n    if (win && window.MutationObserver) {\n      try {\n        new MutationObserver(check).observe(win, { attributes: true, attributeFilter: ['hidden', 'class', 'style', 'aria-hidden', 'open'] });\n      } catch (e) {}\n    }\n    setInterval(check, 700);\n\n    document.addEventListener('visibilitychange', function () {\n      if (!document.hidden) render();\n    });\n    window.addEventListener('focus', render);\n    window.addEventListener('storage', function (e) {\n      if (e.key === KEY) {\n        var r = readRecord();\n        if (r) { mem = r; render(); }\n      }\n    });\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\n  else init();\n})();\n<\/script>"}, "old": {"product-plan.v1.md": "# Sudoku product plan\n\nReference for every later workflow. It follows the charter. Anything the charter does not state is marked **(assumption)**.\n\n## Scope\n\n**What we are building:** A friendly, uncluttered, single-file Sudoku web game for casual players who want a quick game on their phone, with several difficulty levels and beginner help that never reveals answers, designed so people enjoy it and come back.\n\n**Audience:** Casual players who play quick games on their phones, such as on a commute, including beginners.\n\n**Form:** Plain HTML, CSS and JavaScript in one file, no build step. CDN libraries are allowed but not needed **(assumption: none planned)**. The page is phone-first, with a warm, calm look, plenty of space and readable text.\n\n**Out of scope (assumption):** accounts, leaderboards, ads, tracking, sharing, sound, multiplayer, and any claim about players or the game.\n\n### Priority list\n\nAll 15 done-when items must pass Audit before the site counts as finished. Must/Should/Could only sets build and fix order if budget or cycles run short. It does not remove an item. Dropping one is the Requester's decision, asked by Identity.\n\n**Must**\n\n| Item | Requirement | Acceptance |\n|---|---|---|\n| 1 | 9x9 grid with marked 3x3 boxes; fixed givens; selectable, fillable empty cells | The page shows 81 cells with visible box borders, tapping an empty cell selects it, and givens cannot be changed. |\n| 2 | Number buttons 1 to 9 and an erase button | Tapping a digit enters it in the selected empty cell, tapping Erase clears it, and all ten buttons are at least 44px. |\n| 3 | Easy, Medium and Hard choice | Choosing a level starts a new puzzle of that level, and the first visit starts on Easy. |\n| 4 | Exactly one solution per puzzle, checked by the page's own code | The page's own code counts solutions for each generated puzzle and accepts it only when the count is exactly one. |\n| 13 | No sign-up, login, ads or ad scripts | The page has no form, login, advertising content, ad script or external tracker. |\n| 14 | Fits 360px phone and 1280px desktop | At 360px the whole grid and number buttons are visible with no sideways scrolling, and at 1280px the layout is centred and correct. |\n| 15 | No JavaScript errors, no overflow, no broken in-page link | The page loads and plays with no console errors, no horizontal overflow at 360px and 1280px, and every in-page link points to an existing section. |\n\n**Should**\n\n| Item | Requirement | Acceptance |\n|---|---|---|\n| 5 | Notes mode | In notes mode a digit toggles a small candidate mark in an empty cell and never sets the cell's value. |\n| 6 | Undo | Undo reverses the last digit, erase or note move, and does nothing when there is no history. |\n| 7 | Highlight row, column, box and same numbers | Selecting a cell highlights its 20 peers and every other cell holding the same number. |\n| 8 | Mark repeats without showing the answer | A number repeated in its row, column or box is marked, using only the values on the board and never the solution. |\n| 9 | Hint that points and explains in words | The hint button marks one cell where a next step is possible and explains the reasoning in words, with no digit placed or shown. |\n| 11 | Save and continue | The current game is saved in the browser, and on return the page offers Continue or New puzzle. |\n\n**Could**\n\n| Item | Requirement | Acceptance |\n|---|---|---|\n| 10 | How-to-play explanation | A short explanation is closed on load, opens from a button and closes again. |\n| 12 | Win message | Completing the grid correctly shows a friendly congratulation with a button that starts a new puzzle. |\n\n## Rules\n\nThe four charter rules, quoted word for word. Every workflow follows them.\n\n1. Beginner help must never fill in or reveal a correct digit\n2. Every puzzle must have exactly one solution\n3. No sign-up, login, ads or ad scripts anywhere on the page\n4. Never invent facts; the page contains no made-up claims or statistics\n\nStandards that apply to all work: phone-first layout with large touch-friendly cells and buttons; warm, calm, uncluttered look with plenty of space and readable text; plain HTML, CSS and JavaScript in one file with no build step; no sign-up, no ads, no tracking; no JavaScript errors and no horizontal overflow at 360px and 1280px.\n\n## Help policy\n\nWhat beginner help may and may not do, so it helps without spoiling the puzzle.\n\n**Allowed**\n- Highlighting the row, column and box of the selected cell, and cells holding the same number (item 7).\n- Marking a repeated number in its row, column or box, computed only from the values currently on the board (item 8).\n- Notes mode, where the player marks their own candidates (item 5).\n- Undo (item 6).\n- A hint that marks one cell and explains the reasoning in words (item 9).\n- A short how-to-play explanation (item 10).\n\n**Not allowed**\n- Placing a digit in any cell for the player.\n- Showing or naming the correct digit anywhere, in text, colour, tooltip, label or console output.\n- Telling the player that a non-repeating digit is wrong. Repeat marks only say a number repeats; they never compare against the solution.\n- Auto-filling notes with candidates **(assumption: notes are filled only by the player)**.\n- Reading the stored solution for any help feature.\n\n**Hint behaviour (assumption: details chosen by us; the Requester left them to us)**\n- The hint looks for a cell where a next step exists, using only the current board values: first a cell with a single possible digit, then a row, column or box where a digit fits in only one place.\n- If neither is found, it marks the empty cell with the fewest possibilities and says so in words.\n- The hint marks the cell and writes a sentence to the message area explaining why that cell is the next step, using the wording in copy.md.\n- Hint sentences contain no digits at all, neither numerals nor spelled-out numbers, so the answer cannot leak through the wording.\n- The hint never places or shows the digit. The player works it out.\n\n## Engagement\n\nWhat helps people enjoy the game and come back. Every item below is an assumption about design, not a claim about players.\n\n- **Easy on the first visit.** A new player lands on Easy and can change level at any time.\n- **Quick to start.** The page opens straight into a playable puzzle with no sign-up, no splash screen and no ads.\n- **Continue where you left off.** Returning players are offered Continue or New puzzle.\n- **Gentle feedback.** There is no timer, score or penalty, and no \"wrong\" messages. Repeat marks are soft in tone, not alarming.\n- **Mistakes are cheap.** Undo is always one tap away.\n- **Friendly voice.** Labels, hints and the win message use warm, plain language and make no claims or statistics.\n- **A small reward.** Completing a puzzle shows a friendly congratulation and a New puzzle button for another round.\n- **Calm look.** Warm colours, generous spacing and large readable digits, with few controls on screen at once.\n\n## Choices to report to the Requester\n\nThe Requester asked us to decide the details and to say what we chose. At the end Identity lists these:\n- Levels are Easy, Medium and Hard, with Easy on the first visit.\n- Help is limited to highlights, repeat marks, notes, undo, a worded hint and a how-to-play panel.\n- Hints point to a cell and explain in words, with no digits.\n- There is no timer or score.\n- Progress is saved in the browser only, with a Continue prompt.\n- The page has no accounts, ads or tracking.\n", "copy.v2.md": "# Sudoku copy\n\nWording for the page. Later workflows read this file and use it as written. Anything the charter does not state is marked **(assumption)**.\n\n**(assumption)** The earlier version of this file was not visible when this revision was written. The sections other than Win message were rebuilt from the product plan, the architecture and the charter. If the built page already has its own wording for them, the built page wins and only Win message is new.\n\nTone: warm, calm and short. No made-up claims, no statistics, no praise that promises anything about the player.\n\n## Labels\n\n- Page title: Sudoku\n- Levels: Easy, Medium, Hard\n- Start a new game: New puzzle\n- Digit buttons: the digits 1 to 9\n- Clear the selected cell: Erase\n- Candidate marks toggle: Notes\n- Reverse the last move: Undo\n- Ask for help: Hint\n- Open the explanation: How to play\n- Close a panel: Close\n- Skip link: Skip to the game\n\n## How to play\n\nKeep it short, closed on load, and openable and closable.\n\n- Fill every empty square so each row, each column and each 3x3 box holds the digits 1 to 9 once.\n- Tap an empty square, then tap a digit below the grid.\n- Turn on Notes to jot small candidate digits in a square. They never count as an answer.\n- Erase clears the selected square. Undo takes back your last move.\n- A repeated digit in a row, column or box is marked so you can spot it. The mark only says it repeats; it never says what is right.\n- Stuck? Press Hint. It points at a square and explains the thinking in words, but never gives the digit.\n- Your game is saved in this browser, so you can pick it up later.\n\n## Hint templates\n\nRules: a hint sentence contains no digits at all, neither numerals nor spelled-out numbers. A hint marks a cell and never places or names a digit. Placeholders in braces are filled with the words row, column or box only.\n\n- Only candidate left: \"Look at the marked square. Its row, column and box already hold so many digits that only a lone candidate is left. Which digit is missing?\"\n- Only place left: \"Look at the {unit} that contains the marked square. A digit that is still missing has nowhere else to go in that {unit} except this square. Which digit could it be?\"\n- Fewest possibilities: \"No quick step stands out right now. The marked square has the fewest possibilities, so it is a good place to try Notes.\"\n- Repeats first: \"Some digits repeat. Fix the marked repeats first, then ask for a hint again.\"\n- Nothing to help: \"There is no empty square left to point at.\"\n\n## Repeats\n\n- Message when a digit repeats: \"This digit already appears in its row, column or box.\"\n- The message compares only the digits on the board. It never says which digit is correct.\n\n## Continue\n\n- Prompt title: Welcome back\n- Prompt text: \"You have a game in progress. Would you like to carry on?\"\n- Buttons: Continue, New puzzle\n- Level line: \"Level: {level}\"\n\n## Win message\n\nUsed by the win dialog (done-when items 12, 16 and 17). Placeholders are filled by the page from the game state. This section holds no numbers of its own.\n\n**Placeholders**\n- `{minutes}`: whole minutes of play, written without leading zeros.\n- `{seconds}`: remaining seconds, written with two digits when there is at least a minute.\n- `{hints}`: the number of hints used, a whole number.\n\n**Dialog text**\n- Title: Well done!\n- Body: \"You solved the puzzle. Nicely done.\"\n- Button: New puzzle (starts a new puzzle at the current level)\n\n**Time taken line (`#win-time`)**\n- Under a minute: \"Time taken: {seconds} seconds\"\n- A minute or more: \"Time taken: {minutes} min {seconds} sec\"\n\n**Hints used line (`#win-hints`)**\n- No hints: \"Hints used: none. You did it all yourself!\"\n- One hint: \"Hints used: {hints}. Just a little nudge.\"\n- More than one hint: \"Hints used: {hints}. A little help along the way.\"\n\n**Rules for the win message**\n- The time and hints come only from the game state, never typed in by hand.\n- The lines make no claims about other players, records or averages. **(assumption: no comparisons are shown, to follow the rule against made-up claims)**\n- Hint wording elsewhere in this file stays free of digits. The Hints used line is not a hint sentence, so it may show the count.\n", "architecture.v2.md": "# Sudoku architecture\n\nReference for the workflows that build the page. It follows the charter and the product plan. Anything the charter does not state is marked **(assumption)**.\n\n## Structure\n\n- One file, plain HTML, CSS and JavaScript, no build step, no external resources **(assumption: none used)**.\n- Each workflow owns one marked section of the file. A section writes only its own markup, styles and script, and scopes its CSS to its own selectors.\n- One global namespace, `SD`, carries shared state and functions. Sections talk through `SD` and through custom events on `document`, never through each other's internals.\n- Events: `newgame` (a new or restored puzzle is ready), `change` (the board, notes or selection changed), `win` (the grid is complete and correct).\n- Boot runs last (startup-and-link-integrity) and starts the first game or offers Continue.\n\n## State\n\n`SD.state` holds the single source of truth:\n\n- `level`: \"Easy\", \"Medium\" or \"Hard\".\n- `puzzle`: 81 values, 0 for empty (the givens).\n- `solution`: 81 values. Only the engine, the win check and the uniqueness check may read it. No help feature may read it.\n- `values`: 81 values, the current board (givens plus player entries).\n- `notes`: 81 sets of candidate marks, player-entered only.\n- `selected`: index 0-80 or -1.\n- `notesMode`: boolean.\n- `history`: stack of snapshots for undo.\n- `elapsedMs`: milliseconds of play so far (see Timer and hint count).\n- `hintsUsed`: number of hints given so far (see Timer and hint count).\n\nA cell is a given when `puzzle[i] !== 0`. Givens are never changed.\n\n## Generation\n\n- `SD.engine.generate(level)` builds a full valid grid, then removes cells one by one in random order, keeping a removal only if the puzzle still has exactly one solution.\n- It returns `{ puzzle, solution }`. Generation must finish in under 3 seconds **(assumption: budget taken from the stop-loss)**.\n- `SD.newGame(level)` calls `generate`, resets `values`, `notes`, `history`, `selected`, `elapsedMs` and `hintsUsed`, and fires `newgame`.\n\n## Uniqueness\n\n- `countSolutions(grid, limit)` is a backtracking solver that stops counting at `limit`.\n- A puzzle is accepted only when `countSolutions(puzzle, 2) === 1` and `solve(puzzle)` equals the source solution. The fallback path also requires a count of 1.\n- This satisfies the rule \"Every puzzle must have exactly one solution\" and done-when item 4, checked by the page's own code.\n\n## Difficulty\n\n- Levels are Easy, Medium and Hard, chosen with `.level-btn` buttons that call `SD.newGame(level)`.\n- Difficulty is set by how many cells are removed, with Hard also limited to puzzles that need more than single-candidate steps **(assumption: exact clue counts are chosen by the engine builder and are not shown to the player as claims)**.\n- The first visit starts on Easy.\n\n## DOM contract\n\nLater workflows use these ids and classes and create no others of the same meaning.\n\n- `#board` holds 81 `.cell` buttons. Cell classes: `empty`, `player`, `selected`, `peer`, `same`, `conflict`, `hint-cell`. Notes are `.note` spans inside a cell.\n- `#pad` holds nine `.pad-digit` buttons and `#erase`.\n- Tools: `#notes`, `#undo`, `#hint`. Message area: `#message`.\n- Levels: `.level-btn` (three) and `#new-puzzle`.\n- How to play: `#howto-btn`, `#howto-panel`, `#howto-close`.\n- Save: `#continue-prompt`, `#continue-btn`.\n- Win dialog: `#win`, `#win-new`, `#win-time`, `#win-hints`. It is hidden until a correct win.\n\n## Save and restore\n\n- After each change and on `newgame`, the page writes versioned JSON to `localStorage` inside try/catch. A storage error never throws.\n- The save holds level, puzzle, solution, values, notes, `elapsedMs` and `hintsUsed`.\n- On load, a valid save shows `#continue-prompt` with Continue and New puzzle. An invalid or missing save starts a fresh Easy game.\n\n## Hints and help\n\n- The hint reads only `values`, never `solution`. It marks one cell with `.hint-cell` and writes a sentence to `#message`. Hint sentences contain no digits at all, neither numerals nor spelled-out numbers.\n- Repeat marks (`.conflict`) compare board values only.\n\n## Timer and hint count\n\nThis supports done-when items 16 and 17: the win message shows the time taken and the number of hints used.\n\n**State**\n- `state.elapsedMs`: whole milliseconds of play for the current puzzle.\n- `state.hintsUsed`: whole number of hints used on the current puzzle.\n\n**Reset**\n- Both are set to 0 on every `SD.newGame(level)`, including New puzzle from the win dialog and from the continue prompt.\n- On a restored puzzle they are set from the save, not zeroed (see Save and restore below).\n\n**Timer counting**\n- The timer starts when a new or restored puzzle is ready (on `newgame`).\n- It adds the time passed since its last tick, using a monotonic clock (`performance.now()`), to `elapsedMs`. Ticking does not need to be visible on screen; the page shows no running clock **(assumption: the time is shown only in the win message, to keep the page uncluttered)**.\n- The timer pauses while the page is hidden (`visibilitychange`) and while the continue prompt is open, so time away from the game is not counted **(assumption)**.\n- The timer stops when the win dialog opens. `elapsedMs` is then final and is not changed by later ticks.\n- Undo, Erase and notes do not change `elapsedMs`.\n\n**Hint counting**\n- `hintsUsed` goes up by 1 only when a click on `#hint` actually marks a `.hint-cell`. A click that finds no cell, or that is ignored because the game is won, adds nothing.\n- Undo and Erase never lower `hintsUsed`.\n- Hints still never place or show a digit. The count is a plain number kept in state and does not reveal anything about the solution.\n\n**Save and restore**\n- The save writes `elapsedMs` and `hintsUsed` with the other fields. The save format stays versioned.\n- On restore, each value is accepted only if it is a finite number at or above 0 (`hintsUsed` also a whole number). A missing, negative or non-numeric value falls back to 0. An old save without these fields therefore restores with 0 and 0.\n\n**Win dialog**\n- When `win` fires, the timer stops and the page fills `#win-time` with the time as minutes and seconds, and `#win-hints` with `hintsUsed`, using the wording in copy.md.\n- Both lines are read from state at the moment of the win. Nothing is estimated or made up.\n- The rule that hint sentences contain no digits applies to hint wording only. The win dialog may show numbers because they are the player's own result.\n- `#win-new` closes the dialog and calls `SD.newGame` at the current level, which resets both values.\n\n## Rules for later workflows\n\n- Do not read `SD.state.solution` for any help or marking feature.\n- Do not rename the ids and classes in the DOM contract.\n- Keep every section's CSS scoped, and keep the whole page near 60 KB.\n- Never invent facts or figures in page text.\n", "design-guide.v1.md": "# Sudoku design guide\n\nReference for the build workflows (W-5 to W-17). It follows the charter and `product-plan.md`. Anything the charter does not state is marked **(assumption)**. Look: warm, calm, uncluttered, with space and readable text. No images, no web fonts, no external requests.\n\n## Colours\n\nUse these exact hex values as CSS custom properties on `:root`. Do not add other colours. Text must stay readable on its background (aim for at least 4.5:1). Meaning never depends on colour alone (see the cue column).\n\n| Token | Hex | Used for |\n|---|---|---|\n| `--bg` | #FBF6EE | Page background (warm cream) |\n| `--surface` | #FFFDF9 | Board, dialogs, panels |\n| `--text` | #2F2A26 | Main text, given digits |\n| `--muted` | #6B6159 | Notes, hints text, secondary labels |\n| `--accent` | #2F6F6A | Player digits, active level, primary buttons (calm teal) |\n| `--accent-text` | #FFFFFF | Text on `--accent` |\n| `--btn` | #EFE5D6 | Secondary button background (pad, tools) |\n| `--btn-press` | #E3D5C0 | Button pressed state |\n| `--line` | #D9CFC2 | Thin cell lines, button borders |\n| `--box-line` | #5B514A | Thick 3x3 box lines and board outer border |\n| `--selected` | #CFE6E2 | `.selected` cell background |\n| `--peer` | #F1E8DA | `.peer` cells (row, column, box) |\n| `--same` | #F6DDB0 | `.same` cells (same number) |\n| `--conflict-bg` | #FBE3DE | `.conflict` background |\n| `--conflict` | #B3402F | `.conflict` digit (brick red, not alarming) |\n| `--hint` | #C98A1B | `.hint-cell` dashed outline |\n| `--hint-bg` | #FFF4C9 | `.hint-cell` background |\n| `--focus` | #1D4E89 | Keyboard focus ring on every button |\n| `--overlay` | rgba(47,42,38,0.45) | Backdrop behind dialogs |\n\nCell state rules:\n- `.given`: `--text`, weight 700, background `--surface`. Looks fixed, not tappable-looking (no pressed style).\n- `.player`: `--accent`, weight 600.\n- `.selected`: `--selected` background plus a 3px inset `--accent` outline (outline is the non-colour cue).\n- `.peer`: `--peer`. `.same`: `--same`. If a cell is `.selected` that wins over `.same`, which wins over `.peer`.\n- `.conflict`: `--conflict` digit, `--conflict-bg` background, and a wavy underline on the digit (non-colour cue). Repeat marks never use words like \"wrong\".\n- `.hint-cell`: `--hint-bg` background and a 3px dashed `--hint` outline (non-colour cue). A gentle pulse is allowed, but turn it off under `prefers-reduced-motion: reduce`.\n- Active level button (`.level-btn.active`): `--accent` background, `--accent-text`, plus `aria-pressed=\"true\"`. The same style marks `#notes` when notes mode is on.\n- Focus: every button shows a 3px `--focus` outline with 2px offset on `:focus-visible`.\n\n**(assumption)** Light theme only. No dark mode.\n\n## Type scale\n\nFont stack, no downloads: `system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif`.\n\n| Role | Phone (below 960px) | Desktop (960px and up) | Weight |\n|---|---|---|---|\n| Page title `h1` \"Sudoku\" | 24px / line 28px | 32px / 36px | 700 |\n| Body and dialog text | 16px / 24px | 16px / 24px | 400 |\n| Button labels | 16px | 16px | 600 |\n| Pad digits | 22px | 26px | 600 |\n| Cell digits | 22px | 32px | given 700, player 600 |\n| `#message` text | 14px / 17px | 16px / 24px | 400 |\n| Dialog heading (`#win`, `#howto-panel`, `#continue-prompt`) | 22px / 28px | 24px / 30px | 700 |\n| `.note` digits | 10px | 14px | 600 |\n\nRules: `.note` digits are the only text under 14px. This is an exception because nine marks must fit one cell. Never set text under 14px anywhere else. Use `font-variant-numeric: tabular-nums` on cells and pad. Dialog text lines stay under about 60 characters wide.\n\n## Touch sizes\n\n| Control | Minimum size | Note |\n|---|---|---|\n| `.cell` | 36 x 36px | **(assumption)** Nine cells across a 360px screen cannot reach 44px. 36px is the floor the build checks use. Cells are as large as the width allows. |\n| `.pad-digit`, `#erase` | 44px high, about 61px wide at 360px | Five columns |\n| `.level-btn`, `#new-puzzle` | 44px high | Three columns |\n| `#undo`, `#notes`, `#hint` | 44px high | Three columns |\n| `#howto-btn`, `#howto-close`, `#continue-btn`, `#win-new` | 44px high (48px in dialogs), at least 120px wide | |\n\nGaps between buttons are at least 6px so taps do not hit the wrong control. Every button has a visible text label and an `aria-label`. Tapping a button must not zoom the page: use `touch-action: manipulation` and no `user-scalable=no`.\n\n## Layout 360px\n\nApplies to every width below 960px. The page is one centred column with `max-width: 500px`, `margin: 0 auto` and `padding: 6px 10px`. At 360px the content width is 340px.\n\nOrder top to bottom:\n1. Header row: `h1` on the left, `#howto-btn` on the right (44px high).\n2. Level row: `.level-btn` Easy, Medium, Hard in 3 equal columns, 6px gap (`#new-puzzle` goes in the tools row on wider screens or in the win and continue dialogs; **(assumption)** it is not a fourth button in this row).\n3. `#board`: a square, centred. Size: `--board: clamp(328px, calc(100svh - 292px), min(480px, 100%))`. Declare a `100vh` fallback first. Inside it: 2px `--box-line` outer border, 1px `--line` cell lines, 2px `--box-line` lines after columns 3 and 6 and rows 3 and 6 so 3x3 boxes are clearly marked. Cells use `grid-template-columns: repeat(9, minmax(0, 1fr))`. At 340px the cells are about 37px, at 328px exactly 36px.\n4. `#message`: fixed height 34px (two lines at 14px), centred text in `--muted`. It never changes the layout height. **(assumption)** Hint and status sentences must fit in two lines, so they are at most 80 characters.\n5. Tools row: `#undo`, `#notes`, `#hint` in 3 equal columns, 6px gap.\n6. `#pad`: 5 columns, 2 rows, 6px gap. Row one holds digits 1 to 5. Row two holds digits 6 to 9, then `#erase` (secondary style).\n\nOverlays (`#howto-panel`, `#continue-prompt`, `#win`) are fixed-position centred cards on an `--overlay` backdrop, `max-width: 340px`, `max-height: 80svh` with vertical scroll inside. They take no space in the page flow, so they cost no height. They use the `hidden` attribute, and the CSS must include `[hidden] { display: none !important; }`.\n\nNo-overflow rules (all widths): `*, *::before, *::after { box-sizing: border-box; }`; `min-width: 0` on grid children; no fixed pixel width wider than its container; widths use `%`, `fr` or `clamp`, never raw `100vw` on blocks; `img` and `svg` not used for layout. Do not hide overflow to cover a bug. Fix the cause.\n\n## Layout 1280px\n\nApplies from 960px up. The page is centred with `max-width: 960px`, `margin: 0 auto` and `padding: 16px 24px`.\n\n- Header row spans the full width (title left, `#howto-btn` right).\n- Below it, two columns with a 32px gap: `#board` on the left, a 340px control panel on the right. The panel holds, top to bottom: level row, `#message`, tools row, `#pad`, with 16px between blocks. Align the panel to the top of the board.\n- `--board: clamp(440px, calc(100svh - 140px), 540px)`. At 1280 x 720 the board is 540px, cells are about 60px.\n- `#message` has a fixed height of 72px (three lines at 16px). Pad buttons are 52px high. Level, tools and other buttons are 48px high.\n- Hover styles are allowed on pointer devices only (`@media (hover: hover)`). A slightly darker `--btn-press` is enough.\n\n## Height budget\n\nTarget: on a 360 x 640 phone, the whole board and the whole pad are in view with no vertical scrolling. Horizontal scrolling is never allowed. Browser toolbars are not counted **(assumption)**. On shorter screens the page may scroll vertically, but the order above keeps board first and pad right after it.\n\n| Block | Height (px) |\n|---|---|\n| Page padding top + bottom (6 + 6) | 12 |\n| Header row | 44 |\n| Level row | 44 |\n| `#board` (340 at most, 328 at least) | 340 |\n| `#message` | 34 |\n| Tools row | 44 |\n| `#pad` (2 rows of 44 + 6 gap) | 94 |\n| Gaps between 6 blocks (5 x 4) | 20 |\n| **Total with board at 340** | **632** |\n\n- 632 fits 640 with 8px spare.\n- The board shrinks with the viewport height down to 328px (36px cells), so everything fits in a 620px viewport. The formula `100svh - 292px` comes from the 292px of non-board height (12 + 44 + 44 + 34 + 44 + 94 + 20).\n- Below 620px the board stays 328px and the page scrolls vertically.\n- On tall phones, `@media (min-height: 700px)` raises the gaps between blocks from 4px to 10px. This adds 30px and still fits.\n- Overlays add 0 to the budget.\n- If a later workflow adds anything to the phone column, it must come out of this table or go in an overlay. Do not make the column taller.\n\n## Rules for later workflows\n\n1. Use only the colours, sizes and class styles above. If something is missing, make the smallest choice that follows these rules and keep it inside your own section.\n2. Scope styles to your own section. Share the `:root` tokens, and W-5 defines them once.\n3. The conflict, hint and selected styles never use or hint at the solution. They are drawn only from the values on the board.\n4. No external fonts, images, scripts or trackers.\n5. Check at 360px and 1280px before reporting: no horizontal overflow, board and pad fully visible at 360 x 640.\n", "architecture.v1.md": "# Sudoku architecture\n\nReference for W-3 to W-17. It follows the charter and `product-plan.md`. Anything the charter does not state is marked **(assumption)**. Numbers marked **UNVERIFIED** are starting points that nobody has measured yet.\n\nAuthority: this file decides ids, classes, state, events and algorithms. `design-guide.md` decides colours, sizes and look. `copy.md` decides wording. If two files disagree about a name, this file wins.\n\n## Structure\n\n**One file, `index.html`.** Plain HTML, CSS and JavaScript. No build step, no CDN library **(assumption: none needed)**, and no external `src` or `href`. Fonts come from the system font stack.\n\n**Assembly.** Code builds the file from each workflow's marked section, in workflow order. Each section holds its own markup, then its own `<style>` (scoped to its own ids and classes), then its own `<script>`. A section's script runs after its markup exists.\n\n| Section | Workflow | Owns | Exposes on `SD` |\n|---|---|---|---|\n| W-5 | page-shell-and-layout | head, base CSS, nav, h1, `#app`, `#board`, `#pad`, `#message`, `.j2-btn` style, layout slots | none |\n| `#engine-script` (W-6) | puzzle-engine | pure functions, no DOM | `SD.engine` |\n| W-7 | board-and-cell-selection | the 81 cells, game state, rendering, selection | `SD.state`, `SD.render`, `SD.select`, `SD.setGame` |\n| W-8 | number-pad-and-erase | digit buttons, `#erase`, every board change | `SD.applyMove`, `SD.onDigit`, `SD.erase` |\n| W-9 | difficulty-and-new-game | level buttons, `#new-puzzle` | `SD.newGame` |\n| W-10 | notes-mode | `#notes`, note drawing | `SD.toggleNote` |\n| W-11 | undo | `#undo` | `SD.undo` |\n| W-12 | highlights-and-conflict-marks | `.peer`, `.same`, `.conflict` | `SD.conflicts` |\n| W-13 | hint-finder | `#hint`, `.hint-cell` | `SD.findHint` |\n| W-14 | how-to-play-panel | `#howto-btn`, `#howto-panel`, `#howto-close` | none |\n| W-15 | save-and-continue | saving, `#continue-prompt`, `#continue-btn` | `SD.save`, `SD.showContinue` |\n| W-16 | win-celebration | `#win`, `#win-new` | none |\n| `#app-boot` (W-17) | startup-and-link-integrity | start-up, final layout fixes | `SD.boot` |\n\n**Shared namespace.** All scripts share one global object, `SD`. Every script section starts with this identical line group, so the first one to run creates the object and the rest reuse it:\n\n```js\nvar SD = window.SD = window.SD || {};\nSD.h = SD.h || {};\nSD.on = SD.on || function (e, f) { (SD.h[e] = SD.h[e] || []).push(f); };\nSD.emit = SD.emit || function (e, d) { (SD.h[e] || []).forEach(function (f) { f(d); }); };\nSD.say = SD.say || function (t) { var m = document.getElementById('message'); if (m) m.textContent = t || ''; };\n```\n\n**Load-time rule.** At load time a script may only (a) define its functions, (b) build or find its own elements, (c) attach its listeners with `SD.on` or `addEventListener`. It must not call functions from a later section. Cross-section calls happen at event time, after `SD.boot()`. Every lookup of another section's element or function is guarded (`if (!el) return;`), so a missing piece never throws.\n\n**Events** (sent with `SD.emit`):\n\n| Event | Sent by | Data | Meaning |\n|---|---|---|---|\n| `render` | `SD.render` (W-7), at its end | none | Cells are redrawn. Decorators (W-10 notes, W-12 marks, W-13 hint) add their classes and children now. Handlers run in section order. |\n| `select` | `SD.select` | `{index}` | Selection changed. Followed by `SD.render()`. |\n| `change` | `SD.applyMove`, `SD.undo` | `{index, kind}` with kind `enter`, `erase`, `note` or `undo` | A cell's value or notes changed. Save (W-15) and win check (W-16) listen. |\n| `newgame` | `SD.newGame` | `{level}` | A fresh puzzle replaced the old one. |\n| `restore` | `SD.boot` after loading a save | `{level}` | A saved game replaced the state. |\n| `win` | W-16 | none | Grid complete with no repeats. |\n\n**Page layout (W-5).** `#app` is a CSS grid with three equal columns, centred, with a maximum width. Wide parts span all three columns (`grid-column: 1 / -1`). Parts appear in this order, set with CSS `order` so section assembly order does not matter:\n\n| Order | Slot | Content |\n|---|---|---|\n| 1 | `.slot.slot-levels` | W-9: the three `.level-btn` and `#new-puzzle` in one wrapper |\n| 2 | `#board` | W-5 container, W-7 fills it |\n| 3 | `#message` | one-to-two-line status area, with reserved height so the page does not jump |\n| 4 | `.tool` (three single-column items) | `#undo` (W-11), `#notes` (W-10), `#hint` (W-13), each a direct child of `#app` |\n| 5 | `#pad` | W-8: nine `.pad-digit` and `#erase`, a 5-column grid (two rows of five) |\n| 6 | `.slot.slot-info` | W-14: `#howto-btn`, then `#howto-panel` |\n\n`#continue-prompt` (W-15) and `#win` (W-16) are direct children of `#app` and use `position: fixed` overlays, so they take no grid space. The header above `#app` holds the `h1` \"Sudoku\", the nav with one in-page link to `#board`, and W-5's start button.\n\n**Size rule.** The board is `width: min(100%, <max>)` with `aspect-ratio: 1` and nine `minmax(0, 1fr)` columns. Nothing has a fixed pixel width wider than the viewport, so nothing overflows at 360px. Nine columns of 44px would need 396px, so cells cannot reach 44px at 360px. Cells are as large as the width allows (about 36px or more). Pad and tool buttons are at least 44px.\n\n## State\n\nOne object, `SD.state`, created by W-7. All sections read and write it. Cells are numbered `i = row * 9 + col` (0 to 80). `row = floor(i / 9)`, `col = i % 9`, `box = 3 * floor(row / 3) + floor(col / 3)`.\n\n```js\nSD.state = {\n  v: 1,\n  level: 'easy',       // 'easy' | 'medium' | 'hard'\n  puzzle: [],          // 81 ints 0-9: the givens (0 = empty). Never changes during a game.\n  values: [],          // 81 ints 0-9: givens plus the player's digits\n  notes: [],           // 81 ints 0-511: bit (d-1) set means note d is marked\n  selected: -1,        // cell index, or -1 for none\n  notesMode: false,\n  history: [],         // undo snapshots, newest last, at most 100\n  hintCell: -1,        // cell marked by the last hint, or -1\n  won: false\n};\n```\n\n**There is no solution in the state, in the save, or anywhere after generation.** The generator keeps the finished grid in a local variable and drops it when it returns. No help feature can read an answer because none is stored. This is how rule 1 is enforced.\n\nInvariants:\n- If `puzzle[i] !== 0` then `values[i] === puzzle[i]` and `notes[i] === 0`.\n- If `values[i] !== 0` then `notes[i] === 0`.\n- Digits are 1 to 9, and 0 means empty.\n\nFunctions owned by W-7:\n- `SD.setGame({level, puzzle, values, notes, history})` is the single way to replace the game. Missing `values` defaults to a copy of `puzzle`. It resets `selected`, `hintCell`, `won` and `notesMode` and calls `SD.render()`. `SD.newGame` and the save loader both use it.\n- `SD.select(i)` sets `selected`, clears nothing else, sends `select`, and renders. Tapping any cell selects it, givens included, so equal numbers can be highlighted **(assumption)**. Entry into a given is ignored.\n- `SD.render()` updates the 81 existing buttons in place. It sets each cell's text from `values`, the classes `.given`, `.player`, `.selected`, and an `aria-label` without answers (position and the digit currently shown only). It clears the old decorator classes, then sends `render`.\n\nFunctions owned by W-8, which are the only code that changes `values` or `notes` during play:\n- `SD.applyMove(i, newValue, newNotes)`: ignores givens and no-ops (no change means no history entry). Otherwise pushes `{i, v: oldValue, n: oldNotes}` onto `history` (dropping the oldest past 100), sets the new value and notes, sets `hintCell = -1`, calls `SD.say('')`, renders, then sends `change`.\n- `SD.onDigit(d)`: with nothing selected, says the \"tap a cell first\" text from `copy.md`. In notes mode, calls `SD.toggleNote(d)` if it exists. Otherwise calls `SD.applyMove(selected, d, 0)`. Entering the digit already in the cell is a no-op **(assumption)**.\n- `SD.erase()`: clears the selected cell's value; if the cell is empty it clears its notes **(assumption)**. Givens are ignored.\n\n## Generation\n\nAll of this lives in `#engine-script` (W-6) as pure functions with no DOM and no network.\n\n**Shared tables** (built once): `ROWS`, `COLS`, `BOXES` (each 9 arrays of 9 indices), `PEERS[i]` (the 20 other cells that share a row, column or box with `i`), and `popcount` for masks 0 to 511. `SD.engine.candidates(values, i)` returns a bitmask of digits not used by any peer of `i`. Notes are never consulted.\n\n**`SD.engine.generate(level)`** returns `{puzzle: int[81], level, clues}` and sets `SD.engine.lastReport = {level, clues, solutions, ms}`. The report holds no grid and no digits.\n\n1. **Full grid.** `fillRandom()` fills an empty grid by backtracking: pick the empty cell with the fewest candidates, try its candidate digits in random order. A valid full grid is found quickly in practice.\n2. **Remove.** Visit the 81 cells in random order. For each one, blank it, then keep the blank only if the grid still passes `isAcceptable(grid, level)`, otherwise put the digit back. No symmetry is required **(assumption)**.\n3. **Stop** when `clues` reaches a random target inside the level's clue range (see Difficulty), or when every cell has been tried, or when 2000 ms have passed. The stop always returns the best grid so far.\n4. **Final check.** Call `countSolutions(puzzle, 2)`. If it is not exactly 1, discard and repeat from step 1, up to 5 times. This should never trigger, because every kept grid already passed the check (see Uniqueness). If all 5 attempts fail, throw an error. The page must never show a puzzle that was not proven unique.\n5. Discard the full grid and return.\n\n**Timing.** Generation is synchronous on the main thread. The target is well under one second per puzzle, with a hard cap of 3 seconds in total, which is W-6's stop-loss. **UNVERIFIED**: no timing has been measured yet. W-9 shows \"making a puzzle\" text in `#message` and starts generation in `setTimeout(\u2026, 0)` so the text can paint first.\n\n## Uniqueness\n\nThis is how done-when item 4 is met by the page's own code.\n\n**`SD.engine.countSolutions(grid, limit)`** returns how many completions the grid has, counting up to `limit` and then stopping.\n- Keeps `rowMask[9]`, `colMask[9]`, `boxMask[9]` of used digits.\n- Rejects at once a grid whose givens already repeat.\n- At each step picks the empty cell with the fewest candidates; returns the count so far if some cell has none; recurses over its candidates; adds up solutions; stops as soon as the count reaches `limit`.\n- Callers use `limit = 2`, so the answer is 0, 1 or \"2 or more\". Only exactly 1 is accepted.\n- It works on a copy and never changes the grid it is given.\n\n**Invariant.** The full grid has exactly one completion (itself), so the removal loop starts valid. A blank is kept only if `countSolutions(grid, 2) === 1` afterwards. Therefore every grid the loop holds, including the one it returns, has exactly one solution, however early the loop stops.\n\n**Evidence for Audit.** `SD.engine.lastReport.solutions` is `1` for every returned puzzle, and `SD.engine.countSolutions(SD.state.puzzle, 2)` can be called in the console for any puzzle on the page. Both only count; neither shows a grid.\n\nSaved games are not re-checked on load; they only get a shape check **(assumption)**.\n\n## Difficulty\n\nThree levels, with keys `easy`, `medium`, `hard` and labels Easy, Medium and Hard. The first visit starts on Easy.\n\n| Level | Clue range (givens left) | Solving technique the puzzle must allow |\n|---|---|---|\n| Easy | 38 to 45 **UNVERIFIED** | Solvable using only cells that have a single possible digit |\n| Medium | 30 to 36 **UNVERIFIED** | Solvable using single-possible-digit cells and digits that fit only one place in a row, column or box |\n| Hard | 24 to 29 **UNVERIFIED** | Unique solution only; no technique limit, so it may need more than the two above |\n\n`isAcceptable(grid, level)` = `countSolutions(grid, 2) === 1`, and for Easy and Medium also a quick singles solver (`solveBySingles(grid, useHidden)`) must fill the whole grid. This is the same kind of reasoning the hint uses.\n\nNotes:\n- The clue ranges and the idea that fewer clues means harder are **UNVERIFIED** assumptions. W-6 should record real clue counts and times in `lastReport`, and Audit should look at them. Nobody has tested how hard these feel to a player. The page must not claim anything about difficulty beyond the three names.\n- If the time cap stops removal early, the puzzle may have more clues than the range. That is accepted, because a unique puzzle matters more than the range.\n- Hard puzzles may have no single-digit step. The hint then falls back (see Hints).\n\n## Hints\n\nDone-when item 9 and rule 1. W-13 owns `SD.findHint()`.\n\n**Input:** `SD.state.values` only (plus `selected`, as a tiebreak). Notes are ignored.\n**Output:** `{cell: int, kind: string}` or `null`. **No digit is ever part of the result.** Any digit used inside the search lives in a local variable and is never stored, logged, written to the DOM, or put in an attribute, tooltip or label.\n\n**Search order** (the first match wins). When several cells match, prefer the selected cell, then reading order (index ascending).\n\n| Order | `kind` | Condition (from current values) | Marked cell |\n|---|---|---|---|\n| 1 | `repeat` | The board has any `.conflict` (a repeat) | one repeating player cell |\n| 2 | `stuck` | An empty cell has no possible digit | that cell |\n| 3 | `single-cell` | An empty cell has exactly one possible digit | that cell |\n| 4 | `hidden-box`, then `hidden-row`, then `hidden-col` | In that unit, some missing digit has only one empty cell where it can go | that cell |\n| 5 | `fewest` | None of the above; take the empty cell with the fewest possible digits (two or more) | that cell |\n| 6 | `complete` | No empty cell | none (no mark) |\n\n**Effect of a hint:** set `state.hintCell = cell`, select that cell, render (which adds `.hint-cell` through the `render` handler), and write the sentence for `kind` into `#message` with `SD.say`. The hint never places a digit, never fills notes, and never changes `values`. `hintCell` clears on the next move (`applyMove` does it) and on a new game. It does not clear on selection. Using a hint has no cost or score **(assumption)**.\n\n**Wording.** `copy.md` must have one template per `kind` (`repeat`, `stuck`, `single-cell`, `hidden-box`, `hidden-row`, `hidden-col`, `fewest`, `complete`). Rules for every template:\n- No digits at all: no numerals and no spelled-out numbers.\n- Refer to places in words (this cell, this row, this column, this box) because the marked cell shows where.\n- Explain the reasoning in plain steps, for example that the other numbers around the cell leave only one choice.\n- Never say which digit, and never say a non-repeating digit is wrong.\n- `stuck` says only that the marked cell has no options left and an earlier number may need another look. It does not name a cell or a digit **(assumption: allowed because it comes from board contradiction, not from the solution)**.\n\n## Conflicts\n\nDone-when items 7 and 8. W-12 owns this. It runs on every `render` event and uses only `values` and `selected`. It never reads anything that could be the solution (there is none).\n\n**Selection highlights**, applied by classes in the `render` handler:\n- `.peer` on the 20 cells that share a row, column or box with the selected cell (not the selected cell itself).\n- `.same` on every other cell whose value equals the selected cell's value, when that value is not 0 (givens and player digits both).\n- With nothing selected, no `.peer` and no `.same`.\n\n**Repeat marks:**\n- `SD.conflicts(values)` returns the set of cell indices to mark. For each row, column and box, for each digit that appears two or more times, the cells that hold it are repeating.\n- `.conflict` goes on repeating **player** cells only. Givens never get `.conflict`, because a repeat is always the player's entry. If a player digit repeats a given, only the player's cell is marked.\n- Marking uses a visible cue besides colour (for example an underline or pattern) so it works without colour vision **(assumption)**; the exact look is in `design-guide.md`.\n- A mark only says \"this number repeats\". A digit that does not repeat is never marked, even if it is wrong in the end.\n- After a change that creates a new repeat, W-12 may put the \"Repeats\" text from `copy.md` in `#message` (no digits), and clear it when no repeat remains **(assumption)**.\n\n`SD.conflicts` is also used by hints (the `repeat` kind) and the win check.\n\n## Undo\n\nDone-when item 6. History lives in `SD.state.history`; W-8's `applyMove` pushes to it, and W-11 only reads and pops.\n\n- Snapshot: `{i, v, n}` = cell index, its value before, its notes before. One snapshot per digit, erase or note move.\n- Cap: 100 snapshots; the oldest is dropped.\n- `SD.undo()`: if `history` is empty, do nothing (no error, no message needed). Otherwise pop the last snapshot, restore `values[i]` and `notes[i]`, select that cell, set `hintCell = -1`, `won = false`, render, and send `change` with kind `undo`.\n- Undo is never recorded in history.\n- `SD.newGame` and `SD.setGame` with no history clear it. Switching notes mode is not a move.\n- Peer notes are not changed when a digit is entered, so one move changes one cell **(assumption)**.\n- `#undo` stays enabled; with empty history it simply does nothing, so tap-target checks always find it.\n\n## Save\n\nDone-when item 11. W-15 owns `SD.save`.\n\n- **Where:** `localStorage`, key `sudoku.save.v1`. Nothing else is stored. No cookies, no network, no tracking.\n- **Format:** JSON `{v: 1, level, puzzle: \"<81 chars 0-9>\", values: \"<81 chars 0-9>\", notes: [81 ints], history: [[i, v, n], \u2026]}` (history capped at 100). No solution, no timestamps.\n- **When to write:** after `change`, `newgame` and `restore`. Not while the game is won, and not while a continue choice is pending and the board was not changed.\n- **When to clear:** on `win` (so a finished game is not offered again) and in `#win-new`.\n- **Safety:** every `getItem`, `setItem` and `removeItem` is inside `try/catch`. If storage is unavailable or full, the game keeps working without saving and nothing throws.\n- **Validation on read:** parse inside `try/catch`; require `v === 1`, `level` one of the three keys, 81-char digit strings, every non-zero `puzzle` char equal to the same `values` char, `notes` an array of 81 ints from 0 to 511 with 0 where a value exists, and each history entry well formed. Also reject a save that is already complete with no repeats. Anything invalid is removed and ignored.\n- **Boot with a valid save** (done by `SD.boot`, W-17): call `SD.setGame` with the save, send `restore`, mark the level button, render, then `SD.showContinue()` shows `#continue-prompt`. This prompt is a modal overlay with `#continue-btn` (\"Continue\") and a second button labelled \"New puzzle\" that has `data-action=\"new\"` (no new id). Continue hides the prompt. New puzzle hides it and calls `SD.newGame(SD.state.level)`. The saved game is already on the board behind the prompt and unchanged in storage, so closing the tab at that moment loses nothing.\n- **Boot with no valid save:** `SD.newGame('easy')`.\n\n## DOM contract\n\nExact names. A workflow creates only what its row lists, plus the layout classes in Structure. Every button is a `<button type=\"button\">` with the base class `.j2-btn`, text from `copy.md`, and an `aria-label` where the text alone is not enough. No `form`, no `iframe`, no external URL. Panels and overlays use the `hidden` attribute, with `[hidden] { display: none !important; }` in the W-5 base CSS.\n\n| Hook | Element | Owner | Notes |\n|---|---|---|---|\n| `h1` | page title \"Sudoku\" | W-5 | |\n| `nav` | first element in `body` | W-5 | One link, `href=\"#board\"`. This is the only in-page link. |\n| start button | `<button class=\"j2-btn\" data-action=\"start\">` | W-5 | In the header **(assumption)**. W-17 wires it to select the first empty cell and scroll to `#board`. |\n| `#app` | grid container | W-5 | |\n| `#board` | grid container (`role=\"grid\"`-like, 9\u00d79) | W-5 creates, W-7 fills | One only |\n| `#pad` | pad container | W-5 creates, W-8 fills | One only |\n| `#message` | `role=\"status\"`, `aria-live=\"polite\"` | W-5 | Written only with `SD.say` |\n| `.j2-btn` | base button class | W-5 style | Used on every button |\n| `#engine-script` | `<script>` | W-6 | One only |\n| `.cell` | 81 `<button>` in `#board` | W-7 | `data-row` and `data-col` (0 to 8). Box borders thicker at rows and columns 3 and 6. Built once at load. Click handling by delegation on `#board`. |\n| `.given` | class on a `.cell` | W-7 | Puzzle digit, fixed |\n| `.player` | class on a `.cell` | W-7 | Digit the player entered |\n| `.selected` | class on a `.cell` | W-7 | At most one |\n| `.pad-digit` | 9 buttons in `#pad` | W-8 | Also `.j2-btn`, `data-digit=\"1\"` to `\"9\"`, labelled 1 to 9 |\n| `#erase` | button in `#pad` | W-8 | Labelled Erase |\n| `.level-btn` | 3 butt
