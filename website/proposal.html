<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreya 💍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --crimson: #C41E3A;
            --deep-red: #7B0018;
            --light-crimson: #E02040;
            --pale-rose: #FFE8EC;
            --white: #FFFFFF;
            --cream: #FFF8F9;
            --gold: #D4AF37;
            --dark-text: #2C0010;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, #4A0015 0%, #1E0008 45%, #0A0003 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            position: relative;
            cursor: default;
        }

        /* ── Background floating hearts ── */
        #hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            bottom: -30px;
            user-select: none;
            animation: floatUp linear infinite;
            will-change: transform;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0)       rotate(0deg)   scale(1);    opacity: 0;   }
            8%   {                                                              opacity: 1;   }
            88%  {                                                              opacity: 0.4; }
            100% { transform: translateY(-110vh)  rotate(540deg) scale(0.6);  opacity: 0;   }
        }

        /* ── Proposal card ── */
        #proposal-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(160deg, #FFFFFF 0%, #FFF2F5 55%, #FFE4EA 100%);
            border-radius: 28px;
            padding: 64px 72px 56px;
            max-width: 600px;
            width: 92%;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(196, 30, 58, 0.12),
                0 2px 4px  rgba(0, 0, 0, 0.15),
                0 12px 40px rgba(0, 0, 0, 0.45),
                0 40px 80px rgba(0, 0, 0, 0.3),
                0 0 100px  rgba(196, 30, 58, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            animation: cardIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* Gold border glow */
        #proposal-card::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 29.5px;
            background: linear-gradient(
                135deg,
                rgba(196, 30, 58, 0.4)  0%,
                rgba(212, 175, 55, 0.35) 40%,
                rgba(196, 30, 58, 0.4)  100%
            );
            z-index: -1;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.82) translateY(28px); }
            to   { opacity: 1; transform: scale(1)    translateY(0);    }
        }

        .ring-icon {
            font-size: 58px;
            display: block;
            margin-bottom: 12px;
            animation: ringFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(196,30,58,0.35));
        }

        @keyframes ringFloat {
            0%, 100% { transform: translateY(0)   rotate(-6deg) scale(1);    }
            50%      { transform: translateY(-8px) rotate( 6deg) scale(1.08); }
        }

        .script-name {
            font-family: 'Great Vibes', cursive;
            font-size: 58px;
            color: var(--crimson);
            line-height: 1.1;
            text-shadow:
                0 2px 6px  rgba(196, 30, 58, 0.18),
                0 0  28px  rgba(196, 30, 58, 0.08);
        }

        .gold-divider {
            width: 90px;
            height: 1.5px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 22px auto 20px;
        }

        .question {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 600;
            color: var(--dark-text);
            line-height: 1.35;
            letter-spacing: 0.2px;
        }

        .caption {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-style: italic;
            font-weight: 400;
            color: rgba(196, 30, 58, 0.65);
            margin-top: 10px;
            margin-bottom: 44px;
            letter-spacing: 0.3px;
        }

        /* ── Buttons ── */
        .buttons {
            display: flex;
            gap: 22px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        #yes-btn {
            background: linear-gradient(145deg, #D42040 0%, #A01530 100%);
            color: #fff;
            border: none;
            padding: 17px 52px;
            border-radius: 50px;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 4px 16px rgba(196, 30, 58, 0.5),
                0 2px 6px  rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #yes-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.5s ease;
        }

        #yes-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow:
                0 8px 28px rgba(196, 30, 58, 0.6),
                0 4px 12px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        #yes-btn:hover::after { left: 140%; }

        #yes-btn:active {
            transform: translateY(0) scale(0.97);
            box-shadow: 0 2px 10px rgba(196, 30, 58, 0.4);
        }

        #no-btn {
            background: transparent;
            color: #aaa;
            border: 1.5px solid #ddd;
            padding: 15px 34px;
            border-radius: 50px;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 300;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: color 0.15s, border-color 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }

        #no-btn:hover {
            color: #888;
            border-color: #ccc;
        }

        /* escaped state — position: fixed, no transition */
        #no-btn.escaped {
            position: fixed;
            z-index: 9999;
            transition: none !important;
        }

        /* ── Yes celebration screen ── */
        #yes-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: linear-gradient(145deg, #8B0018 0%, #C41E3A 45%, #E02040 100%);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px 32px;
            overflow: hidden;
        }

        #yes-screen.show {
            display: flex;
            animation: yesIn 0.7s ease both;
        }

        @keyframes yesIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .yes-ring {
            font-size: 72px;
            display: block;
            margin-bottom: 20px;
            animation: yesRing 1s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
            filter: drop-shadow(0 6px 20px rgba(0,0,0,0.3));
        }

        @keyframes yesRing {
            from { opacity: 0; transform: scale(0.3) rotate(-180deg); }
            to   { opacity: 1; transform: scale(1)   rotate(0deg);    }
        }

        .yes-headline {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(54px, 11vw, 96px);
            color: #fff;
            text-shadow:
                0 4px 20px rgba(0,0,0,0.25),
                0 0  40px  rgba(255,200,200,0.2);
            animation: yesSlide 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
        }

        .yes-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(17px, 3vw, 24px);
            font-style: italic;
            color: rgba(255, 255, 255, 0.88);
            max-width: 440px;
            line-height: 1.7;
            margin-top: 18px;
            animation: yesSlide 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.75s both;
        }

        .yes-hearts-row {
            margin-top: 28px;
            font-size: 36px;
            letter-spacing: 14px;
            animation: yesSlide 0.9s cubic-bezier(0.34,1.56,0.64,1) 1s both;
        }

        @keyframes yesSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0);     }
        }

        /* Falling hearts on yes screen */
        .fall-heart {
            position: fixed;
            pointer-events: none;
            z-index: 501;
            user-select: none;
            animation: fallDown linear forwards;
            will-change: transform;
        }

        @keyframes fallDown {
            0%   { transform: translateY(-60px) rotate(0deg)   scale(1);   opacity: 1;   }
            100% { transform: translateY(110vh) rotate(600deg) scale(0.4); opacity: 0.2; }
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            #proposal-card {
                padding: 44px 28px 40px;
            }
            .script-name  { font-size: 44px; }
            .question     { font-size: 24px; }
            #yes-btn      { padding: 15px 40px; font-size: 18px; }
            #no-btn       { padding: 13px 26px; font-size: 15px; }
        }
    </style>
</head>
<body>

<!-- Background ambient hearts -->
<div id="hearts-bg"></div>

<!-- ── Proposal card ── -->
<div id="proposal-card">
    <span class="ring-icon">💍</span>
    <div class="script-name">Shreya</div>
    <div class="gold-divider"></div>
    <div class="question">Will you marry me?</div>
    <p class="caption">From the very first moment, I knew it was you.</p>
    <div class="buttons">
        <button id="yes-btn">Yes, always 💕</button>
        <button id="no-btn">No</button>
    </div>
</div>

<!-- ── Celebration screen ── -->
<div id="yes-screen">
    <span class="yes-ring">💍</span>
    <div class="yes-headline">She said Yes!</div>
    <p class="yes-sub">
        I knew you would, Shreya.<br>
        You've made me the happiest person in the world.
    </p>
    <div class="yes-hearts-row">❤️ 💍 ❤️</div>
</div>

<script>
    /* ── Background ambient hearts ── */
    const heartsBg   = document.getElementById('hearts-bg');
    const bgSymbols  = ['♥', '❤', '♡', '✿'];

    function spawnBgHeart() {
        const el       = document.createElement('span');
        el.className   = 'bg-heart';
        el.textContent = bgSymbols[Math.floor(Math.random() * bgSymbols.length)];
        const size     = Math.random() * 22 + 8;
        const dur      = Math.random() * 14 + 9;
        const delay    = Math.random() * 4;
        const alpha    = (Math.random() * 0.14 + 0.04).toFixed(2);
        const rgb      = Math.random() > 0.6 ? '255,180,190' : '196,30,58';
        el.style.cssText = `
            left: ${Math.random() * 100}%;
            font-size: ${size}px;
            animation-duration: ${dur}s;
            animation-delay: ${delay}s;
            color: rgba(${rgb},${alpha});
        `;
        heartsBg.appendChild(el);
        setTimeout(() => el.remove(), (dur + delay) * 1000 + 500);
    }

    for (let i = 0; i < 22; i++) spawnBgHeart();
    setInterval(spawnBgHeart, 700);


    /* ── No button — flee on cursor proximity (desktop) & tap (mobile) ── */
    const noBtn = document.getElementById('no-btn');
    let isEscaped   = false;
    let tapCount    = 0;
    const THRESHOLD = 130; // px proximity that triggers escape

    function randomPosition() {
        const pad  = 90;
        const btnW = noBtn.offsetWidth  || 110;
        const btnH = noBtn.offsetHeight || 50;
        const maxX = window.innerWidth  - btnW - pad;
        const maxY = window.innerHeight - btnH - pad;
        return {
            x: Math.random() * (maxX - pad) + pad,
            y: Math.random() * (maxY - pad) + pad,
        };
    }

    function teleportNo() {
        if (!isEscaped) {
            isEscaped = true;
            noBtn.classList.add('escaped');
        }
        const { x, y } = randomPosition();
        noBtn.style.left = x + 'px';
        noBtn.style.top  = y + 'px';
    }

    document.addEventListener('mousemove', (e) => {
        if (noBtn.style.display === 'none') return;
        const r    = noBtn.getBoundingClientRect();
        const cx   = r.left + r.width  / 2;
        const cy   = r.top  + r.height / 2;
        const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
        if (dist < THRESHOLD) teleportNo();
    });

    /* Mobile: jump on every tap attempt */
    noBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        tapCount++;
        teleportNo();
        /* Shrink after repeated taps so it eventually becomes unreachable */
        if (tapCount > 4) {
            const scale = Math.max(0.45, 1 - tapCount * 0.09);
            noBtn.style.transform = `scale(${scale})`;
        }
    }, { passive: false });

    /* Keep it on-screen after resize */
    window.addEventListener('resize', () => {
        if (isEscaped) teleportNo();
    });


    /* ── Web Audio chime ── */
    function playChime() {
        try {
            const ctx   = new (window.AudioContext || window.webkitAudioContext)();
            // C major arpeggio: C5 E5 G5 C6
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type            = 'sine';
                osc.frequency.value = freq;
                const t = ctx.currentTime + i * 0.20;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.22, t + 0.06);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
                osc.start(t);
                osc.stop(t + 1.5);
            });
        } catch (_) { /* silent fail if audio not available */ }
    }


    /* ── Falling hearts on celebration ── */
    const fallEmojis = ['❤️','💕','💖','💗','💝','🌹','💍','✨'];

    function spawnFallHeart() {
        const el       = document.createElement('span');
        el.className   = 'fall-heart';
        el.textContent = fallEmojis[Math.floor(Math.random() * fallEmojis.length)];
        const size     = Math.random() * 28 + 18;
        const dur      = Math.random() * 3.5 + 2;
        el.style.cssText = `
            left: ${Math.random() * 100}vw;
            top: -60px;
            font-size: ${size}px;
            animation-duration: ${dur}s;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 300);
    }


    /* ── Yes button ── */
    document.getElementById('yes-btn').addEventListener('click', () => {
        playChime();

        /* Hide the escaped No button so it can't interfere */
        noBtn.style.display = 'none';

        /* Show celebration screen */
        const screen = document.getElementById('yes-screen');
        screen.classList.add('show');

        /* Initial burst of falling hearts */
        let count = 0;
        const burst = setInterval(() => {
            spawnFallHeart();
            if (++count >= 55) clearInterval(burst);
        }, 130);

        /* Gentle continuous rain afterward */
        setTimeout(() => {
            setInterval(spawnFallHeart, 700);
        }, 8000);
    });
</script>
</body>
</html>
