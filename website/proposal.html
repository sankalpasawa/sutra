<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0002" />
  <title>Shreya 💍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset & tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson:       #B5172F;
      --crimson-deep:  #880F22;
      --crimson-mid:   #C9253F;
      --crimson-soft:  rgba(181,23,47,.12);
      --gold:          #C9A84C;
      --gold-pale:     #E8D49A;
      --white:         #FFFFFF;
      --ink:           #1A0009;
      --ink-soft:      #5C1D2C;
      --card-bg:       #FFFBFC;
      --radius-card:   28px;
      --shadow-card:
        0 0 0 1px rgba(201,168,76,.14),
        0 2px  4px  rgba(0,0,0,.10),
        0 10px 30px rgba(0,0,0,.38),
        0 36px 72px rgba(0,0,0,.22),
        0 0   140px rgba(181,23,47,.08);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 35%, #200009 0%, #0c0003 55%, #040001 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ─── Canvas bg ──────────────────────────────────────────── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Card ───────────────────────────────────────────────── */
    #card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      width: min(540px, 92vw);
      padding: clamp(44px,9vw,72px) clamp(28px,7vw,64px) clamp(36px,8vw,60px);
      text-align: center;
      box-shadow: var(--shadow-card);
      animation: cardIn .9s cubic-bezier(.22,1,.36,1) both;
      overflow: visible;
    }

    /* Gold-crimson shimmer border */
    #card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: calc(var(--radius-card) + 1px);
      background: linear-gradient(
        145deg,
        rgba(201,168,76,.5) 0%,
        rgba(181,23,47,.35) 35%,
        rgba(201,168,76,.45) 65%,
        rgba(181,23,47,.3) 100%
      );
      z-index: -1;
    }

    /* Subtle inner warmth */
    #card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
      background: radial-gradient(ellipse at 50% 0%, rgba(255,235,235,.6) 0%, transparent 65%);
      pointer-events: none;
    }

    @keyframes cardIn {
      from { opacity:0; transform: scale(.92) translateY(24px); }
      to   { opacity:1; transform: scale(1)   translateY(0);    }
    }

    /* ─── Ornament ───────────────────────────────────────────── */
    .ornament {
      display: block;
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 8px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 6px 18px rgba(181,23,47,.3));
      position: relative;
      z-index: 1;
    }

    @keyframes float {
      0%,100% { transform: translateY(0)    rotate(-4deg) scale(1);    }
      50%     { transform: translateY(-9px) rotate( 4deg) scale(1.07); }
    }

    /* ─── Name ───────────────────────────────────────────────── */
    .name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(52px, 14vw, 72px);
      color: var(--crimson);
      line-height: 1.1;
      letter-spacing: .5px;
      text-shadow:
        0 2px 8px rgba(181,23,47,.18),
        0 0 40px rgba(181,23,47,.06);
      position: relative;
      z-index: 1;
    }

    /* ─── Divider ─────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: clamp(16px,4vw,24px) auto;
    }

    .divider-line {
      flex: 1;
      max-width: 72px;
      height: 1px;
      background: linear-gradient(to var(--dir, right), transparent, rgba(201,168,76,.55));
    }
    .divider-line:last-child { --dir: left; }

    .divider-gem {
      color: var(--gold);
      font-size: 13px;
      opacity: .8;
      letter-spacing: 4px;
    }

    /* ─── Question ───────────────────────────────────────────── */
    .question {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(24px, 6vw, 34px);
      font-style: italic;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: .2px;
      position: relative;
      z-index: 1;
    }

    .caption {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 3.5vw, 17px);
      font-style: italic;
      font-weight: 400;
      color: var(--ink-soft);
      margin-top: 10px;
      margin-bottom: clamp(32px, 7vw, 48px);
      letter-spacing: .3px;
      opacity: .75;
      position: relative;
      z-index: 1;
    }

    /* ─── Buttons ─────────────────────────────────────────────── */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* Yes — primary */
    #yes-btn {
      width: 100%;
      max-width: 320px;
      padding: clamp(15px,4vw,18px) 24px;
      background: linear-gradient(150deg, var(--crimson-mid) 0%, var(--crimson-deep) 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px,4.5vw,22px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 18px rgba(181,23,47,.45),
        0 2px  6px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.14);
      transition: transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* shimmer sweep */
    #yes-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -80%;
      width: 55%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform: skewX(-15deg);
      transition: left .55s ease;
    }

    #yes-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 8px 28px rgba(181,23,47,.55),
        0 4px 10px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    #yes-btn:hover::after { left: 130%; }

    #yes-btn:active { transform: translateY(0) scale(.97); }

    /* No — ghost */
    #no-btn {
      padding: 11px 28px;
      background: transparent;
      color: #bbb;
      border: 1px solid rgba(200,200,200,.5);
      border-radius: 50px;
      font-family: 'Lato', sans-serif;
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 300;
      letter-spacing: .6px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    #no-btn:hover  { color: #999; border-color: rgba(180,180,180,.7); }

    /* when escaped: fixed, width auto */
    #no-btn.escaped {
      position: fixed;
      z-index: 9999;
      transition: none !important;
      width: auto;
    }

    /* ─── Yes screen ──────────────────────────────────────────── */
    #yes-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 600;
      background: radial-gradient(ellipse at 50% 40%, #8B0F22 0%, #B5172F 45%, #C9253F 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(32px,8vw,60px) clamp(24px,6vw,48px);
      overflow: hidden;
    }

    #yes-screen.show {
      display: flex;
      animation: fadeIn .65s ease both;
    }

    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }

    /* canvas for falling hearts lives here */
    #fall-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 601;
    }

    .yes-ring {
      font-size: clamp(64px,16vw,88px);
      line-height: 1;
      display: block;
      margin-bottom: 16px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.3));
      animation: ringIn .9s cubic-bezier(.34,1.56,.64,1) .35s both;
      position: relative;
      z-index: 602;
    }

    @keyframes ringIn {
      from { opacity:0; transform: scale(.2) rotate(-160deg); }
      to   { opacity:1; transform: scale(1)  rotate(0deg);    }
    }

    .yes-headline {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(56px,14vw,100px);
      color: #fff;
      line-height: 1.1;
      text-shadow: 0 4px 24px rgba(0,0,0,.22), 0 0 60px rgba(255,210,210,.2);
      animation: slideUp .9s cubic-bezier(.22,1,.36,1) .5s both;
      position: relative;
      z-index: 602;
    }

    .yes-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(17px,4vw,24px);
      font-style: italic;
      color: rgba(255,255,255,.88);
      max-width: 400px;
      line-height: 1.75;
      margin-top: 18px;
      animation: slideUp .9s cubic-bezier(.22,1,.36,1) .72s both;
      position: relative;
      z-index: 602;
    }

    .yes-row {
      margin-top: 28px;
      font-size: clamp(28px,7vw,40px);
      letter-spacing: 14px;
      animation: slideUp .9s cubic-bezier(.22,1,.36,1) .94s both;
      position: relative;
      z-index: 602;
    }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(22px); }
      to   { opacity:1; transform: translateY(0);    }
    }

    /* ─── Responsive tweaks ─────────────────────────────────── */
    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
        justify-content: center;
      }
      #yes-btn {
        width: auto;
        max-width: none;
        padding: 16px 52px;
      }
    }
  </style>
</head>
<body>

<!-- Ambient particle canvas -->
<canvas id="bg-canvas"></canvas>

<!-- ── Proposal card ── -->
<div id="card">
  <span class="ornament">💍</span>
  <div class="name">Shreya</div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-gem">✦</span>
    <div class="divider-line"></div>
  </div>

  <div class="question">Will you marry me?</div>
  <p class="caption">From the very first moment, I knew it was you.</p>

  <div class="btn-group">
    <button id="yes-btn">Yes, always 💕</button>
    <button id="no-btn">No</button>
  </div>
</div>

<!-- ── Celebration screen ── -->
<div id="yes-screen">
  <span class="yes-ring">💍</span>
  <div class="yes-headline">She said Yes!</div>
  <p class="yes-sub">
    I always knew you would, Shreya.<br>
    You are my forever.
  </p>
  <div class="yes-row">❤️ 💍 ❤️</div>
</div>

<!-- Canvas for falling hearts on yes screen -->
<canvas id="fall-canvas" style="display:none"></canvas>

<script>
/* ═══════════════════════════════════════════════
   BACKGROUND — canvas heart particles
═══════════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function heartPath(ctx, x, y, r) {
    /* Smooth two-lobe heart centred at (x, y) with radius r */
    ctx.save();
    ctx.translate(x, y - r * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.4);
    ctx.bezierCurveTo(-r * .2, r * .1, -r,  -r * .3, -r * .5, -r * .75);
    ctx.bezierCurveTo(-r * .2, -r * 1.1, 0, -r * .9, 0, -r * .65);
    ctx.bezierCurveTo(0, -r * .9, r * .2, -r * 1.1, r * .5, -r * .75);
    ctx.bezierCurveTo(r, -r * .3, r * .2, r * .1, 0, r * .4);
    ctx.closePath();
    ctx.restore();
  }

  const COLOURS = [
    'rgba(181,23,47,',
    'rgba(220,100,120,',
    'rgba(255,180,190,',
  ];

  function mkParticle() {
    const r     = Math.random() * 7 + 3;
    const alpha = Math.random() * 0.13 + 0.03;
    return {
      x:     Math.random() * window.innerWidth,
      y:     window.innerHeight + r * 2,
      r,
      speed: Math.random() * 0.55 + 0.25,
      drift: (Math.random() - 0.5) * 0.35,
      rot:   Math.random() * Math.PI * 2,
      drot:  (Math.random() - 0.5) * 0.012,
      col:   COLOURS[Math.floor(Math.random() * COLOURS.length)],
      alpha,
    };
  }

  const POOL = Array.from({ length: 28 }, mkParticle);
  /* scatter initial y positions so they don't all start from bottom */
  POOL.forEach(p => { p.y = Math.random() * window.innerHeight; });

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    POOL.forEach(p => {
      p.y   -= p.speed;
      p.x   += p.drift;
      p.rot += p.drot;

      if (p.y < -p.r * 3) {
        Object.assign(p, mkParticle());
        p.y = window.innerHeight + p.r * 2;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle   = p.col + p.alpha + ')';
      heartPath(ctx, 0, 0, p.r);
      ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();


/* ═══════════════════════════════════════════════
   NO BUTTON — flee on proximity / teleport on tap
═══════════════════════════════════════════════ */
(function () {
  const noBtn    = document.getElementById('no-btn');
  const REACH    = 140;   /* px — escape radius on desktop */
  let escaped    = false;
  let tapCount   = 0;

  function safePos() {
    const pad  = 80;
    const bw   = noBtn.offsetWidth  || 90;
    const bh   = noBtn.offsetHeight || 44;
    const maxX = window.innerWidth  - bw  - pad;
    const maxY = window.innerHeight - bh  - pad;
    return {
      x: Math.random() * (maxX - pad) + pad,
      y: Math.random() * (maxY - pad) + pad,
    };
  }

  function flee() {
    if (!escaped) {
      escaped = true;
      noBtn.classList.add('escaped');
    }
    const { x, y } = safePos();
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  }

  /* Desktop: proximity check */
  document.addEventListener('mousemove', e => {
    if (noBtn.style.display === 'none') return;
    const r    = noBtn.getBoundingClientRect();
    const dist = Math.hypot(e.clientX - (r.left + r.width/2),
                            e.clientY - (r.top  + r.height/2));
    if (dist < REACH) flee();
  });

  /* Mobile: teleport + shrink on tap */
  noBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    tapCount++;
    flee();
    if (tapCount > 3) {
      const s = Math.max(0.5, 1 - tapCount * 0.09);
      noBtn.style.transform = `scale(${s})`;
    }
  }, { passive: false });

  /* Stay on screen after resize */
  window.addEventListener('resize', () => { if (escaped) flee(); });
})();


/* ═══════════════════════════════════════════════
   YES BUTTON — chime + celebration
═══════════════════════════════════════════════ */
(function () {
  /* ── Web Audio chime ── */
  function chime() {
    try {
      const ac    = new (window.AudioContext || window.webkitAudioContext)();
      const freqs = [523.25, 659.25, 783.99, 1046.5];   /* C E G C */
      freqs.forEach((f, i) => {
        const osc  = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.type            = 'sine';
        osc.frequency.value = f;
        const t = ac.currentTime + i * 0.19;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        osc.start(t);
        osc.stop(t + 1.7);
      });
    } catch (_) {}
  }

  /* ── Falling hearts on yes screen via canvas ── */
  const fc  = document.getElementById('fall-canvas');
  const fctx = fc.getContext('2d');
  let fallers = [];
  let fallActive = false;

  function resizeFall() {
    fc.width  = window.innerWidth;
    fc.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFall);

  function heartPath(ctx, x, y, r) {
    ctx.save();
    ctx.translate(x, y - r * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.4);
    ctx.bezierCurveTo(-r*.2, r*.1, -r, -r*.3, -r*.5, -r*.75);
    ctx.bezierCurveTo(-r*.2, -r*1.1, 0, -r*.9, 0, -r*.65);
    ctx.bezierCurveTo(0, -r*.9, r*.2, -r*1.1, r*.5, -r*.75);
    ctx.bezierCurveTo(r, -r*.3, r*.2, r*.1, 0, r*.4);
    ctx.closePath();
    ctx.restore();
  }

  const FALL_COLS = [
    [255, 255, 255],
    [255, 180, 190],
    [255, 230, 235],
    [255, 210, 215],
    [255, 245, 248],
  ];

  function spawnFaller() {
    const col = FALL_COLS[Math.floor(Math.random() * FALL_COLS.length)];
    fallers.push({
      x:     Math.random() * window.innerWidth,
      y:     -20,
      r:     Math.random() * 13 + 6,
      speed: Math.random() * 2.2 + 1.2,
      drift: (Math.random() - 0.5) * 1.2,
      rot:   Math.random() * Math.PI * 2,
      drot:  (Math.random() - 0.5) * 0.06,
      col,
      alpha: Math.random() * 0.4 + 0.55,
    });
  }

  let spawnTimer = null;
  let burstCount = 0;

  function startFall() {
    resizeFall();
    fc.style.display = 'block';

    /* Initial dense burst */
    burstCount = 0;
    spawnTimer = setInterval(() => {
      spawnFaller();
      spawnFaller();
      burstCount++;
      if (burstCount >= 30) {
        clearInterval(spawnTimer);
        /* Gentle continuous drift */
        spawnTimer = setInterval(spawnFaller, 380);
      }
    }, 80);

    fallActive = true;
    fallTick();
  }

  function fallTick() {
    if (!fallActive) return;
    fctx.clearRect(0, 0, fc.width, fc.height);

    fallers = fallers.filter(p => p.y < fc.height + 30);

    fallers.forEach(p => {
      p.y   += p.speed;
      p.x   += p.drift;
      p.rot += p.drot;

      const [r, g, b] = p.col;
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.globalAlpha = p.alpha;
      fctx.fillStyle   = `rgb(${r},${g},${b})`;
      heartPath(fctx, 0, 0, p.r);
      fctx.fill();
      fctx.restore();
    });

    requestAnimationFrame(fallTick);
  }

  /* ── Yes click handler ── */
  document.getElementById('yes-btn').addEventListener('click', () => {
    chime();
    document.getElementById('no-btn').style.display = 'none';
    document.getElementById('yes-screen').classList.add('show');
    startFall();
  });
})();
</script>
</body>
</html>
